      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Ρυθμίσεις</h2>

      <NotifyPanel flash={flash} watchError={watchError} />

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Εμφάνιση</h3>
      <div className="border-y-2 border-black py-4">
        <div className="flex border-2 border-black">
          {[["light", "Φωτεινό"], ["dark", "Σκούρο"], ["auto", "Αυτόματο"]].map(([k, label], i) => (
            <button key={k} onClick={() => setTheme(k)}
              className={`f-display flex-1 py-2.5 text-[12px] font-bold uppercase tracking-wide ${
                i > 0 ? "border-l-2 border-black" : ""} ${
                theme === k ? "bg-black text-white" : "bg-white text-neutral-500"}`}>
              {label}
            </button>
          ))}
        </div>
        <p className="f-text mt-2 text-[12px] text-neutral-500">
          Το «Αυτόματο» ακολουθεί τη ρύθμιση της συσκευής σου. Ισχύει μόνο σε αυτή τη συσκευή.
        </p>
      </div>

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Κρατήσεις</h3>
      <div className="divide-y divide-neutral-200 border-y-2 border-black">
        <Row label="Ακύρωση έως" hint="πόσο πριν την κράτηση κλείνει η ακύρωση">
          <Stepper value={s.cancel_cutoff_min} min={0} max={2880} step={30}
            format={fmtMinutes} onChange={(v) => set("cancel_cutoff_min", v)} />
        </Row>
        <Row label="Κρατήσεις ανά ημέρα" hint="ανά πελάτη">
          <Stepper value={s.max_per_day} min={1} max={5} onChange={(v) => set("max_per_day", v)} />
        </Row>
        <Row label="Ενεργές κρατήσεις" hint="πόσες μπορεί να έχει ανοιχτές">
          <Stepper value={s.max_active} min={1} max={20} onChange={(v) => set("max_active", v)} />
        </Row>
        <Row label="Κρατήσεις μπροστά" hint="πόσες μέρες μπροστά ανοίγει το πρόγραμμα">
          <Stepper value={s.max_days_ahead} min={1} max={60} suffix="μ" onChange={(v) => set("max_days_ahead", v)} />
        </Row>
      </div>

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Ωράριο και θέσεις</h3>
      <div className="divide-y divide-neutral-200 border-y-2 border-black">
        <Row label="Άνοιγμα">
          <Stepper value={s.open_hour} min={0} max={s.close_hour - 1} suffix=":00" onChange={(v) => set("open_hour", v)} />
        </Row>
        <Row label="Κλείσιμο">
          <Stepper value={s.close_hour} min={s.open_hour + 1} max={24} suffix=":00" onChange={(v) => set("close_hour", v)} />
        </Row>
        <Row label="Προεπιλεγμένες θέσεις" hint="0 = κλειστό, εκτός αν το ορίσεις αλλιώς ανά ώρα">
          <Stepper value={s.default_capacity} min={0} max={80} onChange={(v) => set("default_capacity", v)} />
        </Row>
      </div>

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Check-in και υπενθυμίσεις</h3>
      <div className="divide-y divide-neutral-200 border-y-2 border-black">
        <Row label="Check-in ανοίγει" hint="λεπτά πριν την ώρα">
          <Stepper value={s.checkin_before_min} min={5} max={120} suffix="'" onChange={(v) => set("checkin_before_min", v)} />
        </Row>
        <Row label="Check-in κλείνει" hint="λεπτά μετά την ώρα">
          <Stepper value={s.checkin_after_min} min={5} max={120} suffix="'" onChange={(v) => set("checkin_after_min", v)} />
        </Row>
        <Row label="Υπενθύμιση" hint="λεπτά πριν την κράτηση">
          <Stepper value={s.reminder_min} min={10} max={240} suffix="'" onChange={(v) => set("reminder_min", v)} />
        </Row>
      </div>

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Όνομα γυμναστηρίου</h3>
      <div className="border-y-2 border-black py-4">
        <input value={s.gym_name} onChange={(e) => set("gym_name", e.target.value)}
          className="f-text h-12 w-full border-2 border-black px-4 text-[15px] outline-none" />
      </div>

      <div className="mt-8">
        <Button disabled={saving} onClick={save}>{saving ? "Αποθήκευση…" : "Αποθήκευση ρυθμίσεων"}</Button>
      </div>

      <CleanupPanel flash={flash} onAuthFail={onAuthFail} />
      <div className="h-10" />
    </div>
  );
}

/* ---------- Στόχοι πελατών ----------
   Τι δήλωσε ο καθένας στις ρυθμίσεις της εφαρμογής του. Πάνω η
   σύνοψη ανά στόχο — πατάς έναν και μένουν μόνο όσοι τον έχουν. */
function Goals({ flash, onAuthFail }) {
  const [data, setData] = useState(null);
  const [filter, setFilter] = useState(null);

  const load = useCallback(async () => {
    const { data: d, error } = await rpc("admin_goals", {});
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { flash("Δεν φόρτωσαν οι στόχοι"); return; }
    setData(d || { counts: [], clients: [], with_goals: 0, total_clients: 0 });
  }, [flash, onAuthFail]);

  useEffect(() => { load(); }, [load]);

  const counts = (data && data.counts) || [];
  const all = (data && data.clients) || [];
  const rows = filter ? all.filter((c) => (c.goals || []).includes(filter)) : all;
  const max = counts.reduce((m, c) => Math.max(m, c.count), 0) || 1;
  const withOther = all.filter((c) => c.other).length;

  const fmtWhen = (s) => {
    if (!s) return "";
    const d = new Date(s);
    return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  };

  return (
    <div className="px-5 sm:px-6">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Στόχοι πελατών</h2>
      <p className="f-text mt-1 max-w-[56ch] text-[13px] leading-relaxed text-neutral-500">
        Ό,τι δήλωσε ο κάθε πελάτης στις ρυθμίσεις της εφαρμογής του. Μπορεί να
        διαλέξει όσους στόχους θέλει, ή να γράψει δικό του.
      </p>

      {data === null ? (
        <div className="f-text py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : all.length === 0 ? (
        <div className="f-text mt-6 border-2 border-dashed border-neutral-300 py-14 text-center text-[15px] text-neutral-500">
          Κανείς δεν έχει δηλώσει στόχους ακόμα.
        </div>
      ) : (
        <>
          <div className="mt-7 grid grid-cols-2 gap-3 sm:max-w-md sm:gap-4">
            <Kpi label="Δήλωσαν στόχους" value={`${data.with_goals} / ${data.total_clients}`} />
            <Kpi label="Έγραψαν δικό τους" value={withOther} />
          </div>

          <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">
            Πόσοι διάλεξαν τι
          </h3>
          <div className="mt-3 divide-y divide-neutral-200 border-y-2 border-black">
            {counts.map((c) => (
              <button key={c.key} onClick={() => setFilter(filter === c.key ? null : c.key)}
                className={`flex w-full items-center gap-3 py-2.5 text-left ${
                  filter === c.key ? "bg-neutral-100" : ""}`}>
                <span className="f-text w-[40%] shrink-0 truncate text-[14px]">{goalLabel(c.key)}</span>
                <span className="block h-[12px] flex-1 border border-black">
                  <span className="block h-full bg-black" style={{ width: `${(c.count / max) * 100}%` }} />
                </span>
                <span className="f-mono w-8 shrink-0 text-right text-[13px]">{c.count}</span>
              </button>
            ))}
          </div>

          <div className="mt-9 flex items-baseline justify-between gap-3">
            <h3 className="f-display text-[13px] font-bold uppercase tracking-wide text-neutral-500">
              Ανά πελάτη {filter && `· ${goalLabel(filter)}`}
            </h3>
            {filter && (
              <Button variant="ghost" size="sm" onClick={() => setFilter(null)}>Καθαρισμός φίλτρου</Button>
            )}
          </div>

          <div className="mt-3 divide-y divide-neutral-200 border-y-2 border-black">
            {rows.map((c) => (
              <div key={c.id} className="py-3.5">
                <div className="flex flex-wrap items-baseline justify-between gap-2">
                  <div className="f-text text-[15px]">{c.name}</div>
                  <span className="f-mono shrink-0 text-[12px] text-neutral-400">
                    {c.phone}{c.updated_at ? ` · ${fmtWhen(c.updated_at)}` : ""}
                  </span>
                </div>
                <div className="mt-2 flex flex-wrap gap-1.5">
                  {(c.goals || []).map((g) => (
                    <span key={g} className="f-display border border-black px-2 py-1 text-[11px] font-bold uppercase tracking-wide">
                      {goalLabel(g)}
                    </span>
                  ))}
                  {c.other && (
                    <span className="f-display border border-black bg-black px-2 py-1 text-[11px] font-bold uppercase tracking-wide text-white">
                      {c.other}
                    </span>
                  )}
                </div>
              </div>
            ))}
          </div>
        </>
      )}
      <div className="h-10" />
    </div>
  );
}

/* ---------- Newsletter ----------
   Μόνο όσοι έδωσαν ρητά τη συγκατάθεσή τους. Το φιλτράρισμα γίνεται
   μέσα στη βάση — όποιος δεν την έδωσε δεν επιστρέφεται καθόλου. */
function Newsletter({ flash, onAuthFail }) {
  const [rows, setRows] = useState(null);

  const load = useCallback(async () => {
    const { data, error } = await rpc("admin_marketing_list", {});
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { flash("Δεν φόρτωσε η λίστα"); return; }
    setRows(data || []);
  }, [flash, onAuthFail]);

  useEffect(() => { load(); }, [load]);

  const copyAll = async () => {
    const all = (rows || []).map((r) => r.email).join(", ");
    try { await navigator.clipboard.writeText(all); flash("Αντιγράφηκαν"); }
    catch (e) { flash("Η αντιγραφή δεν είναι διαθέσιμη"); }
  };

  const fmtSince = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  };

  return (
    <div className="px-5 sm:px-6">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Λίστα ενημερώσεων</h2>
      <p className="f-text mt-1 max-w-[56ch] text-[13px] leading-relaxed text-neutral-500">
        Πελάτες που επέλεξαν να λαμβάνουν ενημερώσεις για ομαδικά προγράμματα και προσφορές.
        Όσοι δεν το επέλεξαν δεν εμφανίζονται εδώ.
      </p>

      {rows === null ? (
        <div className="f-text py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : rows.length === 0 ? (
        <div className="f-text mt-6 border-2 border-dashed border-neutral-300 py-14 text-center text-[15px] text-neutral-500">
          Κανείς δεν έχει δηλώσει συμμετοχή ακόμα.
        </div>
      ) : (
        <>
          <div className="mt-7 grid grid-cols-2 gap-3 sm:max-w-md sm:gap-4">
            <Kpi label="Εγγεγραμμένοι" value={rows.length} />
          </div>

          <div className="mt-7 flex items-center gap-3">
            <Button variant="outline" size="sm" onClick={copyAll}>Αντιγραφή όλων των email</Button>
          </div>

          <div className="mt-4 divide-y divide-neutral-200 border-y-2 border-black">
            {rows.map((r, i) => (
              <div key={i} className="flex flex-wrap items-center justify-between gap-2 py-3">
                <div className="min-w-0">
                  <div className="f-text text-[15px]">{r.name}</div>
                  <div className="f-mono text-[13px] text-neutral-600">{r.email}</div>
                </div>
                <span className="f-mono shrink-0 text-[12px] text-neutral-400">
                  από {fmtSince(r.since)}
                </span>
              </div>
            ))}
          </div>
        </>
      )}
      <div className="h-10" />
    </div>
  );
}

/* Χρειάζεται για να εμφανίζονται οι ειδοποιήσεις. */
if ("serviceWorker" in navigator) {
  const reg = () => navigator.serviceWorker.register("./sw.js").catch(() => { /* αγνόησε */ });
  if (document.readyState === "complete") reg();
  else window.addEventListener("load", reg);
}

/* Το όνομα φαίνεται στην πρώτη κιόλας οθόνη, ακόμα και πριν τη
   σύνδεση, οπότε το ζητάμε από τη δημόσια app_settings. Αν ο
   διακομιστής αργήσει πάνω από 3 δευτερόλεπτα, ξεκινάμε με την
   εφεδρική τιμή αντί να μείνει η σελίδα στο «Φόρτωση…». */
async function loadBrand() {
  const timeout = new Promise((resolve) => setTimeout(() => resolve(null), 3000));
  const call = rpc("app_settings", {}).then((r) => (r.error ? null : r.data)).catch(() => null);
  const data = await Promise.race([call, timeout]);
  if (data && data.gym_name) setGymName(data.gym_name);
  else document.title = GYM_NAME + " — Διαχείριση";
  if (data && data.max_days_ahead) setMaxDaysAhead(data.max_days_ahead);
}

loadBrand().then(() => {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script>
</body>
</html>
