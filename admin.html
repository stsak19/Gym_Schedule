function Station({ flash, onAuthFail }) {
  const [scanning, setScanning] = useState(false);
  const [result, setResult] = useState(null);
  const [log, setLog] = useState([]);
  const [q, setQ] = useState("");
  const [rows, setRows] = useState([]);
  const [busy, setBusy] = useState(false);
  const abortRef = useRef(null);
  const timerRef = useRef(null);

  useEffect(() => () => {
    if (abortRef.current) abortRef.current.abort();
    if (timerRef.current) clearTimeout(timerRef.current);
  }, []);

  /* Το αποτέλεσμα μένει λίγο και σβήνει μόνο του, ώστε η οθόνη να
     είναι πάντα έτοιμη για τον επόμενο. */
  const show = useCallback((r) => {
    setResult(r);
    chime(true, !r.ok);
    if (timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setResult(null), 8000);
  }, []);

  const pass = useCallback(async (args) => {
    setBusy(true);
    const { data, error } = await rpc("admin_check_in_tag", args);
    setBusy(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data) { show({ ok: false, error: "Δεν πέρασε — δες τη σύνδεση" }); return; }
    show(data);
    if (data.ok) {
      setLog((prev) => [{ name: data.name, kind: data.kind, time: data.time, at: new Date() }, ...prev].slice(0, 8));
    }
  }, [onAuthFail, show]);

  const start = async () => {
    if (!NFC_OK) return;
    try {
      const reader = new NDEFReader();
      const ac = new AbortController();
      abortRef.current = ac;
      reader.onreading = (e) => {
        const token = tokenFromMessage(e.message);
        if (!token) { show({ ok: false, error: "Η κάρτα δεν είναι της εφαρμογής" }); return; }
        pass({ p_token: token, p_client_id: null });
      };
      reader.onreadingerror = () => show({ ok: false, error: "Δεν διαβάστηκε η κάρτα" });
      await reader.scan({ signal: ac.signal });
      setScanning(true);
      /* Το πάτημα είναι και η χειρονομία που ξεκλειδώνει τον ήχο. */
      wakeAudio();
    } catch (e) {
      flash("Δεν ξεκίνησε η ανάγνωση: " + (e.message || e));
    }
  };

  const stop = () => {
    if (abortRef.current) abortRef.current.abort();
    abortRef.current = null;
    setScanning(false);
  };

  useEffect(() => {
    const term = q.trim();
    if (!term) { setRows([]); return; }
    const t = setTimeout(async () => {
      const { data, error } = await rpc("admin_clients", { p_search: term });
      if (error === "AUTH") { onAuthFail(); return; }
      setRows((data || []).slice(0, 8));
    }, 300);
    return () => clearTimeout(t);
  }, [q, onAuthFail]);

  return (
    <div className="px-5 sm:px-6">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Είσοδος</h2>
      <p className="f-text mt-1 max-w-[54ch] text-[13px] leading-relaxed text-neutral-500">
        Άφησε αυτή την οθόνη ανοιχτή στη συσκευή της εισόδου. Κάθε κάρτα που ακουμπάει
        περνάει τον πελάτη — με κράτηση ή χωρίς.
      </p>

      <div className="mt-6 border-2 border-black">
        {result ? (
          <div className={`px-5 py-8 text-center ${result.ok ? "bg-black text-white" : "bg-white"}`}>
            {result.ok ? (
              <>
                <div className="f-display text-[30px] font-extrabold uppercase leading-none tracking-tight">
                  {result.first_name || result.name}
                </div>
                <div className="f-text mt-2 text-[15px] opacity-80">
                  {KIND_LABEL[result.kind] || "Πέρασε"}{result.time ? " · " + result.time : ""}
                </div>
              </>
            ) : (
              <>
                <div className="f-display text-[24px] font-extrabold uppercase leading-none tracking-tight">Στοπ</div>
                <div className="f-text mt-2 text-[15px] text-neutral-600">{result.error || "Κάτι πήγε στραβά"}</div>
              </>
            )}
          </div>
        ) : (
          <div className="px-5 py-10 text-center">
            <div className="f-display text-[22px] font-extrabold uppercase leading-none tracking-tight">
              {busy ? "…" : scanning ? "Ακούμπησε την κάρτα" : "Ο σταθμός είναι κλειστός"}
            </div>
            <div className="f-text mt-2 text-[13px] text-neutral-500">
              {scanning ? "Η οθόνη πρέπει να μένει ανοιχτή και ξεκλείδωτη." : "Πάτα «Έναρξη» για να αρχίσει η ανάγνωση."}
            </div>
          </div>
        )}
      </div>

      {NFC_OK && (
        <div className="mt-4 flex flex-wrap gap-2">
          {!scanning
            ? <Button onClick={start}>Έναρξη ανάγνωσης</Button>
            : <Button variant="outline" onClick={stop}>Παύση</Button>}
        </div>
      )}

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Χωρίς κάρτα</h3>
      <div className="border-t-2 border-black pt-4">
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Αναζήτηση με όνομα"
          className="f-text h-12 w-full max-w-md border-2 border-black px-4 text-[15px] outline-none" />
        {rows.length > 0 && (
          <div className="mt-3 max-w-md divide-y divide-neutral-200 border-2 border-black">
            {rows.map((r) => (
              <div key={r.id} className="flex items-center justify-between gap-3 px-4 py-3">
                <div className="min-w-0">
                  <div className="f-text truncate text-[15px]">{r.name}</div>
                  <div className="f-mono text-[12px] text-neutral-500">{r.phone}</div>
                </div>
                <Button size="sm" disabled={busy}
                  onClick={() => pass({ p_token: null, p_client_id: r.id })}>Πέρασέ τον</Button>
              </div>
            ))}
          </div>
        )}
      </div>

      {log.length > 0 && (
        <>
          <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Πέρασαν τώρα</h3>
          <div className="divide-y divide-neutral-200 border-t-2 border-black">
            {log.map((l, i) => (
              <div key={i} className="flex items-center justify-between gap-3 py-3">
                <span className="f-text truncate text-[15px]">{l.name}</span>
                <span className="f-mono shrink-0 text-[12px] text-neutral-500">
                  {KIND_LABEL[l.kind] || ""} · {String(l.at.getHours()).padStart(2, "0")}:{String(l.at.getMinutes()).padStart(2, "0")}
                </span>
              </div>
            ))}
          </div>
        </>
      )}
      <div className="h-10" />
    </div>
  );
}

/* ---------- Η κάρτα ενός πελάτη ----------
   Το κλειδί βγαίνει από τη βάση και γράφεται στην κάρτα με Web NFC —
   πάλι μόνο από Android με Chrome. Το «νέο κλειδί» ακυρώνει αμέσως
   την παλιά κάρτα, για χαμένες κάρτες. */
function CardPanel({ client, flash, onAuthFail, onChanged }) {
  const [token, setToken] = useState("");
  const [has, setHas] = useState(!!client.has_card);
  const [busy, setBusy] = useState("");
  const [site, setSite] = useState("");
  const [confirmRevoke, setConfirmRevoke] = useState(false);

  useEffect(() => {
    let alive = true;
    (async () => {
      const { data } = await rpc("admin_get_settings", {});
      if (!alive) return;
      setSite((((data && data.site_url) || "").trim()) || guessAppUrl());
    })();
    return () => { alive = false; };
  }, []);

  const cardUrl = token && site ? site + (site.includes("?") ? "&" : "?") + "card=" + token : "";

  const issue = async (rotate) => {
    setBusy(rotate ? "new" : "issue");
    const { data, error } = await rpc("admin_issue_card", { p_client_id: client.id, p_new: !!rotate });
    setBusy("");
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data || !data.ok) { flash((data && data.error) || "Δεν βγήκε κάρτα"); return; }
    setToken(data.token);
    setHas(true);
    if (rotate) flash("Νέο κλειδί — η παλιά κάρτα δεν δουλεύει πια");
    if (onChanged) onChanged();
  };

  const write = async () => {
    if (!cardUrl) return;
    setBusy("write");
    try {
      const w = new NDEFReader();
      await w.write({ records: [{ recordType: "url", data: cardUrl }] });
      flash("Η κάρτα γράφτηκε");
    } catch (e) {
      flash("Δεν γράφτηκε: " + (e.message || e));
    }
    setBusy("");
  };

  const revoke = async () => {
    setBusy("revoke");
    const { data, error } = await rpc("admin_revoke_card", { p_client_id: client.id });
    setBusy("");
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data || !data.ok) { flash("Δεν ακυρώθηκε"); return; }
    setToken(""); setHas(false); setConfirmRevoke(false);
    flash("Η κάρτα ακυρώθηκε");
    if (onChanged) onChanged();
  };

  return (
    <div className="mt-12 border-t-2 border-black pt-6">
      <h3 className="f-display text-[13px] font-bold uppercase tracking-wide text-neutral-500">Κάρτα εισόδου</h3>

      {!token ? (
        <>
          <p className="f-text mt-2 max-w-[56ch] text-[13px] leading-relaxed text-neutral-500">
            {has
              ? "Ο πελάτης έχει κάρτα. Άνοιξέ τη για να τη γράψεις σε καινούριο αυτοκόλλητο ή για να βγάλεις νέο κλειδί."
              : "Δώσε στον πελάτη κάρτα NFC. Ακουμπάει στη συσκευή της εισόδου και περνάει, με κράτηση ή χωρίς."}
          </p>
          <div className="mt-4 flex flex-wrap gap-2">
            <Button variant="outline" disabled={!!busy} onClick={() => issue(false)}>
              {busy === "issue" ? "…" : has ? "Άνοιγμα κάρτας" : "Έκδοση κάρτας"}
            </Button>
            {has && !confirmRevoke && (
              <Button variant="ghost" onClick={() => setConfirmRevoke(true)}>Ακύρωση κάρτας</Button>
            )}
          </div>
          {confirmRevoke && (
            <div className="mt-3 border-2 border-black p-4">
              <p className="f-text max-w-[56ch] text-[14px] leading-relaxed">
                Η κάρτα του/της <strong>{client.name}</strong> παύει να δουλεύει αμέσως.
              </p>
              <div className="mt-4 flex flex-wrap gap-2">
                <Button disabled={!!busy} onClick={revoke}>{busy === "revoke" ? "…" : "Ναι, ακύρωσέ τη"}</Button>
                <Button variant="ghost" onClick={() => setConfirmRevoke(false)}>Άκυρο</Button>
              </div>
            </div>
          )}
        </>
      ) : (
        <div className="mt-3 border-2 border-black p-4">
          <div className="f-display text-[11px] font-bold uppercase tracking-wide text-neutral-500">Κλειδί κάρτας</div>
          <div className="f-mono mt-1 break-all text-[15px]">{token}</div>
          <div className="f-mono mt-3 break-all text-[12px] text-neutral-500">{cardUrl}</div>

          {NFC_OK ? (
            <>
              <Button className="mt-4" disabled={!!busy} onClick={write}>
                {busy === "write" ? "Ακούμπησε την κάρτα…" : "Γράψιμο στην κάρτα"}
              </Button>
              <p className="f-text mt-2 max-w-[56ch] text-[13px] leading-relaxed text-neutral-500">
                Πάτα το κουμπί και ακούμπησε την άγραφη κάρτα στην πλάτη του κινητού.
              </p>
            </>
          ) : (
            <p className="f-text mt-4 max-w-[56ch] text-[13px] leading-relaxed text-neutral-600">
              Το γράψιμο κάρτας θέλει Android με Chrome. Άνοιξε τη σελίδα διαχείρισης από εκεί
              και ξαναμπές στην καρτέλα του πελάτη.
            </p>
          )}

          <div className="mt-5 flex flex-wrap gap-2 border-t border-neutral-300 pt-4">
            <Button variant="ghost" disabled={!!busy} onClick={() => issue(true)}>
              {busy === "new" ? "…" : "Νέο κλειδί (χάθηκε η κάρτα)"}
            </Button>
            <Button variant="ghost" onClick={() => setToken("")}>Κλείσιμο</Button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- People ---------- */
/* ---------- Πακέτο κρατήσεων ----------
   Ο διαχειριστής ορίζει πόσες κρατήσεις έχει ο πελάτης. Η βάση
   ξοδεύει μία σε κάθε κράτηση και την επιστρέφει σε κάθε ακύρωση
   (trigger bookings_credit), και κρατάει κάθε κίνηση στον credit_log.
   Στην ανανέωση ο credit_log του πελάτη σβήνεται και ξεκινάει καθαρός. */
const CREDIT_KIND = {
  renew: "Ανανέωση πακέτου",
  use: "Κράτηση",
  refund: "Επιστροφή (ακύρωση)",
  adjust: "Διόρθωση συνόλου",
};
const CREDIT_ROLE = { anon: "Πελάτης", authenticated: "Γραμματεία", service_role: "Σύστημα", system: "Σύστημα" };
const CREDIT_PRESETS = [4, 8, 12, 16, 20];

function athensParts(at) {
  const d = new Date(at);
  if (isNaN(d.getTime())) return { date: "", time: "" };
  const f = new Intl.DateTimeFormat("el-GR", {
    timeZone: "Europe/Athens", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(d);
  const g = (t) => (f.find((x) => x.type === t) || {}).value || "";
  return { date: `${g("day")}/${g("month")}/${g("year")}`, time: `${g("hour")}:${g("minute")}` };
}

/* ---------- Εξαγωγή σε PDF ----------
   Το pdfmake φτιάχνει κανονικούς πίνακες (γραμμές, στήλες, κεφαλίδα που
   ξαναβγαίνει σε κάθε σελίδα) και η γραμματοσειρά του, Roboto, έχει
   ελληνικά. Φορτώνεται μόνο τη στιγμή της εξαγωγής — είναι ~1 MB και
   δεν χρειάζεται να το κατεβάζει η σελίδα σε κάθε άνοιγμα. */
const PDFMAKE_SRC = "https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js";
const PDFMAKE_FONTS = "https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js";
let pdfmakeLoad = null;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error("network"));
    document.head.appendChild(el);
  });
}

function loadPdfMake() {
  if (window.pdfMake && window.pdfMake.vfs && Object.keys(window.pdfMake.vfs).length) {
    return Promise.resolve(window.pdfMake);
  }
  if (!pdfmakeLoad) {
    pdfmakeLoad = loadScript(PDFMAKE_SRC)
      .then(() => loadScript(PDFMAKE_FONTS))
      .then(() => {
        if (!window.pdfMake) throw new Error("no pdfmake");
        return window.pdfMake;
      })
      .catch((e) => { pdfmakeLoad = null; throw e; });
  }
  return pdfmakeLoad;
}

const PDF_INK = "#111111";
const PDF_MUTED = "#6B6B6B";
const PDF_LINE = "#BDBDBD";
const PDF_ZEBRA = "#F3F3F3";
const PDF_RED = "#B42318";
const PDF_RED_BG = "#FDECEA";
const KIND_COLOR = { use: PDF_INK, refund: "#1B7F3B", renew: "#1F4E99", adjust: "#8A5A00" };

const pdfGrid = {
  fillColor: (row) => (row === 0 ? PDF_INK : row % 2 === 0 ? PDF_ZEBRA : null),
  hLineWidth: () => 0.5,
  vLineWidth: () => 0.5,
  hLineColor: () => PDF_LINE,
  vLineColor: () => PDF_LINE,
  paddingLeft: () => 5,
  paddingRight: () => 5,
  paddingTop: () => 4,
  paddingBottom: () => 4,
};

const th = (text, alignment = "left") => ({ text, bold: true, color: "#FFFFFF", fontSize: 8.5, alignment });

function slotText(r) {
  if (!r.booking_date) return "—";
  const [y, m, d] = String(r.booking_date).split("-");
  return `${d}/${m}/${y}  ${r.booking_time || ""}`.trim();
}

/* Οι κινήσεις έρχονται ταξινομημένες ανά πελάτη και χρόνο. Η τελευταία
   κίνηση κάθε πελάτη είναι και η τωρινή του εικόνα. */
function groupCredits(rows) {
  const map = new Map();
  for (const r of rows) {
    const key = r.client_id || (r.name + "|" + r.phone);
    if (!map.has(key)) map.set(key, { name: r.name, phone: r.phone, rows: [] });
    map.get(key).rows.push(r);
  }
  return Array.from(map.values()).map((g) => {
    const last = g.rows[g.rows.length - 1];
    const renew = g.rows.find((x) => x.kind === "renew");
    return {
      ...g,
      total: last.total,
      used: last.used,
      remaining: last.remaining,
      since: renew ? athensParts(renew.at) : athensParts(g.rows[0].at),
    };
  });
}

function summaryStrip(g) {
  const cell = (label, value, danger) => ({
    stack: [
      { text: label, fontSize: 7.5, color: danger ? PDF_RED : PDF_MUTED },
      { text: String(value), fontSize: 15, bold: true, color: danger ? PDF_RED : PDF_INK, margin: [0, 2, 0, 0] },
    ],
    fillColor: danger ? PDF_RED_BG : null,
    margin: [4, 3, 4, 3],
  });
  return {
    table: {
      widths: ["*", "*", "*", "*"],
      body: [[
        cell("ΣΥΝΟΛΟ ΠΑΚΕΤΟΥ", g.total),
        cell("ΧΡΗΣΙΜΟΠΟΙΗΜΕΝΕΣ", g.used),
        cell("ΔΙΑΘΕΣΙΜΕΣ", g.remaining, Number(g.remaining) <= 0),
        cell("ΑΝΑΝΕΩΣΗ ΠΑΚΕΤΟΥ", `${g.since.date} ${g.since.time}`),
      ]],
    },
    layout: { hLineWidth: () => 0.8, vLineWidth: () => 0.8, hLineColor: () => PDF_INK, vLineColor: () => PDF_INK },
    margin: [0, 6, 0, 8],
  };
}

function detailTable(g) {
  const body = [[
    th("#", "center"), th("Ημερομηνία"), th("Ώρα"), th("Κίνηση"), th("Κράτηση για"),
    th("Από"), th("Σύνολο", "right"), th("Χρησιμοπ.", "right"), th("Διαθέσιμες", "right"),
  ]];
  g.rows.forEach((r, i) => {
    const when = athensParts(r.at);
    const zero = Number(r.remaining) <= 0;
    body.push([
      { text: String(i + 1), alignment: "center", color: PDF_MUTED },
      when.date,
      when.time,
      { text: CREDIT_KIND[r.kind] || r.kind, color: KIND_COLOR[r.kind] || PDF_INK, bold: r.kind === "renew" },
      slotText(r),
      CREDIT_ROLE[r.by_role] || r.by_role || "",
      { text: r.total === null || r.total === undefined ? "—" : String(r.total), alignment: "right" },
      { text: String(r.used), alignment: "right" },
      zero
        ? { text: "0", alignment: "right", bold: true, color: PDF_RED, fillColor: PDF_RED_BG }
        : { text: String(r.remaining), alignment: "right", bold: true },
    ]);
  });
  return {
    table: { headerRows: 1, dontBreakRows: true, widths: [22, 62, 36, "*", 92, 70, 48, 58, 62], body },
    layout: pdfGrid,
  };
}

function creditsDoc(rows, clientId) {
  const groups = groupCredits(rows);
  const now = athensParts(new Date().toISOString());
  const content = [
    {
      columns: [
        { stack: [
          { text: "ΠΑΚΕΤΑ ΚΡΑΤΗΣΕΩΝ", fontSize: 18, bold: true },
          { text: GYM_NAME, fontSize: 10, color: PDF_MUTED, margin: [0, 2, 0, 0] },
        ] },
        { stack: [
          { text: clientId ? groups[0].name : `Όλοι οι πελάτες (${groups.length})`, fontSize: 12, bold: true, alignment: "right" },
          { text: clientId ? groups[0].phone : "", fontSize: 9, color: PDF_MUTED, alignment: "right" },
          { text: `Εξαγωγή: ${now.date} ${now.time}`, fontSize: 8.5, color: PDF_MUTED, alignment: "right", margin: [0, 2, 0, 0] },
        ] },
      ],
    },
    { canvas: [{ type: "line", x1: 0, y1: 0, x2: 786, y2: 0, lineWidth: 1.5, lineColor: PDF_INK }], margin: [0, 8, 0, 10] },
  ];

  if (!clientId) {
    const body = [[
      th("Πελάτης"), th("Κινητό"), th("Ανανέωση πακέτου"),
      th("Σύνολο", "right"), th("Χρησιμοποιημένες", "right"), th("Διαθέσιμες", "right"), th("Κινήσεις", "right"),
    ]];
    for (const g of groups) {
      const zero = Number(g.remaining) <= 0;
      body.push([
        { text: g.name, bold: true },
        g.phone,
        `${g.since.date} ${g.since.time}`,
        { text: String(g.total ?? "—"), alignment: "right" },
        { text: String(g.used), alignment: "right" },
        zero
          ? { text: "0", alignment: "right", bold: true, color: PDF_RED, fillColor: PDF_RED_BG }
          : { text: String(g.remaining), alignment: "right", bold: true },
        { text: String(g.rows.length), alignment: "right", color: PDF_MUTED },
      ]);
    }
    content.push({ text: "Σύνοψη", fontSize: 12, bold: true, margin: [0, 0, 0, 6] });
    content.push({
      table: { headerRows: 1, dontBreakRows: true, widths: ["*", 80, 110, 55, 90, 70, 55], body },
      layout: pdfGrid,
    });
  }

  groups.forEach((g, i) => {
    if (!clientId) {
      content.push({
        text: g.name + "  ·  " + g.phone, fontSize: 12, bold: true,
        margin: [0, 18, 0, 0],
        pageBreak: i === 0 ? "before" : undefined,
        headlineLevel: 1,
      });
    }
    content.push(summaryStrip(g));
    content.push(detailTable(g));
  });

  content.push({
    text: [
      { text: "Πώς διαβάζεται: ", bold: true },
      "Κράτηση = ο πελάτης έκλεισε ώρα και ξοδεύτηκε μία. ",
      "Επιστροφή = ακύρωσε και η κράτηση γύρισε πίσω. ",
      "Ανανέωση πακέτου = ξεκίνησε νέο πακέτο από το μηδέν. ",
      "Διόρθωση συνόλου = άλλαξε μόνο το σύνολο. ",
      "Οι στήλες Σύνολο, Χρησιμοπ. και Διαθέσιμες δείχνουν την κατάσταση αμέσως μετά από κάθε κίνηση.",
    ],
    fontSize: 8, color: PDF_MUTED, margin: [0, 14, 0, 0],
  });

  return {
    pageSize: "A4",
    pageOrientation: "landscape",
    pageMargins: [28, 32, 28, 36],
    info: { title: "Πακέτα κρατήσεων — " + GYM_NAME },
    defaultStyle: { font: "Roboto", fontSize: 9, color: PDF_INK },
    /* Ο τίτλος πελάτη να μη μένει μόνος του στο κάτω μέρος της σελίδας. */
    pageBreakBefore: (node, following) =>
      node.headlineLevel === 1 && following.length < 3,
    footer: (page, pages) => ({
      columns: [
        { text: GYM_NAME + " · Πακέτα κρατήσεων", color: PDF_MUTED },
        { text: `Σελίδα ${page} / ${pages}`, alignment: "right", color: PDF_MUTED },
      ],
      fontSize: 8,
      margin: [28, 12, 28, 0],
    }),
    content,
  };
}

function fileStamp() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function fileSafe(name) {
  return String(name || "pelatis").trim().replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, "-") || "pelatis";
}

async function exportCredits({ clientId, name, flash, onAuthFail }) {
  const { data, error } = await rpc("admin_credit_log", { p_client_id: clientId || null });
  if (error === "AUTH") { onAuthFail(); return; }
  if (error) { flash("Δεν έγινε η εξαγωγή"); return; }
  const rows = data || [];
  if (rows.length === 0) { flash("Δεν υπάρχουν κινήσεις για εξαγωγή"); return; }

  let pdfMake;
  try { pdfMake = await loadPdfMake(); }
  catch (e) { flash("Δεν φόρτωσε το PDF — δες τη σύνδεση"); return; }

  try {
    const filename = clientId
      ? `kratiseis-${fileSafe(name)}-${fileStamp()}.pdf`
      : `kratiseis-olon-${fileStamp()}.pdf`;
    pdfMake.createPdf(creditsDoc(rows, clientId)).download(filename);
    flash("Το PDF κατέβηκε");
  } catch (e) {
    flash("Δεν φτιάχτηκε το PDF: " + (e.message || e));
  }
}

/* Πίτα: μαύρο οι διαθέσιμες, γκρι οι χρησιμοποιημένες. Τα χρώματα
   περνάνε από text-* ώστε να τα γυρίζει και το σκούρο θέμα. */
function CreditsPie({ total, used, size = 180 }) {
  const safeTotal = Math.max(0, Number(total) || 0);
  const safeUsed = Math.min(safeTotal, Math.max(0, Number(used) || 0));
  const left = safeTotal - safeUsed;
  const pct = safeTotal ? (left / safeTotal) * 100 : 0;
  const r = 15.9155;
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      <svg viewBox="0 0 42 42" width={size} height={size} aria-hidden="true">
        <circle cx="21" cy="21" r={r} fill="none" stroke="currentColor" strokeWidth="6" className="text-neutral-300" />
        {pct > 0 && (
          <circle cx="21" cy="21" r={r} fill="none" stroke="currentColor" strokeWidth="6"
            className="text-black"
            strokeDasharray={`${pct} ${100 - pct}`} strokeDashoffset="25" />
        )}
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <div className="f-mono text-[38px] leading-none tracking-tight">{left}</div>
        <div className="f-text mt-1 text-[11px] uppercase tracking-wide text-neutral-500">διαθέσιμες</div>
      </div>
    </div>
  );
}

function CreditsPanel({ client, flash, onAuthFail, onUpdated }) {
  const has = client.credits_total !== null && client.credits_total !== undefined;
  const total = has ? client.credits_total : 0;
  const used = has ? (client.credits_used || 0) : 0;
  const [mode, setMode] = useState(null); // null | "renew" | "adjust" | "clear"
  const [value, setValue] = useState("");
  const [busy, setBusy] = useState(false);
  const [exporting, setExporting] = useState(false);

  useEffect(() => { setMode(null); setValue(""); }, [client.id]);

  const open = (m) => {
    setMode(m);
    setValue(m === "adjust" ? String(total) : has ? String(total) : "");
  };

  const save = async () => {
    const n = parseInt(value, 10);
    if (mode !== "clear" && !(n >= 1 && n <= 999)) { flash("Βάλε αριθμό από 1 έως 999"); return; }
    setBusy(true);
    const { data, error } = await rpc("admin_set_credits", {
      p_client_id: client.id,
      p_total: mode === "clear" ? null : n,
      p_mode: mode,
    });
    setBusy(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data?.ok) { flash(data?.error || "Δεν αποθηκεύτηκε"); return; }
    onUpdated({
      credits_total: data.credits_total,
      credits_used: data.credits_used,
      credits_since: data.credits_since,
    });
    flash(mode === "renew" ? (has ? "Το πακέτο ανανεώθηκε" : "Το πακέτο ορίστηκε")
      : mode === "adjust" ? "Το σύνολο άλλαξε" : "Ο πελάτης δεν έχει πια όριο");
    setMode(null); setValue("");
  };

  const doExport = async () => {
    setExporting(true);
    await exportCredits({ clientId: client.id, name: client.name, flash, onAuthFail });
    setExporting(false);
  };

  const since = client.credits_since ? athensParts(client.credits_since) : null;

  return (
    <div className="mt-10 border-t-2 border-black pt-6">
      <h3 className="f-display text-[13px] font-bold uppercase tracking-wide text-neutral-500">
        Πακέτο κρατήσεων
      </h3>

      {!has ? (
        <p className="f-text mt-2 max-w-[56ch] text-[13px] leading-relaxed text-neutral-500">
          Χωρίς όριο — ο πελάτης κλείνει όσες κρατήσεις θέλει. Όρισε πακέτο για να μετράει
          η εφαρμογή: με την τελευταία κράτηση κλειδώνει και του ζητάει ανανέωση.
        </p>
      ) : (
        <div className="mt-4 flex flex-col items-center gap-6 sm:flex-row sm:items-center">
          <CreditsPie total={total} used={used} />
          <div className="w-full space-y-3">
            <div className="flex items-center justify-between gap-3 border-b border-neutral-200 pb-2">
              <span className="flex items-center gap-2 f-text text-[14px]">
                <span className="inline-block h-3.5 w-3.5 bg-black" />Διαθέσιμες
              </span>
              <span className="f-mono text-[18px]">{Math.max(0, total - used)}</span>
            </div>
            <div className="flex items-center justify-between gap-3 border-b border-neutral-200 pb-2">
              <span className="flex items-center gap-2 f-text text-[14px]">
                <span className="inline-block h-3.5 w-3.5 text-neutral-300" style={{ background: "currentColor" }} />
                Χρησιμοποιημένες
              </span>
              <span className="f-mono text-[18px]">{used}</span>
            </div>
            <div className="flex items-center justify-between gap-3">
              <span className="f-text text-[14px] text-neutral-500">Σύνολο πακέτου</span>
              <span className="f-mono text-[18px]">{total}</span>
            </div>
            {since && (
              <div className="f-mono text-[12px] text-neutral-400">Από {since.date} · {since.time}</div>
            )}
            {total - used <= 0 && (
              <div className="f-text border-2 border-red-600 bg-red-50 px-3 py-2 text-[13px] text-red-800">
                Τέλειωσαν — η εφαρμογή του πελάτη είναι κλειδωμένη μέχρι την ανανέωση.
              </div>
            )}
          </div>
        </div>
      )}

      {mode === null ? (
        <div className="mt-5 flex flex-wrap gap-2">
          <Button onClick={() => open("renew")}>{has ? "🔄 Ανανέωση" : "➕ Ορισμός πακέτου"}</Button>
          {has && <Button variant="outline" onClick={() => open("adjust")}>Διόρθωση συνόλου</Button>}
          {has && (
            <Button variant="outline" disabled={exporting} onClick={doExport}>
              <IconDownload size={14} /><span className="ml-2">{exporting ? "Εξαγωγή…" : "Εξαγωγή PDF"}</span>
            </Button>
          )}
          {has && <Button variant="ghost" onClick={() => open("clear")}>Κατάργηση ορίου</Button>}
        </div>
      ) : mode === "clear" ? (
        <div className="mt-5 border-2 border-black p-4">
          <p className="f-text max-w-[56ch] text-[14px] leading-relaxed">
            Ο/Η <strong>{client.name}</strong> θα κλείνει χωρίς όριο. Η πίτα και το ιστορικό του
            πακέτου σβήνονται — αν τα θέλεις, κάνε πρώτα εξαγωγή.
          </p>
          <div className="mt-4 flex flex-wrap gap-2">
            <Button disabled={busy} onClick={save}>{busy ? "…" : "Ναι, χωρίς όριο"}</Button>
            <Button variant="ghost" onClick={() => setMode(null)}>Άκυρο</Button>
          </div>
        </div>
      ) : (
        <div className="mt-5 border-2 border-black p-4">
          <h4 className="f-display text-[13px] font-bold uppercase tracking-wide text-neutral-500">
            {mode === "adjust" ? "Διόρθωση συνόλου" : has ? "Ανανέωση πακέτου" : "Νέο πακέτο"}
          </h4>
          <p className="f-text mt-2 max-w-[56ch] text-[13px] leading-relaxed text-neutral-500">
            {mode === "adjust"
              ? `Αλλάζει μόνο το σύνολο του τρέχοντος πακέτου. Οι ${used} που χρησιμοποίησε μένουν.`
              : has
                ? "Ξεκινάει καινούριο πακέτο από το μηδέν. Η τωρινή πίτα και το ιστορικό της σβήνονται οριστικά — αν τα θέλεις, κάνε πρώτα εξαγωγή."
                : "Πόσες κρατήσεις αγόρασε ο πελάτης;"}
          </p>
          {mode === "renew" && (
            <div className="mt-3 flex flex-wrap gap-2">
              {CREDIT_PRESETS.map((n) => (
                <button key={n} onClick={() => setValue(String(n))}
                  className={`f-mono h-10 min-w-[48px] border-2 px-3 text-[15px] ${
                    value === String(n) ? "border-black bg-black text-white" : "border-neutral-300 bg-white text-black hover:border-black"}`}>
                  {n}
                </button>
              ))}
            </div>
          )}
          <div className="mt-3 flex flex-wrap items-center gap-2">
            <input value={value}
              onChange={(e) => setValue(e.target.value.replace(/\D/g, "").slice(0, 3))}
              inputMode="numeric" placeholder="π.χ. 12"
              className="f-mono h-12 w-32 border-2 border-black px-4 text-[16px] outline-none" />
            <span className="f-text text-[14px] text-neutral-500">κρατήσεις</span>
          </div>
          <div className="mt-4 flex flex-wrap gap-2">
            <Button disabled={busy || !value} onClick={save}>
              {busy ? "Αποθήκευση…" : mode === "adjust" ? "Αποθήκευση" : has ? "Ανανέωση" : "Ορισμός"}
            </Button>
            <Button variant="ghost" onClick={() => setMode(null)}>Άκυρο</Button>
          </div>
        </div>
      )}
    </div>
  );
}

function People({ flash, onAuthFail }) {

  const [history, setHistory] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [pinOpen, setPinOpen] = useState(false);
  const [pinValue, setPinValue] = useState("");
  const [pinBusy, setPinBusy] = useState(false);
  const [newPin, setNewPin] = useState("");
  const [editOpen, setEditOpen] = useState(false);
  const [form, setForm] = useState({ first_name: "", last_name: "", phone: "", email: "" });
  const [saving, setSaving] = useState(false);
  const [exportingAll, setExportingAll] = useState(false);

  const exportAll = async () => {
    setExportingAll(true);
    await exportCredits({ clientId: null, flash, onAuthFail });
    setExportingAll(false);
  };

  const load = useCallback(async () => {
    setLoading(true);
    const { data, error } = await rpc("admin_clients", { p_search: q });
    setLoading(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { flash("Δεν φόρτωσαν οι πελάτες"); return; }
    setRows(data || []);
  }, [q, flash, onAuthFail]);

  useEffect(() => { const t = setTimeout(load, 250); return () => clearTimeout(t); }, [load]);

  const openClient = async (row) => {
    setSel(row); setHistory(null); setConfirmDelete(false);
    setPinOpen(false); setPinValue(""); setNewPin("");
    setEditOpen(false);
    const { data, error } = await rpc("admin_client_history", { p_client_id: row.id });
    if (error === "AUTH") { onAuthFail(); return; }
    setHistory(data || []);
  };

  // Παλιότερες εκδόσεις της admin_clients έδιναν μόνο ενωμένο όνομα — το κόβουμε στο πρώτο κενό.
  const startEdit = () => {
    const parts = String(sel.name || "").trim().split(/\s+/);
    setForm({
      first_name: sel.first_name || parts[0] || "",
      last_name: sel.last_name || parts.slice(1).join(" ") || "",
      phone: sel.phone || "",
      email: sel.email || "",
    });
    setEditOpen(true);
  };

  const saveClient = async () => {
    setSaving(true);
    const { data, error } = await rpc("admin_update_client", {
      p_client_id: sel.id,
      p_first_name: form.first_name,
      p_last_name: form.last_name,
      p_phone: form.phone,
      p_email: form.email,

    setSaving(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data?.ok) { flash(data?.error || "Δεν αποθηκεύτηκαν τα στοιχεία"); return; }
    setSel({
      ...sel,
      name: data.name,
      first_name: data.first_name,
      last_name: data.last_name,
      phone: data.phone,
      email: data.email,
    });
    setEditOpen(false);
    flash(data.marketing_dropped
      ? "Τα στοιχεία άλλαξαν — χωρίς email έκλεισαν οι ενημερώσεις"
      : "Τα στοιχεία του πελάτη άλλαξαν");
    load();
  };

  // Κενό p_pin σημαίνει «βγάλε τυχαίο» — το αποφασίζει η βάση.
  const resetPin = async (manual) => {
    if (manual && !/^\d{4}$/.test(pinValue)) { flash("Ο κωδικός θέλει 4 ψηφία"); return; }
    setPinBusy(true);
    const { data, error } = await rpc("admin_reset_pin", {
      p_client_id: sel.id,
      p_pin: manual ? pinValue : null,
    });
    setPinBusy(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data?.ok) { flash(data?.error || "Δεν άλλαξε ο κωδικός"); return; }
    setNewPin(data.pin);
    setPinValue("");
    flash("Ο κωδικός του πελάτη άλλαξε");

  const deleteClient = async () => {
    setDeleting(true);
    const { data, error } = await rpc("admin_delete_client", { p_client_id: sel.id });
    setDeleting(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data?.ok) { flash(data?.error || "Δεν διαγράφηκε"); return; }
    flash("Ο πελάτης διαγράφηκε");
    setSel(null); setConfirmDelete(false);
    load();
