/* ---------- QR (self-contained encoder) ---------- */
const EXP = new Array(512), LOG = new Array(256);
(() => { let x = 1; for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; } for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255]; })();
const gmul = (a, b) => (a === 0 || b === 0 ? 0 : EXP[LOG[a] + LOG[b]]);
function rsGen(n) { let g = [1]; for (let i = 0; i < n; i++) { const next = new Array(g.length + 1).fill(0); for (let j = 0; j < g.length; j++) { next[j] ^= g[j]; next[j + 1] ^= gmul(g[j], EXP[i]); } g = next; } return g; }
function rsEncode(data, ecLen) { const g = rsGen(ecLen); const res = new Array(ecLen).fill(0); for (const d of data) { const f = d ^ res[0]; res.shift(); res.push(0); for (let i = 0; i < ecLen; i++) res[i] ^= gmul(g[i + 1], f); } return res; }
const QR_CAP = { 1: [19, 7], 2: [34, 10], 3: [55, 15], 4: [80, 20], 5: [108, 26] };
const QR_MASKS = [(i,j)=>(i+j)%2===0,(i)=>i%2===0,(i,j)=>j%3===0,(i,j)=>(i+j)%3===0,(i,j)=>(Math.floor(i/2)+Math.floor(j/3))%2===0,(i,j)=>((i*j)%2)+((i*j)%3)===0,(i,j)=>(((i*j)%2)+((i*j)%3))%2===0,(i,j)=>(((i+j)%2)+((i*j)%3))%2===0];
function qrReserved(size, version) { const r = Array.from({ length: size }, () => new Array(size).fill(false)); const block = (row, col, h, w) => { for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) { const y = row + i, x = col + j; if (y >= 0 && y < size && x >= 0 && x < size) r[y][x] = true; } }; block(0,0,9,9); block(0,size-8,9,8); block(size-8,0,8,9); for (let i = 0; i < size; i++) { r[6][i] = true; r[i][6] = true; } if (version >= 2) block(size-9,size-9,5,5); return r; }
function qrBase(size, version) { const m = Array.from({ length: size }, () => new Array(size).fill(0)); const finder = (row, col) => { for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++) { const y = row+i, x = col+j; if (y<0||y>=size||x<0||x>=size) continue; const edge = (i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6)); const core = i>=2&&i<=4&&j>=2&&j<=4; m[y][x] = edge||core ? 1 : 0; } }; finder(0,0); finder(0,size-7); finder(size-7,0); for (let i = 8; i < size-8; i++) { const v = i%2===0?1:0; m[6][i]=v; m[i][6]=v; } if (version>=2) { const c=size-7; for (let i=-2;i<=2;i++) for (let j=-2;j<=2;j++) m[c+i][c+j]=Math.max(Math.abs(i),Math.abs(j))===1?0:1; } m[size-8][8]=1; return m; }
function qrDataPositions(size, res) { const pos=[]; let up=true; for (let right=size-1; right>=1; right-=2) { const col=right<=6?right-1:right; for (let n=0;n<size;n++) { const row=up?size-1-n:n; for (const c of [col,col-1]) if (!res[row][c]) pos.push([row,c]); } up=!up; } return pos; }
function qrFormat(m, size, mask) { const fmt=(0b01<<3)|mask; let rem=fmt<<10; for (let i=14;i>=10;i--) if ((rem>>i)&1) rem^=0x537<<(i-10); const bits=((fmt<<10)|(rem&0x3ff))^0x5412; const bit=(i)=>(bits>>(14-i))&1; for (let i=0;i<=5;i++) m[8][i]=bit(i); m[8][7]=bit(6); m[8][8]=bit(7); m[7][8]=bit(8); for (let i=9;i<=14;i++) m[14-i][8]=bit(i); for (let i=0;i<=6;i++) m[size-1-i][8]=bit(i); for (let i=7;i<=14;i++) m[8][size-15+i]=bit(i); m[size-8][8]=1; }
function qrPenalty(m, size) { let p=0; for (let dir=0;dir<2;dir++) for (let a=0;a<size;a++) { let run=1, prev=-1; for (let b=0;b<size;b++) { const v=dir===0?m[a][b]:m[b][a]; if (v===prev) run++; else { if (run>=5) p+=run-2; run=1; prev=v; } } if (run>=5) p+=run-2; } for (let i=0;i<size-1;i++) for (let j=0;j<size-1;j++) { const v=m[i][j]; if (v===m[i][j+1]&&v===m[i+1][j]&&v===m[i+1][j+1]) p+=3; } let dark=0; for (let i=0;i<size;i++) for (let j=0;j<size;j++) dark+=m[i][j]; p+=10*Math.floor(Math.abs((dark*100)/(size*size)-50)/5); return p; }
function qrEncode(text) {
  const bytes = Array.from(new TextEncoder().encode(text));
  let version = null;
  for (let v = 1; v <= 5; v++) if (bytes.length + 2 <= QR_CAP[v][0]) { version = v; break; }
  if (!version) return null;
  const size = 17 + 4 * version;
  const [dataLen, ecLen] = QR_CAP[version];
  const bitArr = [];
  const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bitArr.push((val >> i) & 1); };
  push(0b0100, 4); push(bytes.length, 8);
  for (const b of bytes) push(b, 8);
  for (let i = 0; i < 4 && bitArr.length < dataLen * 8; i++) bitArr.push(0);
  while (bitArr.length % 8 !== 0) bitArr.push(0);
  const data = [];
  for (let i = 0; i < bitArr.length; i += 8) { let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bitArr[i + j]; data.push(v); }
  const pads = [0xec, 0x11]; let k = 0;
  while (data.length < dataLen) data.push(pads[k++ % 2]);
  const cws = data.concat(rsEncode(data, ecLen));
  const res = qrReserved(size, version);
  const pos = qrDataPositions(size, res);
  const bits = [];
  for (const cw of cws) for (let i = 7; i >= 0; i--) bits.push((cw >> i) & 1);
  let best = null;
  for (let mask = 0; mask < 8; mask++) {
    const m = qrBase(size, version);
    pos.forEach(([r, c], idx) => { const b = idx < bits.length ? bits[idx] : 0; m[r][c] = QR_MASKS[mask](r, c) ? b ^ 1 : b; });
    qrFormat(m, size, mask);
    const score = qrPenalty(m, size);
    if (!best || score < best.score) best = { score, m };
  }
  return best.m;
}

function QRCode({ text, size = 190 }) {
  const modules = useMemo(() => qrEncode(text), [text]);
  if (!modules) return <div className="f-text text-sm text-neutral-500">Ο σύνδεσμος είναι πολύ μεγάλος για QR.</div>;
  const n = modules.length, q = 4, total = n + 2 * q;
  let d = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (modules[y][x]) d += `M${x + q} ${y + q}h1v1h-1z`;
  return (
    <svg viewBox={`0 0 ${total} ${total}`} width={size} height={size} shapeRendering="crispEdges" className="block">
      <rect width={total} height={total} fill="#FFFFFF" />
      <path d={d} fill="#000000" />
    </svg>
  );
}

/* Η διεύθυνση της εφαρμογής πελατών είναι αυτή εδώ η σελίδα, με
   index.html στη θέση του admin.html. Τη γεμίζουμε μόνοι μας αντί να
   περιμένουμε να τη γράψει κάποιος — έμενε κενή και τα QR έβγαιναν
   με άδειο σύνδεσμο. */
/* Το ίδιο QR ως αρχείο SVG, στα 100 mm. Καθαρές γραμμές, ώστε να
   μπει σε CAD και να τυπωθεί σε 3D. */
function qrSvgText(text) {
  const modules = qrEncode(text);
  if (!modules) return "";
  const n = modules.length, q = 4, total = n + 2 * q;
  let d = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (modules[y][x]) d += `M${x + q} ${y + q}h1v1h-1z`;
  return `<?xml version="1.0" encoding="UTF-8"?>\n` +
    `<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="100mm" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges">` +
    `<rect width="${total}" height="${total}" fill="#FFFFFF"/><path d="${d}" fill="#000000"/></svg>`;
}

function downloadQrSvg(text, name) {
  const svg = qrSvgText(text);
  if (!svg) return;
  const blob = new Blob([svg], { type: "image/svg+xml" });
  const href = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = href; a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(href), 4000);
}

function guessAppUrl() {
  try {
    const u = new URL(window.location.href);
    u.hash = ""; u.search = "";
    u.pathname = u.pathname.replace(/[^/]*$/, "index.html");
    return u.href;
  } catch (e) { return ""; }
}

function Access({ flash, onAuthFail }) {
  const [url, setUrl] = useState("");
  const [loading, setLoading] = useState(true);
  const [guessed, setGuessed] = useState(false);

  useEffect(() => {
    (async () => {
      const { data, error } = await rpc("admin_get_settings", {});
      setLoading(false);
      if (error === "AUTH") { onAuthFail(); return; }
      if (error || !data) return;
      const saved = (data.site_url || "").trim();
      if (saved) { setUrl(saved); return; }
      setUrl(guessAppUrl());
      setGuessed(true);
    })();
  }, [onAuthFail]);

  const save = async () => {
    const clean = url.trim();
    if (!clean) { flash("Γράψε πρώτα τη διεύθυνση"); return; }
    const { data, error } = await rpc("admin_update_settings", { p_patch: { site_url: clean } });
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data?.ok) { flash("Δεν αποθηκεύτηκε"); return; }
    setUrl(clean);
    setGuessed(false);
    flash("Αποθηκεύτηκε");
  };

  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); flash("Αντιγράφηκε"); }
    catch (e) { flash("Η αντιγραφή δεν είναι διαθέσιμη"); }
  };

  /* Γράφει τον σύνδεσμο check-in κατευθείαν στο tag, με Web NFC. */
  const [writing, setWriting] = useState(false);
  const writeTag = async (text) => {
    if (!text || !NFC_OK) return;
    setWriting(true);
    try {
      const w = new NDEFReader();
      await w.write({ records: [{ recordType: "url", data: text }] });
      flash("Το tag γράφτηκε");
    } catch (e) {
      flash("Δεν γράφτηκε: " + (e.message || e));
    }
    setWriting(false);
  };

  if (loading) return <div className="f-text px-5 py-10 text-[14px] text-neutral-400 sm:px-6">Φόρτωση…</div>;
  const checkinUrl = url ? url + (url.includes("?") ? "&" : "?") + "checkin=1" : "";

  return (
    <div className="px-5 sm:px-6">
      <h2 className="f-display border-t-2 border-black pt-6 text-[24px] font-extrabold uppercase tracking-tight">QR & NFC στην είσοδο</h2>

      <div className="mt-6 max-w-xl">
        <label className="f-text text-[13px] text-neutral-500">Διεύθυνση εφαρμογής πελατών</label>
        <div className="mt-2 flex gap-2">
          <input value={url} onChange={(e) => { setUrl(e.target.value); setGuessed(false); }}
            placeholder="https://…/index.html"
            className="f-mono h-12 flex-1 border-2 border-black px-4 text-[14px] outline-none" />
          <Button onClick={save}>Αποθήκευση</Button>
        </div>
        {guessed && (
          <p className="f-text mt-2 text-[12px] leading-relaxed text-neutral-500">
            Συμπληρώθηκε από τη διεύθυνση αυτής της σελίδας. Δες αν είναι σωστή
            και πάτα Αποθήκευση.
          </p>
        )}
      </div>

      {url ? (
        <div className="mt-8 grid max-w-3xl gap-6 sm:grid-cols-2">
          <div className="border-2 border-black p-5">
            <div className="f-display text-[14px] font-bold uppercase tracking-wide">Άνοιγμα εφαρμογής</div>
            <div className="f-mono mt-1 break-all text-[12px] text-neutral-500">{url}</div>
            <div className="mt-4 flex justify-center border-2 border-black p-3"><QRCode text={url} size={170} /></div>
            <div className="mt-4 flex gap-2">
              <Button variant="outline" size="sm" className="flex-1" onClick={() => copy(url)}>Αντιγραφή</Button>
              <Button variant="outline" size="sm" className="flex-1" onClick={() => downloadQrSvg(url, "qr-efarmogi.svg")}>SVG</Button>
            </div>
          </div>
          <div className="border-2 border-black p-5">
            <div className="f-display text-[14px] font-bold uppercase tracking-wide">Check-in στην είσοδο</div>
            <div className="f-mono mt-1 break-all text-[12px] text-neutral-500">{checkinUrl}</div>
            <div className="mt-4 flex justify-center border-2 border-black p-3"><QRCode text={checkinUrl} size={170} /></div>
            <div className="mt-4 flex gap-2">
              <Button variant="outline" size="sm" className="flex-1" onClick={() => copy(checkinUrl)}>Αντιγραφή</Button>
              <Button variant="outline" size="sm" className="flex-1" onClick={() => downloadQrSvg(checkinUrl, "qr-checkin.svg")}>SVG</Button>
            </div>
          </div>
        </div>
      ) : (
        <p className="f-text mt-8 text-[14px] text-neutral-500">
          Συμπλήρωσε τη διεύθυνση πιο πάνω και πάτα Αποθήκευση για να δημιουργηθούν τα QR.
        </p>
      )}

      <div className="mt-9 max-w-xl border-t-2 border-black pt-6">
        <h3 className="f-display text-[14px] font-bold uppercase tracking-wide">NFC tag για check-in</h3>

        {checkinUrl ? (
          <div className="mt-3 border-2 border-black p-4">
            <div className="f-display text-[11px] font-bold uppercase tracking-wide text-neutral-500">Σύνδεσμος check-in</div>
            <div className="f-mono mt-1 select-all break-all text-[14px]">{checkinUrl}</div>
            <div className="mt-4 flex flex-wrap gap-2">
              <Button size="sm" onClick={() => copy(checkinUrl)}>Αντιγραφή συνδέσμου</Button>
              {NFC_OK && (
                <Button variant="outline" size="sm" disabled={writing} onClick={() => writeTag(checkinUrl)}>
                  {writing ? "Ακούμπησε το tag…" : "Γράψιμο στο tag"}
                </Button>
              )}
            </div>
          </div>
        ) : (
          <p className="f-text mt-3 text-[13px] text-neutral-500">
            Συμπλήρωσε πρώτα τη διεύθυνση της εφαρμογής πιο πάνω και πάτα Αποθήκευση.
          </p>
        )}
      </div>
      <div className="h-10" />
    </div>
  );
}

/* ---------- Settings ---------- */

/* Άδεια ειδοποιήσεων για αυτή τη συσκευή. Οι ειδοποιήσεις έρχονται
   όσο η σελίδα διαχείρισης είναι ανοιχτή. */
/* ---------- Καθάρισμα ιστορικού ----------
   Οι περασμένες κρατήσεις και οι ακυρώσεις μένουν στη βάση για πάντα.
   Δεν είναι βάρος στα πρώτα χρόνια — μερικές δεκάδες kB — αλλά κάποια
   στιγμή θέλει σκούπα. Εδώ φαίνεται πόσο πιάνουν και σβήνονται όσα
   είναι παλιότερα από το διάστημα που θα διαλέξεις. */
function CleanupPanel({ flash, onAuthFail }) {
  const [info, setInfo] = useState(null);
  const [months, setMonths] = useState(12);
  const [confirm, setConfirm] = useState(false);
  const [busy, setBusy] = useState(false);
  const [open, setOpen] = useState(false);

  const load = useCallback(async () => {
    const { data, error } = await rpc("admin_storage", {});
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { setInfo(false); return; }
    setInfo(data);
  }, [onAuthFail]);

  /* Τα στοιχεία τα ζητάμε μόνο όταν ανοίξει το πάνελ. */
  useEffect(() => { if (open && info === null) load(); }, [open, info, load]);

  const purge = async () => {
    setBusy(true);
    const { data, error } = await rpc("admin_purge_history", { p_months: months });
    setBusy(false);
    setConfirm(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data?.ok) { flash(data?.error || "Δεν έγινε το καθάρισμα"); return; }
    const n = (data.bookings || 0) + (data.cancel_log || 0) + (data.notifications || 0) + (data.waitlist || 0);
    flash(n === 0 ? "Δεν υπήρχε τίποτα παλιό να σβηστεί" : "Σβήστηκαν " + n + " εγγραφές");
    load();
  };

  const mb = (b) => (!b ? "0" : (b / 1048576).toFixed(1));
  const fmtDate = (s) => {
    if (!s) return "—";
    const d = parseISO(String(s).slice(0, 10));
    return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  };

  const CHOICES = [
    [12, "Κράτα τον τελευταίο χρόνο"],
    [6, "Κράτα τους τελευταίους 6 μήνες"],
    [3, "Κράτα τους τελευταίους 3 μήνες"],
    [0, "Σβήσε όλα όσα έχουν περάσει"],
  ];
  const chosen = (CHOICES.find((c) => c[0] === months) || CHOICES[0])[1];

  return (
    <div className="mt-7 border-2 border-black p-4">
      <button onClick={() => { setOpen(!open); setConfirm(false); }}
        className="flex w-full items-center justify-between gap-3 text-left">
        <span className="f-display text-[14px] font-bold uppercase tracking-wide">Ιστορικό και χώρος</span>
        <span className={`f-display shrink-0 text-[13px] leading-none transition-transform ${open ? "rotate-180" : ""}`}>▾</span>
      </button>

      {!open ? null : info === null ? (
        <p className="f-text mt-2 text-[13px] text-neutral-400">Φόρτωση…</p>
      ) : info === false ? (
        <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
          Δεν φόρτωσαν τα στοιχεία του ιστορικού.
        </p>
      ) : (
        <>
          <p className="f-text mt-2 max-w-[56ch] text-[13px] leading-relaxed text-neutral-600">
            Κάθε κράτηση και κάθε ακύρωση μένει στη βάση. Χρειάζονται για τα στατιστικά και για
            το ιστορικό του κάθε πελάτη, γι' αυτό δεν σβήνονται μόνες τους.
          </p>

          <div className="mt-4 divide-y divide-neutral-200 border-y-2 border-black">
            <div className="flex items-center justify-between gap-3 py-2.5">
              <span className="f-text text-[14px]">Κρατήσεις</span>
              <span className="f-mono text-[14px]">
                {info.bookings_total} <span className="text-neutral-400">· {info.bookings_past} περασμένες</span>
              </span>
            </div>
            <div className="flex items-center justify-between gap-3 py-2.5">
              <span className="f-text text-[14px]">Ακυρώσεις</span>
              <span className="f-mono text-[14px]">{info.cancel_log}</span>
            </div>
            <div className="flex items-center justify-between gap-3 py-2.5">
              <span className="f-text text-[14px]">Ειδοποιήσεις</span>
              <span className="f-mono text-[14px]">{info.notifications}</span>
            </div>
            <div className="flex items-center justify-between gap-3 py-2.5">
              <span className="f-text text-[14px]">Παλιότερη εγγραφή</span>
              <span className="f-mono text-[14px]">{fmtDate(info.bookings_oldest)}</span>
            </div>
            <div className="flex items-center justify-between gap-3 py-2.5">
              <span className="f-text text-[14px]">Χώρος στη βάση</span>
              <span className="f-mono text-[14px]">{mb(info.db_bytes)} MB</span>
            </div>
          </div>

          <div className="f-display mt-5 text-[12px] font-bold uppercase tracking-wide text-neutral-500">
            Καθάρισμα
          </div>
          <div className="mt-2 space-y-1.5">
            {CHOICES.map(([m, label]) => (
              <button key={m} onClick={() => { setMonths(m); setConfirm(false); }}
                className={`f-text flex w-full items-center gap-3 border-2 px-3 py-2.5 text-left text-[14px] ${
                  months === m ? "border-black bg-black text-white" : "border-neutral-300 hover:border-black"}`}>
                <span className={`h-3 w-3 shrink-0 rounded-full border-2 ${
                  months === m ? "border-white bg-white" : "border-neutral-400"}`} />
                {label}
              </button>
            ))}
          </div>

          {!confirm ? (
            <Button variant="outline" className="mt-4" onClick={() => setConfirm(true)}>
              Καθάρισμα ιστορικού
            </Button>
          ) : (
            <div className="mt-4 border-2 border-red-600 bg-red-50 p-3">
              <div className="f-display text-[12px] font-bold uppercase tracking-wide text-red-700">
                Σίγουρα;
              </div>
              <div className="f-text mt-1 max-w-[52ch] text-[13px] leading-relaxed text-red-800">
                {chosen}. Ό,τι είναι παλιότερο σβήνεται οριστικά — κρατήσεις, ακυρώσεις και
                ειδοποιήσεις. Τα στατιστικά και τα ιστορικά των πελατών θα δείχνουν λιγότερα.
                Οι σημερινές και οι μελλοντικές κρατήσεις δεν πειράζονται ποτέ.
              </div>
              <div className="mt-3 flex flex-wrap gap-2">
                <Button size="sm" disabled={busy} onClick={purge}>
                  {busy ? "…" : "Ναι, σβήσ' τα"}
                </Button>
                <Button variant="ghost" size="sm" disabled={busy} onClick={() => setConfirm(false)}>
                  Άκυρο
                </Button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function NotifyPanel({ flash, watchError }) {
  const supported = typeof Notification !== "undefined";
  const [perm, setPerm] = useState(supported ? Notification.permission : "unsupported");
  const [busy, setBusy] = useState(false);

  const ask = async () => {
    setBusy(true);
    try {
      const p = await Notification.requestPermission();
      setPerm(p);
      flash(p === "granted" ? "Οι ειδοποιήσεις ενεργοποιήθηκαν" : "Δεν δόθηκε άδεια");
    } catch (e) { flash("Κάτι πήγε στραβά"); }
    setBusy(false);
  };

  const test = () => {
    chime(true);
    notify("Νέα κράτηση", "Δοκιμαστική ειδοποίηση. Αν τη βλέπεις, όλα δουλεύουν.", "kinesis-admin-test");
  };

  return (
    <div className="mt-7 border-2 border-black p-4">
      <div className="f-display text-[14px] font-bold uppercase tracking-wide">Ειδοποίηση κρατήσεων &amp; ακυρώσεων</div>

      {perm === "unsupported" ? (
        <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
          Αυτός ο browser δεν υποστηρίζει ειδοποιήσεις.
        </p>
      ) : perm === "denied" ? (
        <p className="f-text mt-2 max-w-[56ch] text-[13px] leading-relaxed text-neutral-600">
          Οι ειδοποιήσεις είναι μπλοκαρισμένες. Άνοιξέ τες από τις ρυθμίσεις του browser για αυτή τη
          σελίδα και ξαναφόρτωσε.
        </p>
      ) : (
        <>
          <p className="f-text mt-2 max-w-[56ch] text-[13px] leading-relaxed text-neutral-600">
            Έρχονται όσο η σελίδα είναι ανοιχτή, ακόμα κι αν δουλεύεις σε άλλη καρτέλα.
          </p>
          <div className="mt-4 flex flex-wrap items-center gap-2">
            <Button variant="outline" size="sm" onClick={test}>Δοκιμαστική ειδοποίηση</Button>
            {perm !== "granted" && (
              <Button size="sm" disabled={busy} onClick={ask}>
                {busy ? "…" : "Ενεργοποίηση"}
              </Button>
            )}
          </div>
        </>
      )}

      {watchError && (
        <div className="mt-4 border-2 border-red-600 bg-red-50 p-3">
          <div className="f-display text-[12px] font-bold uppercase tracking-wide text-red-700">
            Ο έλεγχος νέων κρατήσεων απέτυχε
          </div>
          <div className="f-text mt-1 break-words text-[12px] leading-relaxed text-red-800">{watchError}</div>
          <div className="f-text mt-2 text-[12px] leading-relaxed text-neutral-600">
            Όσο βγάζει αυτό, καμία νέα κράτηση δεν φτάνει στην καμπάνα.
          </div>
        </div>
      )}

    </div>
  );
}

/* ---------- Λογότυπο: μικρότερο πριν φύγει ----------
   Ό,τι ανεβάσει ο διαχειριστής μπαίνει σε τετράγωνο καμβά και βγαίνει
   PNG με διαφάνεια. Χωρίς αυτό, μια φωτογραφία από κινητό θα ταξίδευε
   ολόκληρη σε κάθε άνοιγμα της εφαρμογής, από κάθε πελάτη. */
function fileToSquarePng(file, size) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Δεν διαβάστηκε το αρχείο"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Δεν είναι εικόνα"));
      img.onload = () => {
        try {
          const c = document.createElement("canvas");
          c.width = size; c.height = size;
          const ctx = c.getContext("2d");
          const r = Math.min(size / img.width, size / img.height);
          const w = Math.max(1, Math.round(img.width * r));
          const h = Math.max(1, Math.round(img.height * r));
          ctx.drawImage(img, Math.round((size - w) / 2), Math.round((size - h) / 2), w, h);
          resolve(c.toDataURL("image/png"));
        } catch (e) { reject(new Error("Δεν διαβάστηκε η εικόνα")); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* Δοκιμάζει από το μεγάλο προς το μικρό μέχρι να χωρέσει. */
async function shrinkLogo(file) {
  for (const size of [512, 384, 256, 192]) {
    const url = await fileToSquarePng(file, size);
    if (url.length <= 200000) return url;
  }
  throw new Error("Η εικόνα είναι πολύ βαριά");
}

/* Τα εικονίδια της αρχικής οθόνης είναι στατικά αρχεία στο repo και
   δεν αλλάζουν από τη βάση. Εδώ βγαίνουν έτοιμα, με τα ονόματα που
   ζητάει ο κώδικας, για να ανέβουν με το χέρι μία φορά. */
function logoToIcon(url, size, pad) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error("bad"));
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = size; c.height = size;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, size, size);
      const box = size * (1 - 2 * pad);
      const r = Math.min(box / img.width, box / img.height);
      const w = img.width * r, h = img.height * r;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("bad"))), "image/png");
    };
    img.src = url;
  });
}

async function downloadIcons(url) {
  const jobs = [
    ["icon-192.png", 192, 0.08],
    ["icon-512.png", 512, 0.08],
    ["icon-maskable-512.png", 512, 0.2],
  ];
  for (const [name, size, pad] of jobs) {
    const blob = await logoToIcon(url, size, pad);
    const href = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = href; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 4000);
    await new Promise((r) => setTimeout(r, 250));
  }
}

function Settings({ flash, onAuthFail, watchError, theme, setTheme, scale, setScale }) {
  const [s, setS] = useState(null);
  const [saving, setSaving] = useState(false);
  const [logoBusy, setLogoBusy] = useState("");
  const fileRef = useRef(null);

  useEffect(() => {
    (async () => {
      const { data, error } = await rpc("admin_get_settings", {});
      if (error === "AUTH") { onAuthFail(); return; }
      if (error) { flash("Δεν φόρτωσαν οι ρυθμίσεις"); return; }
      setS(data);
      setGymName(data?.gym_name);
      setMaxDaysAhead(data?.max_days_ahead);
      setLogoUrl(data?.logo_url || "");
    })();
  }, [flash, onAuthFail]);

  const set = (k, v) => setS((prev) => ({ ...prev, [k]: v }));

  /* Το λογότυπο αποθηκεύεται μόνο του, χωρίς το κουμπί πιο κάτω: η
     καρτέλα του browser αλλάζει την ίδια στιγμή και φαίνεται ότι
     έπιασε. Και δεν ταξιδεύει ξανά σε κάθε άλλη αποθήκευση. */
  const saveLogo = async (url) => {
    const { data, error } = await rpc("admin_update_settings", { p_patch: { logo_url: url } });
    if (error === "AUTH") { onAuthFail(); return false; }
    if (error || !data?.ok) { flash(data?.error || "Δεν αποθηκεύτηκε το λογότυπο"); return false; }
    set("logo_url", url);
    setLogoUrl(url);
    return true;
  };

  const pickLogo = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (e.target) e.target.value = "";
    if (!file) return;
    setLogoBusy("up");
    try {
      const url = await shrinkLogo(file);
      const ok = await saveLogo(url);
      if (ok) flash("Το λογότυπο μπήκε");
    } catch (err) {
      flash(err.message || "Δεν ανέβηκε η εικόνα");
    }
    setLogoBusy("");
  };

  const removeLogo = async () => {
    setLogoBusy("del");
    const ok = await saveLogo("");
    if (ok) flash("Το λογότυπο αφαιρέθηκε");
    setLogoBusy("");
  };

  const getIcons = async () => {
    if (!s.logo_url) return;
    setLogoBusy("icons");
    try { await downloadIcons(s.logo_url); }
    catch (err) { flash("Δεν φτιάχτηκαν τα εικονίδια"); }
    setLogoBusy("");
  };

  const save = async () => {
    setSaving(true);
    /* Το logo_url μένει έξω: είναι μεγάλο και έχει δικό του δρόμο. */
    const patch = Object.assign({}, s);
    delete patch.logo_url;
    /* Τα μηνύματα έχουν δικό τους διακόπτη στη σελίδα των μηνυμάτων.
       Δεν τα στέλνουμε από εδώ, για να μη γυρίσει πίσω μια παλιά τιμή. */
    delete patch.chat_enabled;
    const { data, error } = await rpc("admin_update_settings", { p_patch: patch });
    setSaving(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data?.ok) { flash("Δεν αποθηκεύτηκε"); return; }
    setGymName(s.gym_name);
    setMaxDaysAhead(s.max_days_ahead);
    flash("Αποθηκεύτηκε");
  };

  if (!s) return <div className="f-text px-5 py-10 text-[14px] text-neutral-400 sm:px-6">Φόρτωση…</div>;

  const Row = ({ label, hint, children }) => (
    <div className="flex flex-wrap items-center justify-between gap-3 py-4">
      <div>
        <div className="f-text text-[15px]">{label}</div>
        {hint && <div className="f-text mt-0.5 text-[12px] text-neutral-500">{hint}</div>}
      </div>
      <div className="shrink-0">{children}</div>
    </div>
  );

  return (
    <div className="max-w-2xl px-5 sm:px-6">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Ρυθμίσεις</h2>

      <NotifyPanel flash={flash} watchError={watchError} />

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Εμφάνιση</h3>
      <div className="border-y-2 border-black py-4">
        <div className="flex flex-wrap items-center gap-3">
          <div className="flex border-2 border-black">
            {[["light", "Φωτεινό"], ["dark", "Σκούρο"], ["auto", "Αυτόματο"]].map(([k, label], i) => (
              <button key={k} onClick={() => setTheme(k)}
                className={`f-display h-9 px-3 text-[11px] font-bold uppercase tracking-wide ${
                  i > 0 ? "border-l-2 border-black" : ""} ${
                  theme === k ? "bg-black text-white" : "bg-white text-neutral-500"}`}>
                {label}
              </button>
            ))}
          </div>

          <div className="flex border-2 border-black">
            {SCALES.map(([v, label], i) => (
              <button key={v} onClick={() => setScale(v)} title={label} aria-label={label}
                className={`inline-flex h-9 w-10 items-center justify-center ${
                  i > 0 ? "border-l-2 border-black" : ""} ${
                  scale === v ? "bg-black text-white" : "bg-white text-neutral-500"}`}>
                <IconTextSize scale={v} />
              </button>
            ))}
          </div>
        </div>
      </div>

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Κρατήσεις</h3>
      <div className="divide-y divide-neutral-200 border-y-2 border-black">
        <Row label="Ακύρωση έως" hint="πόσο πριν την κράτηση κλείνει η ακύρωση">
          <Stepper value={s.cancel_cutoff_min} min={0} max={2880} step={30}
            format={fmtMinutes} onChange={(v) => set("cancel_cutoff_min", v)} />
        </Row>
        <Row label="Κρατήσεις ανά ημέρα" hint="ανά πελάτη">
          <Stepper value={s.max_per_day} min={1} max={5} onChange={(v) => set("max_per_day", v)} />
        </Row>
        <Row label="Ενεργές κρατήσεις" hint="πόσες μπορεί να έχει ανοιχτές">
          <Stepper value={s.max_active} min={1} max={20} onChange={(v) => set("max_active", v)} />
        </Row>
        <Row label="Κρατήσεις μπροστά" hint="πόσες μέρες μπροστά ανοίγει το πρόγραμμα">
          <Stepper value={s.max_days_ahead} min={1} max={60} suffix="μ" onChange={(v) => set("max_days_ahead", v)} />
        </Row>
      </div>

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Ωράριο και θέσεις</h3>
      <div className="divide-y divide-neutral-200 border-y-2 border-black">
        <Row label="Άνοιγμα">
          <Stepper value={s.open_hour} min={0} max={s.close_hour - 1} suffix=":00" onChange={(v) => set("open_hour", v)} />
        </Row>
        <Row label="Κλείσιμο">
          <Stepper value={s.close_hour} min={s.open_hour + 1} max={24} suffix=":00" onChange={(v) => set("close_hour", v)} />
        </Row>
        <Row label="Προεπιλεγμένες θέσεις" hint="0 = κλειστό, εκτός αν το ορίσεις αλλιώς ανά ώρα">
          <Stepper value={s.default_capacity} min={0} max={80} onChange={(v) => set("default_capacity", v)} />
        </Row>
      </div>

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Check-in και υπενθυμίσεις</h3>
      <div className="divide-y divide-neutral-200 border-y-2 border-black">
        <Row label="Check-in ανοίγει" hint="λεπτά πριν την ώρα">
          <Stepper value={s.checkin_before_min} min={5} max={120} suffix="'" onChange={(v) => set("checkin_before_min", v)} />
        </Row>
        <Row label="Check-in κλείνει" hint="λεπτά μετά την ώρα">
          <Stepper value={s.checkin_after_min} min={5} max={120} suffix="'" onChange={(v) => set("checkin_after_min", v)} />
        </Row>
        <Row label="Υπενθύμιση" hint="λεπτά πριν την κράτηση">
          <Stepper value={s.reminder_min} min={10} max={240} suffix="'" onChange={(v) => set("reminder_min", v)} />
        </Row>
      </div>

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Όνομα γυμναστηρίου</h3>
      <div className="border-y-2 border-black py-4">
        <input value={s.gym_name} onChange={(e) => set("gym_name", e.target.value)}
          className="f-text h-12 w-full border-2 border-black px-4 text-[15px] outline-none" />
      </div>

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Λογότυπο</h3>
      <div className="border-y-2 border-black py-4">
        <div className="flex flex-wrap items-start gap-4">
          <div className="flex h-24 w-24 shrink-0 items-center justify-center border-2 border-dashed border-neutral-300">
            {s.logo_url
              ? <img src={s.logo_url} alt="" className="h-20 w-20 object-contain" />
              : <span className="f-text text-[11px] text-neutral-400">κενό</span>}
          </div>
          <div className="min-w-0 flex-1">
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={pickLogo} />
            <div className="flex flex-wrap items-center gap-2">
              <Button variant="outline" size="sm" disabled={!!logoBusy}
                onClick={() => fileRef.current && fileRef.current.click()}>
                {logoBusy === "up" ? "Ανέβασμα…" : s.logo_url ? "Αλλαγή" : "Ανέβασμα λογότυπου"}
              </Button>
              {s.logo_url && (
                <button type="button" onClick={getIcons} disabled={!!logoBusy} title="Κατέβασμα εικονιδίων"
                  aria-label="Κατέβασμα εικονιδίων"
                  className="inline-flex h-9 w-9 items-center justify-center border-2 border-black bg-white text-black transition-colors hover:bg-black hover:text-white disabled:border-neutral-200 disabled:text-neutral-300">
                  {logoBusy === "icons" ? <span className="f-display text-[13px]">…</span> : <IconDownload />}
                </button>
              )}
              {s.logo_url && (
                <Button variant="ghost" size="sm" disabled={!!logoBusy} onClick={removeLogo}>
                  {logoBusy === "del" ? "…" : "Αφαίρεση"}
                </Button>
              )}
            </div>
            <p className="f-text mt-3 max-w-[56ch] text-[12px] leading-relaxed text-neutral-500">
              Τετράγωνη εικόνα, με διάφανο ή λευκό φόντο. Φαίνεται στην καρτέλα του browser,
              εδώ, και στην εφαρμογή των πελατών αριστερά από το όνομά τους. Αποθηκεύεται
              αμέσως, χωρίς το κουμπί πιο κάτω.
            </p>
          </div>
        </div>
      </div>

      <div className="mt-8">
        <Button disabled={saving} onClick={save}>{saving ? "Αποθήκευση…" : "Αποθήκευση ρυθμίσεων"}</Button>
      </div>

      <CleanupPanel flash={flash} onAuthFail={onAuthFail} />
      <div className="h-10" />
    </div>
  );
}

/* ---------- Στόχοι πελατών ----------
   Τι δήλωσε ο καθένας στις ρυθμίσεις της εφαρμογής του. Πάνω η
   σύνοψη ανά στόχο — πατάς έναν και μένουν μόνο όσοι τον έχουν. */
function Goals({ flash, onAuthFail }) {
  const [data, setData] = useState(null);
  const [filter, setFilter] = useState(null);

  const load = useCallback(async () => {
    const { data: d, error } = await rpc("admin_goals", {});
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { flash("Δεν φόρτωσαν οι στόχοι"); return; }
    setData(d || { counts: [], clients: [], with_goals: 0, total_clients: 0 });
  }, [flash, onAuthFail]);

  useEffect(() => { load(); }, [load]);

  const counts = (data && data.counts) || [];
  const all = (data && data.clients) || [];
  const rows = filter ? all.filter((c) => (c.goals || []).includes(filter)) : all;
  const max = counts.reduce((m, c) => Math.max(m, c.count), 0) || 1;
  const withOther = all.filter((c) => c.other).length;

  const fmtWhen = (s) => {
    if (!s) return "";
    const d = new Date(s);
    return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  };

  return (
    <div className="px-5 sm:px-6">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Στόχοι πελατών</h2>
      <p className="f-text mt-1 max-w-[56ch] text-[13px] leading-relaxed text-neutral-500">
        Ό,τι δήλωσε ο κάθε πελάτης στις ρυθμίσεις της εφαρμογής του. Μπορεί να
        διαλέξει όσους στόχους θέλει, ή να γράψει δικό του.
      </p>

      {data === null ? (
        <div className="f-text py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : all.length === 0 ? (
        <div className="f-text mt-6 border-2 border-dashed border-neutral-300 py-14 text-center text-[15px] text-neutral-500">
          Κανείς δεν έχει δηλώσει στόχους ακόμα.
        </div>
      ) : (
        <>
          <div className="mt-7 grid grid-cols-2 gap-3 sm:max-w-md sm:gap-4">
            <Kpi label="Δήλωσαν στόχους" value={`${data.with_goals} / ${data.total_clients}`} />
            <Kpi label="Έγραψαν δικό τους" value={withOther} />
          </div>

          <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">
            Πόσοι διάλεξαν τι
          </h3>
          <div className="mt-3 divide-y divide-neutral-200 border-y-2 border-black">
            {counts.map((c) => (
              <button key={c.key} onClick={() => setFilter(filter === c.key ? null : c.key)}
                className={`flex w-full items-center gap-3 py-2.5 text-left ${
                  filter === c.key ? "bg-neutral-100" : ""}`}>
                <span className="f-text w-[40%] shrink-0 truncate text-[14px]">{goalLabel(c.key)}</span>
                <span className="block h-[12px] flex-1 border border-black">
                  <span className="block h-full bg-black" style={{ width: `${(c.count / max) * 100}%` }} />
                </span>
                <span className="f-mono w-8 shrink-0 text-right text-[13px]">{c.count}</span>
              </button>
            ))}
          </div>

          <div className="mt-9 flex items-baseline justify-between gap-3">
            <h3 className="f-display text-[13px] font-bold uppercase tracking-wide text-neutral-500">
              Ανά πελάτη {filter && `· ${goalLabel(filter)}`}
            </h3>
            {filter && (
              <Button variant="ghost" size="sm" onClick={() => setFilter(null)}>Καθαρισμός φίλτρου</Button>
            )}
          </div>

          <div className="mt-3 divide-y divide-neutral-200 border-y-2 border-black">
            {rows.map((c) => (
              <div key={c.id} className="py-3.5">
                <div className="flex flex-wrap items-baseline justify-between gap-2">
                  <div className="f-text text-[15px]">{c.name}</div>
                  <span className="f-mono shrink-0 text-[12px] text-neutral-400">
                    {c.phone}{c.updated_at ? ` · ${fmtWhen(c.updated_at)}` : ""}
                  </span>
                </div>
                <div className="mt-2 flex flex-wrap gap-1.5">
                  {(c.goals || []).map((g) => (
                    <span key={g} className="f-display border border-black px-2 py-1 text-[11px] font-bold uppercase tracking-wide">
                      {goalLabel(g)}
                    </span>
                  ))}
                  {c.other && (
                    <span className="f-display border border-black bg-black px-2 py-1 text-[11px] font-bold uppercase tracking-wide text-white">
                      {c.other}
                    </span>
                  )}
                </div>
              </div>
            ))}
          </div>
        </>
      )}
      <div className="h-10" />
    </div>
  );
}

/* ---------- Newsletter ----------
   Μόνο όσοι έδωσαν ρητά τη συγκατάθεσή τους. Το φιλτράρισμα γίνεται
   μέσα στη βάση — όποιος δεν την έδωσε δεν επιστρέφεται καθόλου. */
function Newsletter({ flash, onAuthFail }) {
  const [rows, setRows] = useState(null);

  const load = useCallback(async () => {
    const { data, error } = await rpc("admin_marketing_list", {});
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { flash("Δεν φόρτωσε η λίστα"); return; }
    setRows(data || []);
  }, [flash, onAuthFail]);

  useEffect(() => { load(); }, [load]);

  const copyAll = async () => {
    const all = (rows || []).map((r) => r.email).join(", ");
    try { await navigator.clipboard.writeText(all); flash("Αντιγράφηκαν"); }
    catch (e) { flash("Η αντιγραφή δεν είναι διαθέσιμη"); }
  };

  const fmtSince = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  };

  return (
    <div className="px-5 sm:px-6">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Λίστα ενημερώσεων</h2>
      <p className="f-text mt-1 max-w-[56ch] text-[13px] leading-relaxed text-neutral-500">
        Πελάτες που επέλεξαν να λαμβάνουν ενημερώσεις για ομαδικά προγράμματα και προσφορές.
        Όσοι δεν το επέλεξαν δεν εμφανίζονται εδώ.
      </p>

      {rows === null ? (
        <div className="f-text py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : rows.length === 0 ? (
        <div className="f-text mt-6 border-2 border-dashed border-neutral-300 py-14 text-center text-[15px] text-neutral-500">
          Κανείς δεν έχει δηλώσει συμμετοχή ακόμα.
        </div>
      ) : (
        <>
          <div className="mt-7 grid grid-cols-2 gap-3 sm:max-w-md sm:gap-4">
            <Kpi label="Εγγεγραμμένοι" value={rows.length} />
          </div>

          <div className="mt-7 flex items-center gap-3">
            <Button variant="outline" size="sm" onClick={copyAll}>Αντιγραφή όλων των email</Button>
          </div>

          <div className="mt-4 divide-y divide-neutral-200 border-y-2 border-black">
            {rows.map((r, i) => (
              <div key={i} className="flex flex-wrap items-center justify-between gap-2 py-3">
                <div className="min-w-0">
                  <div className="f-text text-[15px]">{r.name}</div>
                  <div className="f-mono text-[13px] text-neutral-600">{r.email}</div>
                </div>
                <span className="f-mono shrink-0 text-[12px] text-neutral-400">
                  από {fmtSince(r.since)}
                </span>
              </div>
            ))}
          </div>
        </>
      )}
      <div className="h-10" />
    </div>
  );
}

/* ---------- Δικές μου ειδοποιήσεις ----------
   Ο διαχειριστής γράφει το μήνυμα και λέει πότε φεύγει. Η ώρα
   αποστολής κρατιέται στη βάση· ένα cron κάθε λεπτό στέλνει όσες
   έφτασε η ώρα τους, γράφοντας μία γραμμή στον `notifications` για
   κάθε παραλήπτη — από εκεί και πέρα ακολουθούν τον ίδιο δρόμο με
   τις υπόλοιπες ειδοποιήσεις (trigger → edge function → push). */
const AUDIENCES = [
  ["all", "Όλοι οι πελάτες"],
  ["one", "Σε έναν πελάτη"],
];

/* Παλιές ειδοποιήσεις μπορεί να έχουν παραλήπτες που δεν προσφέρονται
   πια σαν επιλογή. Τα κρατάμε μόνο για να διαβάζεται το ιστορικό. */
const OLD_AUDIENCES = {
  marketing: "Μόνο όσοι δέχονται ενημερώσεις",
  active: "Όσοι έχουν κράτηση μπροστά",
};

const EMPTY_ANN = {
  id: null, title: "", body: "", audience: "all", send_at: "",
  client_id: null, client_name: "",
};

/* Η βάση δίνει UTC, το input θέλει τοπική ώρα χωρίς ζώνη. */
function isoToLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtWhen(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* Διαλέγει έναν και μόνο παραλήπτη. Ντροπ-ντάουν με όλους τους
   πελάτες — στο κινητό ανοίγει ως ρόδα επιλογής. Το κουτί αναζήτησης
   από πάνω απλώς στενεύει τη λίστα όταν οι πελάτες είναι πολλοί. */
function OneClientPicker({ clientId, clientName, onPick, onClear, onAuthFail }) {
  const [all, setAll] = useState(null);
  const [q, setQ] = useState("");

  useEffect(() => {
    let alive = true;
    (async () => {
      const { data, error } = await rpc("admin_clients", { p_search: "" });
      if (!alive) return;
      if (error === "AUTH") { onAuthFail(); return; }
      setAll(data || []);
    })();
    return () => { alive = false; };
  }, [onAuthFail]);

  const list = useMemo(() => {
    const rows = all || [];
    const term = q.trim().toLowerCase();
    const hit = term
      ? rows.filter((c) => String(c.name || "").toLowerCase().includes(term))
      : rows;
    /* Ο ήδη επιλεγμένος μένει πάντα μέσα, αλλιώς το select θα άδειαζε
       μόλις γραφτεί κάτι στην αναζήτηση. */
    if (clientId && !hit.some((c) => c.id === clientId)) {
      const sel = rows.find((c) => c.id === clientId);
      if (sel) return [sel].concat(hit);
    }
    return hit;
  }, [all, q, clientId]);

  if (all === null) {
    return <div className="f-text mt-2 text-[14px] text-neutral-400">Φόρτωση πελατών…</div>;
  }

  if (all.length === 0) {
    return <div className="f-text mt-2 text-[14px] text-neutral-500">Δεν υπάρχουν πελάτες ακόμα.</div>;
  }

  return (
    <div className="mt-2">
      <input value={q} onChange={(e) => setQ(e.target.value)}
        placeholder="Αναζήτηση με το όνομα"
        className="f-text mb-2 h-12 w-full border-2 border-black px-4 text-[15px] outline-none" />

      <select
        value={clientId || ""}
        onChange={(e) => {
          const id = e.target.value;
          if (!id) { onClear(); return; }
          const c = (all || []).find((x) => x.id === id);
          if (c) onPick(c);
        }}
        className="f-text h-12 w-full border-2 border-black bg-white px-3 text-[15px] outline-none">
        <option value="">— Διάλεξε πελάτη —</option>
        {list.map((c) => (
          <option key={c.id} value={c.id}>{c.name}</option>
        ))}
      </select>

      {q.trim() && list.length === 0 && (
        <div className="f-text mt-2 text-[13px] text-neutral-500">Κανένας πελάτης μ' αυτό το όνομα.</div>
      )}

      {clientId && (
        <div className="f-text mt-2 text-[13px] text-neutral-500">
          Παραλήπτης: <strong className="text-black">{clientName || "—"}</strong>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Μηνύματα με τους πελάτες
   Αριστερά (ή πάνω, στο κινητό) οι συζητήσεις των τελευταίων 48 ωρών,
   δεξιά η ανοιχτή. Τα μηνύματα τα σβήνει μόνη της η βάση 48 ώρες
   μετά. Ο πελάτης βλέπει ως αποστολέα το όνομα του γυμναστηρίου, όχι
   ποιος διαχειριστής έγραψε.
   ============================================================ */
const THREAD_POLL_MS = 5000;
const CHATS_POLL_MS = 10000;

function fmtChatTime(at) {
  const d = new Date(at);
  if (isNaN(d.getTime())) return "";
  const now = new Date();
  const hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  if (iso(d) === iso(now)) return hm;
  if (iso(d) === iso(addDays(now, -1))) return "Χθες " + hm;
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}, ${hm}`;
}

function ChatThread({ client, flash, onAuthFail, onBack, onChanged, onDeleted, isDesktop, chatOn }) {
  const [msgs, setMsgs] = useState(null);
  const [info, setInfo] = useState(client);
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const listRef = useRef(null);
  const stickRef = useRef(true);
  const lastIdRef = useRef(null);
  const inputRef = useRef(null);

  const load = useCallback(async () => {
    if (document.visibilityState !== "visible") return;
    const { data, error } = await rpc("admin_chat", { p_client_id: client.client_id });
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data || !data.ok) {
      setMsgs((prev) => (prev === null ? [] : prev));
      return;
    }
    const list = data.messages || [];
    setMsgs(list);
    setInfo({ client_id: data.client_id, name: data.name, phone: data.phone });
    /* Η λίστα αριστερά και ο μετρητής ανανεώνονται μόνο όταν όντως
       ήρθε κάτι — όχι σε κάθε ματιά. */
    const lastId = list.length ? list[list.length - 1].id : "";
    if (lastIdRef.current !== lastId) {
      lastIdRef.current = lastId;
      onChanged();
    }
  }, [client.client_id, onAuthFail, onChanged]);

  useEffect(() => {
    setMsgs(null);
    setText("");
    setConfirmDel(false);
    stickRef.current = true;
    lastIdRef.current = null;
    load();
    const id = setInterval(load, THREAD_POLL_MS);
    const onVisible = () => { if (document.visibilityState === "visible") load(); };
    document.addEventListener("visibilitychange", onVisible);
    if (isDesktop && chatOn !== false && inputRef.current) inputRef.current.focus();
    return () => {
      clearInterval(id);
      document.removeEventListener("visibilitychange", onVisible);
    };
  }, [load, isDesktop]); // eslint-disable-line react-hooks/exhaustive-deps

  useEffect(() => {
    const el = listRef.current;
    if (el && msgs && stickRef.current) el.scrollTop = el.scrollHeight;
  }, [msgs]);

  const onScroll = () => {
    const el = listRef.current;
    if (!el) return;
    stickRef.current = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  };

  const send = async () => {
    const body = text.trim();
    if (!body || sending || chatOn === false) return;
    setSending(true);
    const { data, error } = await rpc("admin_send_chat", { p_client_id: client.client_id, p_body: body });
    setSending(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data || !data.ok) { flash((data && data.error) || "Δεν στάλθηκε"); return; }
    setText("");
    stickRef.current = true;
    setMsgs((prev) => [...(prev || []), { id: data.id, mine: true, body: body, at: data.at, read: false }]);
    load();
  };

  const onKeyDown = (e) => {
    if (e.key !== "Enter" || e.shiftKey) return;
    let finePointer = false;
    try { finePointer = window.matchMedia("(pointer: fine)").matches; } catch (err) { /* αγνόησε */ }
    if (!finePointer) return;
    e.preventDefault();
    send();
  };

  const removeAll = async () => {
    const { data, error } = await rpc("admin_delete_chat", { p_client_id: client.client_id });
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data || !data.ok) { flash("Δεν σβήστηκε"); return; }
    setConfirmDel(false);
    flash("Η συζήτηση σβήστηκε");
    onDeleted();
  };

  const list = msgs || [];
  let lastMine = -1;
  list.forEach((m, i) => { if (m.mine) lastMine = i; });
  const rows = Math.min(5, Math.max(2, text.split("\n").length));

  return (
    <div className="flex flex-col border-2 border-black" style={{ height: "68vh", minHeight: 360 }}>
      <div className="flex shrink-0 flex-wrap items-center justify-between gap-2 border-b-2 border-black px-4 py-3">
        <div className="min-w-0">
          {!isDesktop && (
            <button onClick={onBack}
              className="f-text mb-1 block text-[13px] text-neutral-500 hover:text-black">
              Όλες οι συζητήσεις
            </button>
          )}
          <div className="f-display truncate text-[17px] font-bold uppercase tracking-wide">{info.name || "Πελάτης"}</div>
          {info.phone && (
            <a href={"tel:" + info.phone} className="f-mono text-[12px] text-neutral-500 hover:text-black">{info.phone}</a>
          )}
        </div>
        {list.length > 0 && (
          confirmDel ? (
            <div className="flex gap-2">
              <Button size="sm" onClick={removeAll}>Ναι, σβήσ' τη</Button>
              <Button variant="ghost" size="sm" onClick={() => setConfirmDel(false)}>Άκυρο</Button>
            </div>
          ) : (
            <Button variant="ghost" size="sm" onClick={() => setConfirmDel(true)}>Σβήσε τη συζήτηση</Button>
          )
        )}
      </div>

      <div ref={listRef} onScroll={onScroll} className="min-h-0 flex-1 overflow-y-auto px-4 py-4">
        {msgs === null ? (
          <div className="f-text py-10 text-center text-[14px] text-neutral-400">Φόρτωση…</div>
        ) : list.length === 0 ? (
          <div className="f-text py-10 text-center text-[14px] text-neutral-500">
            Δεν υπάρχει μήνυμα τις τελευταίες 48 ώρες. Γράψε πρώτος.
          </div>
        ) : (
          <div className="space-y-3">
            {list.map((m, i) => (
              <div key={m.id} className={`flex flex-col ${m.mine ? "items-end" : "items-start"}`}>
                <div className={`f-text max-w-[78%] whitespace-pre-wrap break-words border-2 border-black px-3.5 py-2.5 text-[15px] leading-snug ${
                  m.mine ? "bg-black text-white" : "bg-white text-black"}`}>
                  {m.body}
                </div>
                <div className="f-mono mt-1 text-[11px] text-neutral-400">
                  {fmtChatTime(m.at)}
                  {i === lastMine && (m.read ? ", το διάβασε" : ", δεν το έχει δει")}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="shrink-0 border-t-2 border-black p-3">
        <div className="flex items-end gap-2">
          <textarea ref={inputRef} value={text} rows={rows} maxLength={1000}
            disabled={chatOn === false}
            onChange={(e) => setText(e.target.value)}
            onKeyDown={onKeyDown}
            placeholder={chatOn === false ? "Τα μηνύματα είναι κλειστά" : "Γράψε απάντηση"}
            className="f-text min-w-0 flex-1 resize-none border-2 border-black bg-white px-3 py-2.5 text-[15px] leading-snug outline-none disabled:opacity-50" />
          <Button onClick={send} disabled={!text.trim() || sending || chatOn === false} className="shrink-0">
            {sending ? "…" : "Αποστολή"}
          </Button>
        </div>
        <div className="f-text mt-1.5 flex justify-between gap-3 text-[11px] text-neutral-400">
          <span>{chatOn === false
            ? "Άνοιξε τα μηνύματα από τον διακόπτη πάνω για να γράψεις."
            : isDesktop ? "Enter για αποστολή, Shift+Enter για νέα γραμμή." : "Ο πελάτης παίρνει ειδοποίηση στο κινητό."}</span>
          {text.length > 900 && <span className="f-mono">{text.length}/1000</span>}
        </div>
      </div>
    </div>
  );
}

/* Ο διακόπτης των μηνυμάτων. Κλειστά: ο πελάτης δεν βλέπει το
   εικονίδιο και δεν μπορεί να γράψει, και για να μην πηγαίνουν
   μηνύματα σε συζήτηση που δεν βλέπει, δεν γράφει ούτε η διαχείριση.
   Οι παλιές συζητήσεις μένουν εδώ για να τις διαβάσεις. */
function ChatSwitch({ on, saving, onToggle }) {
  const known = on !== null;
  return (
    <div className="mt-5 flex max-w-[640px] items-center justify-between gap-4 border-2 border-black px-4 py-3">
      <div className="min-w-0">
        <div className="f-text text-[15px] font-semibold">
          {!known ? "Μηνύματα πελατών" : on ? "Τα μηνύματα είναι ανοιχτά" : "Τα μηνύματα είναι κλειστά"}
        </div>
        <div className="f-text mt-0.5 text-[12px] leading-snug text-neutral-500">
          {!known ? "Φόρτωση…"
            : on ? "Οι πελάτες βλέπουν το εικονίδιο στην εφαρμογή και μπορούν να σου γράψουν."
            : "Οι πελάτες δεν βλέπουν το εικονίδιο και δεν μπορούν να γράψουν. Άνοιξέ τα όποτε θέλεις."}
        </div>
      </div>
      <button onClick={onToggle} role="switch" aria-checked={!!on} disabled={!known || saving}
        aria-label={on ? "Κλείσε τα μηνύματα" : "Άνοιξε τα μηνύματα"}
        className={`relative h-11 w-[58px] shrink-0 border-2 border-black disabled:opacity-50 ${on ? "bg-black" : "bg-white"}`}>
        <span className={`absolute top-[7px] h-[26px] w-[26px] border-2 border-black bg-white transition-all duration-150 ${
          on ? "left-[23px]" : "left-[5px]"}`} />
      </button>
    </div>
  );
}

function Chat({ flash, onAuthFail, isDesktop, pulse, onChanged, openClientRef, chatOn, chatSaving, onToggleChat }) {
  const [list, setList] = useState(null);
  const [sel, setSel] = useState(null);
  const [picking, setPicking] = useState(false);
  const [pick, setPick] = useState({ id: null, name: "", phone: "" });
  const failedRef = useRef(false);

  const loadList = useCallback(async () => {
    const { data, error } = await rpc("admin_chats", {});
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) {
      if (!failedRef.current) { failedRef.current = true; flash("Δεν φόρτωσαν τα μηνύματα"); }
      setList((prev) => (prev === null ? [] : prev));
      return;
    }
    failedRef.current = false;
    setList(data || []);
  }, [flash, onAuthFail]);

  useEffect(() => {
    loadList();
    const id = setInterval(() => { if (document.visibilityState === "visible") loadList(); }, CHATS_POLL_MS);
    return () => clearInterval(id);
  }, [loadList]);

  /* Ήρθε νέο μήνυμα (το είδε ο έλεγχος στο παρασκήνιο). */
  useEffect(() => { if (pulse) loadList(); }, [pulse, loadList]);

  useEffect(() => {
    openClientRef.current = sel ? sel.client_id : null;
    return () => { openClientRef.current = null; };
  }, [sel, openClientRef]);

  const threadChanged = useCallback(() => { loadList(); onChanged(); }, [loadList, onChanged]);

  const startWith = () => {
    if (!pick.id) { flash("Διάλεξε πρώτα τον πελάτη"); return; }
    setSel({ client_id: pick.id, name: pick.name, phone: pick.phone });
    setPicking(false);
    setPick({ id: null, name: "", phone: "" });
  };

  const rows = list || [];

  const listView = (
    <div>
      {!picking ? (
        <Button variant="outline" size="sm" onClick={() => setPicking(true)}>Νέα συζήτηση</Button>
      ) : (
        <div className="border-2 border-black p-4">
          <div className="f-text text-[13px] text-neutral-500">Σε ποιον πελάτη θέλεις να γράψεις;</div>
          <OneClientPicker
            clientId={pick.id}
            clientName={pick.name}
            onPick={(c) => setPick({ id: c.id, name: c.name, phone: c.phone || "" })}
            onClear={() => setPick({ id: null, name: "", phone: "" })}
            onAuthFail={onAuthFail}
          />
          <div className="mt-3 flex gap-2">
            <Button size="sm" onClick={startWith}>Άνοιξε τη συζήτηση</Button>
            <Button variant="ghost" size="sm" onClick={() => { setPicking(false); setPick({ id: null, name: "", phone: "" }); }}>Άκυρο</Button>
          </div>
        </div>
      )}

      {list === null ? (
        <div className="f-text py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : rows.length === 0 ? (
        <div className="f-text mt-4 border-2 border-dashed border-neutral-300 px-4 py-12 text-center text-[15px] text-neutral-500">
          Κανένα μήνυμα τις τελευταίες 48 ώρες.
        </div>
      ) : (
        <div className="mt-4 divide-y divide-neutral-200 border-y-2 border-black">
          {rows.map((r) => {
            const active = sel && sel.client_id === r.client_id;
            return (
              <button key={r.client_id}
                onClick={() => setSel({ client_id: r.client_id, name: r.name, phone: r.phone })}
                className={`flex w-full items-start justify-between gap-3 px-3 py-3 text-left ${
                  active ? "bg-black text-white" : "bg-white hover:bg-neutral-50"}`}>
                <div className="min-w-0 flex-1">
                  <div className={`f-text truncate text-[15px] ${r.unread > 0 ? "font-bold" : "font-semibold"}`}>{r.name}</div>
                  <div className={`f-text mt-0.5 truncate text-[13px] ${active ? "" : r.unread > 0 ? "text-black" : "text-neutral-500"}`}>
                    {r.last_from_admin ? "Εσύ: " : ""}{r.last_body}
                  </div>
                </div>
                <div className="flex shrink-0 flex-col items-end gap-1">
                  <span className={`f-mono text-[11px] ${active ? "" : "text-neutral-400"}`}>{fmtChatTime(r.last_at)}</span>
                  {r.unread > 0 && !active && (
                    <span className="f-mono flex h-[19px] min-w-[19px] items-center justify-center rounded-full bg-red-600 px-[4px] text-[10px] font-bold leading-none text-white">
                      {r.unread > 9 ? "9+" : r.unread}
                    </span>
                  )}
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );

  const thread = sel ? (
    <ChatThread key={sel.client_id} client={sel} flash={flash} onAuthFail={onAuthFail}
      isDesktop={isDesktop} chatOn={chatOn}
      onBack={() => { setSel(null); loadList(); }}
      onChanged={threadChanged}
      onDeleted={() => { setSel(null); threadChanged(); }} />
  ) : null;

  return (
    <div className="px-5 sm:px-6">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Μηνύματα</h2>
      <p className="f-text mt-1 max-w-[60ch] text-[13px] leading-relaxed text-neutral-500">
        Συζητήσεις με τους πελάτες. Ό,τι γράφεις φτάνει σαν ειδοποίηση στο κινητό τους.
        Τα μηνύματα σβήνονται μόνα τους 48 ώρες μετά.
      </p>

      <ChatSwitch on={chatOn} saving={chatSaving} onToggle={onToggleChat} />

      {isDesktop ? (
        <div className="mt-6 grid grid-cols-[300px_minmax(0,1fr)] items-start gap-6">
          {listView}
          {thread || (
            <div className="f-text flex items-center justify-center border-2 border-dashed border-neutral-300 px-6 text-center text-[15px] text-neutral-500"
              style={{ height: "68vh", minHeight: 360 }}>
              Διάλεξε συζήτηση από τα αριστερά ή ξεκίνα καινούρια.
            </div>
          )}
        </div>
      ) : (
        <div className="mt-6">{thread || listView}</div>
      )}
      <div className="h-10" />
    </div>
  );
}

function Announcements({ flash, onAuthFail }) {
  const [rows, setRows] = useState(null);
  const [form, setForm] = useState(EMPTY_ANN);
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState("");
  const [confirmDel, setConfirmDel] = useState(null);

  const load = useCallback(async () => {
    const { data, error } = await rpc("admin_announcements", {});
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { flash("Δεν φόρτωσαν οι ειδοποιήσεις"); return; }
    setRows(data || []);
  }, [flash, onAuthFail]);

  useEffect(() => { load(); }, [load]);

  const set = (k, v) => setForm((prev) => ({ ...prev, [k]: v }));

  const startNew = () => { setForm(EMPTY_ANN); setOpen(true); };

  const startEdit = (r) => {
    setForm({
      id: r.id, title: r.title || "", body: r.body || "",
      audience: r.audience || "all", send_at: isoToLocalInput(r.send_at),
      client_id: r.client_id || null, client_name: r.client_name || "",
    });
    setOpen(true);
  };

  const save = async (sendNow) => {
    const title = form.title.trim();
    const body = form.body.trim();
    if (!body) { flash("Γράψε πρώτα το μήνυμα"); return; }
    const one = form.audience === "one";
    if (one && !form.client_id) { flash("Διάλεξε πρώτα τον πελάτη"); return; }
    let when = null;
    if (!sendNow) {
      if (!form.send_at) { flash("Διάλεξε πότε θα σταλεί"); return; }
      when = new Date(form.send_at).toISOString();
    }
    setBusy(sendNow ? "now" : "save");
    const { data, error } = await rpc("admin_save_announcement", {
      p_id: form.id, p_title: title, p_body: body,
      p_audience: form.audience, p_send_at: when, p_send_now: !!sendNow,
      p_client_id: one ? form.client_id : null,
    });
    setBusy("");
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data || !data.ok) { flash((data && data.error) || "Δεν αποθηκεύτηκε"); return; }
    flash(
      !sendNow ? "Μπήκε στο πρόγραμμα"
        : one ? `Στάλθηκε στον/στην ${form.client_name || "πελάτη"}`
        : `Στάλθηκε σε ${data.recipients} πελάτες`
    );
    setOpen(false);
    setForm(EMPTY_ANN);
    load();
  };

  const remove = async (id) => {
    setBusy("del");
    const { data, error } = await rpc("admin_delete_announcement", { p_id: id });
    setBusy("");
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data || !data.ok) { flash("Δεν διαγράφηκε"); return; }
    setConfirmDel(null);
    flash("Διαγράφηκε");
    load();
  };

  const audienceLabel = (r) => {
    if (r.audience === "one") return "Προσωπικά" + (r.client_name ? ` προς ${r.client_name}` : "");
    const hit = AUDIENCES.find((a) => a[0] === r.audience);
    return hit ? hit[1] : (OLD_AUDIENCES[r.audience] || r.audience);
  };

  return (
    <div className="max-w-2xl px-5 sm:px-6">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Ειδοποιήσεις</h2>
      <p className="f-text mt-1 max-w-[56ch] text-[13px] leading-relaxed text-neutral-500">
        Δικά σου μηνύματα προς τους πελάτες — κλειστά για διακοπές, καινούριο ομαδικό,
        αλλαγή ωραρίου. Φτάνουν σαν ειδοποίηση στο κινητό τους και φαίνονται και μέσα
        στην εφαρμογή. Μπορείς να στείλεις και προσωπικά, σε έναν μόνο πελάτη.
      </p>

      {!open && (
        <div className="mt-6">
          <Button onClick={startNew}>Νέα ειδοποίηση</Button>
        </div>
      )}

      {open && (
        <div className="mt-6 border-2 border-black p-5">
          <div className="f-display text-[13px] font-bold uppercase tracking-wide text-neutral-500">
            {form.id ? "Επεξεργασία" : "Νέα ειδοποίηση"}
          </div>

          <label className="f-text mt-4 block text-[13px] text-neutral-500">Τίτλος</label>
          <input value={form.title} onChange={(e) => set("title", e.target.value)} maxLength={60}
            placeholder="π.χ. Κλειστά την Καθαρά Δευτέρα"
            className="f-text mt-2 h-12 w-full border-2 border-black px-4 text-[15px] outline-none" />

          <label className="f-text mt-4 block text-[13px] text-neutral-500">Μήνυμα</label>
          <textarea value={form.body} onChange={(e) => set("body", e.target.value)} rows={4} maxLength={300}
            placeholder="Ό,τι θα διαβάσει ο πελάτης."
            className="f-text mt-2 w-full resize-y border-2 border-black p-4 text-[15px] leading-relaxed outline-none" />
          <div className="f-mono mt-1 text-right text-[11px] text-neutral-400">{form.body.length}/300</div>

          <label className="f-text mt-2 block text-[13px] text-neutral-500">Σε ποιους</label>
          <div className="mt-2 flex flex-wrap gap-2">
            {AUDIENCES.map(([k, label]) => (
              <button key={k}
                onClick={() => setForm((prev) => ({
                  ...prev, audience: k,
                  client_id: k === "one" ? prev.client_id : null,
                  client_name: k === "one" ? prev.client_name : "",
                }))}
                className={`f-display border-2 border-black px-3 py-2 text-[11px] font-bold uppercase tracking-wide ${
                  form.audience === k ? "bg-black text-white" : "bg-white text-neutral-500"}`}>
                {label}
              </button>
            ))}
          </div>

          {form.audience === "one" && (
            <>
              <label className="f-text mt-4 block text-[13px] text-neutral-500">Ποιος πελάτης</label>
              <OneClientPicker
                clientId={form.client_id}
                clientName={form.client_name}
                onPick={(c) => setForm((prev) => ({ ...prev, client_id: c.id, client_name: c.name }))}
                onClear={() => setForm((prev) => ({ ...prev, client_id: null, client_name: "" }))}
                onAuthFail={onAuthFail}
              />
              <p className="f-text mt-2 max-w-[56ch] text-[12px] leading-relaxed text-neutral-500">
                Το μήνυμα το βλέπει μόνο αυτός. Κανείς άλλος δεν παίρνει τίποτα.
              </p>
            </>
          )}

          <label className="f-text mt-4 block text-[13px] text-neutral-500">Πότε να σταλεί</label>
          <input type="datetime-local" value={form.send_at} onChange={(e) => set("send_at", e.target.value)}
            className="f-mono mt-2 h-12 w-full max-w-xs border-2 border-black px-4 text-[14px] outline-none" />
          <p className="f-text mt-2 text-[12px] leading-relaxed text-neutral-500">
            Ώρα Ελλάδας. Αν θέλεις να φύγει αμέσως, πάτα «Στείλ' το τώρα» και άσε το πεδίο κενό.
          </p>

          <div className="mt-5 flex flex-wrap gap-2 border-t-2 border-black pt-4">
            <Button disabled={!!busy} onClick={() => save(false)}>
              {busy === "save" ? "…" : "Αποθήκευση στο πρόγραμμα"}
            </Button>
            <Button variant="outline" disabled={!!busy} onClick={() => save(true)}>
              {busy === "now" ? "…" : "Στείλ' το τώρα"}
            </Button>
            <Button variant="ghost" onClick={() => { setOpen(false); setForm(EMPTY_ANN); }}>Άκυρο</Button>
          </div>
        </div>
      )}

      <h3 className="f-display mt-9 text-[13px] font-bold uppercase tracking-wide text-neutral-500">Ιστορικό και προγραμματισμένες</h3>

      {rows === null ? (
        <div className="f-text py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : rows.length === 0 ? (
        <div className="f-text mt-2 border-2 border-dashed border-neutral-300 py-14 text-center text-[15px] text-neutral-500">
          Δεν έχεις φτιάξει καμία ακόμα.
        </div>
      ) : (
        <div className="mt-2 divide-y divide-neutral-200 border-y-2 border-black">
          {rows.map((r) => (
            <div key={r.id} className="py-4">
              <div className="flex flex-wrap items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="f-text text-[15px] font-semibold">{r.title || "Χωρίς τίτλο"}</div>
                  <div className="f-text mt-1 max-w-[56ch] text-[13px] leading-relaxed text-neutral-600">{r.body}</div>
                  <div className="f-mono mt-2 text-[12px] text-neutral-500">
                    {r.sent_at
                      ? `Στάλθηκε ${fmtWhen(r.sent_at)}` + (r.audience === "one" ? "" : ` · ${r.recipients} παραλήπτες`)
                      : `Φεύγει ${fmtWhen(r.send_at)}`}
                    {" · "}{audienceLabel(r)}
                  </div>
                </div>
                <span className={`f-display shrink-0 border-2 border-black px-2 py-1 text-[10px] font-bold uppercase tracking-wide ${
                  r.sent_at ? "bg-black text-white" : "bg-white text-black"}`}>
                  {r.sent_at ? "Στάλθηκε" : "Σε αναμονή"}
                </span>
              </div>

              <div className="mt-3 flex flex-wrap gap-2">
                {!r.sent_at && (
                  <Button variant="outline" size="sm" onClick={() => startEdit(r)}>Επεξεργασία</Button>
                )}
                {confirmDel === r.id ? (
                  <>
                    <Button size="sm" disabled={!!busy} onClick={() => remove(r.id)}>Ναι, σβήσ' τη</Button>
                    <Button variant="ghost" size="sm" onClick={() => setConfirmDel(null)}>Άκυρο</Button>
                  </>
                ) : (
                  <Button variant="ghost" size="sm" onClick={() => setConfirmDel(r.id)}>Διαγραφή</Button>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
      <div className="h-10" />
    </div>
  );
}

/* Χρειάζεται για να εμφανίζονται οι ειδοποιήσεις. */
if ("serviceWorker" in navigator) {
  const reg = () => navigator.serviceWorker.register("./sw.js").catch(() => { /* αγνόησε */ });
  if (document.readyState === "complete") reg();
  else window.addEventListener("load", reg);
}

/* Το όνομα φαίνεται στην πρώτη κιόλας οθόνη, ακόμα και πριν τη
   σύνδεση, οπότε το ζητάμε από τη δημόσια app_settings. Αν ο
   διακομιστής αργήσει πάνω από 3 δευτερόλεπτα, ξεκινάμε με την
   εφεδρική τιμή αντί να μείνει η σελίδα στο «Φόρτωση…». */
async function loadBrand() {
  const timeout = new Promise((resolve) => setTimeout(() => resolve(null), 3000));
  const call = rpc("app_settings", {}).then((r) => (r.error ? null : r.data)).catch(() => null);
  const data = await Promise.race([call, timeout]);
  if (data && data.gym_name) setGymName(data.gym_name);
  else document.title = GYM_NAME + " — Διαχείριση";
  if (data && data.max_days_ahead) setMaxDaysAhead(data.max_days_ahead);
  if (data && data.logo_url) setLogoUrl(data.logo_url);
}

/* Σφάλμα μέσα στα components: δείχνει μήνυμα με κουμπί ανανέωσης αντί
   για λευκή σελίδα. Σφάλματα σε κουμπιά και χρονόμετρα δεν φτάνουν ως
   εδώ — μένουν στην κονσόλα και η σελίδα συνεχίζει. */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { err: null };
  }
  static getDerivedStateFromError(err) {
    return { err: err };
  }
  componentDidCatch(err, info) {
    try { console.error(err, info); } catch (e) { /* αγνόησε */ }
  }
  render() {
    if (this.state.err) {
      return (
        <div style={FONT} className="mx-auto flex min-h-full max-w-md flex-col items-center justify-center px-6 py-16 text-center">
          <div className="f-display text-[26px] font-extrabold uppercase leading-tight tracking-tight">
            Κάτι πήγε στραβά
          </div>
          <p className="mt-3 text-[14px] leading-relaxed text-neutral-500">
            Ανανέωσε τη σελίδα. Η σύνδεσή σου μένει.
          </p>
          <p className="mt-2 break-words font-mono text-[12px] text-neutral-400">
            {String((this.state.err && this.state.err.message) || this.state.err)}
          </p>
          <Button className="mt-6" onClick={() => window.location.reload()}>Ανανέωση</Button>
        </div>
      );
    }
    return this.props.children;
  }
}

loadBrand().then(() => {
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
  window.__adminBooted = true;
});
</script>
