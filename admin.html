<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const SUPABASE_URL = "https://qkjceupbxdujgytikxug.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFramNldXBieGR1amd5dGlreHVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDI0NTUsImV4cCI6MjEwNDExODQ1NX0.cSsylfCvbqlvYgoeryf08jEVzvTjZGXli4dl7ZE7_Pc";
const TOKEN_KEY = "kinesis_admin_token";
const THEME_KEY = "kinesis_admin_theme";

/* ---------- Εμφάνιση ----------
   Ίδια λογική με τη σελίδα πελάτη: "auto" ακολουθεί τη ρύθμιση της
   συσκευής. Η επιλογή μένει στη συσκευή, δεν πάει στη βάση — άλλος
   διαχειριστής σε άλλο κινητό μπορεί να θέλει άλλο χρώμα. */
function applyTheme(choice) {
  let dark = choice === "dark";
  if (choice === "auto") {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0C0C0C" : "#FFFFFF");
}

function readTheme() {
  try { return localStorage.getItem(THEME_KEY) || "light"; } catch (e) { return "light"; }
}

applyTheme(readTheme());

/* ---------- Όνομα γυμναστηρίου ----------
   Δεν γράφεται πουθενά καρφωτό. Έρχεται από τις ρυθμίσεις και
   ενημερώνεται αμέσως μόλις ο διαχειριστής το αλλάξει, χωρίς να
   χρειάζεται ανανέωση της σελίδας. */
let GYM_NAME = "Γυμναστήριο";
const brandSubs = new Set();

function setGymName(name) {
  const clean = (name || "").trim();
  if (!clean || clean === GYM_NAME) return;
  GYM_NAME = clean;
  document.title = GYM_NAME + " — Διαχείριση";
  brandSubs.forEach((fn) => fn(GYM_NAME));
}

function useGymName() {
  const [name, setName] = useState(GYM_NAME);
  useEffect(() => {
    brandSubs.add(setName);
    setName(GYM_NAME);
    return () => { brandSubs.delete(setName); };
  }, []);
  return name;
}

/* ---------- Πόσες μέρες μπροστά ----------
   Η λωρίδα ημερών στο Πρόγραμμα δείχνει ό,τι ανοίγει και στον πελάτη:
   τόσες μέρες μπροστά όσες λέει η ρύθμιση «Κρατήσεις μπροστά». Δεν
   γράφεται καρφωτό πουθενά — ενημερώνεται μόλις αλλάξει η ρύθμιση. */
let MAX_DAYS_AHEAD = 14;

function setMaxDaysAhead(n) {
  const v = Number(n);
  if (v > 0) MAX_DAYS_AHEAD = v;
}

/* ---------- auth + data access ----------
   Το access token της Supabase ζει μία ώρα. Παλιά κρατούσαμε μόνο
   αυτό: μετά από μία ώρα κάθε κλήση γύριζε 401 και η διαχείριση
   πεταγόταν έξω στη μέση της δουλειάς. Τώρα κρατάμε και το refresh
   token και το ανανεώνουμε μόνοι μας, πριν λήξει και μετά από 401. */
const SESSION_KEY = "kinesis_admin_session";

let session = null;
try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) {}

/* Παλιά αποθήκευση, μόνο access token. Όποιος είναι ήδη συνδεδεμένος
   συνεχίζει κανονικά μέχρι να λήξει· μετά ζητάει σύνδεση μία φορά
   και από κει και πέρα ανανεώνεται μόνο του. */
if (!session) {
  try {
    const legacy = localStorage.getItem(TOKEN_KEY);
    if (legacy) session = { access_token: legacy, refresh_token: null, expires_at: 0 };
  } catch (e) {}
}

const hasSession = () => !!(session && session.access_token);

function saveSession(body) {
  session = {
    access_token: body.access_token,
    refresh_token: body.refresh_token || (session && session.refresh_token) || null,
    /* Ένα λεπτό περιθώριο, να μη μας προλάβει η λήξη στον δρόμο. */
    expires_at: Date.now() + ((body.expires_in || 3600) - 60) * 1000,
  };
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    localStorage.removeItem(TOKEN_KEY);
  } catch (e) {}
}

async function signIn(email, password) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
    body: JSON.stringify({ email: email, password: password }),
  });
  const body = await res.json();
  if (!res.ok) return { ok: false, error: body.error_description || body.msg || "Λάθος email ή κωδικός" };
  session = null;
  saveSession(body);
  return { ok: true };
}

function signOut() {
  session = null;
  try {
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(TOKEN_KEY);
  } catch (e) {}
}

/* Μία ανανέωση τη φορά, κι ας τη ζητήσουν πέντε κλήσεις μαζί. */
let refreshing = null;
function refreshSession() {
  if (!session || !session.refresh_token) return Promise.resolve(false);
  if (refreshing) return refreshing;

  refreshing = (async () => {
    try {
      const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY },
        body: JSON.stringify({ refresh_token: session.refresh_token }),
      });
      if (!res.ok) return false;
      const body = await res.json();
      if (!body.access_token) return false;
      saveSession(body);
      return true;
    } catch (e) {
      return false;
    }
  })();

  const done = refreshing;
  const clear = () => { refreshing = null; };
  done.then(clear, clear);
  return done;
}

async function currentToken() {
  if (session && session.expires_at && Date.now() >= session.expires_at) {
    await refreshSession();
  }
  return (session && session.access_token) || SUPABASE_ANON_KEY;
}

async function rpc(fnName, args, retried) {
  try {
    const token = await currentToken();
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fnName, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + token,
      },
      body: JSON.stringify(args || {}),
    });
    const text = await res.text();
    if (res.status === 401 || res.status === 403) {
      /* Μπορεί να έληξε νωρίτερα απ' ό,τι νομίζαμε: μία ανανέωση,
         μία δεύτερη προσπάθεια, και μετά ζητάμε σύνδεση. */
      if (!retried && await refreshSession()) return rpc(fnName, args, true);
      return { data: null, error: "AUTH" };
    }
    if (!res.ok) return { data: null, error: text || res.statusText };
    return { data: text ? JSON.parse(text) : null, error: null };
  } catch (e) {
    return { data: null, error: String(e) };
  }
}

/* ---------- dates ---------- */
const DAYS = ["Κυρ", "Δευ", "Τρί", "Τετ", "Πέμ", "Παρ", "Σάβ"];
const DAYS_LONG = ["Κυριακή", "Δευτέρα", "Τρίτη", "Τετάρτη", "Πέμπτη", "Παρασκευή", "Σάββατο"];
const MONTHS = ["Ιαν", "Φεβ", "Μαρ", "Απρ", "Μαΐ", "Ιουν", "Ιουλ", "Αυγ", "Σεπ", "Οκτ", "Νοε", "Δεκ"];
const pad2 = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDay = (s) => { const d = parseISO(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtDayLong = (s) => { const d = parseISO(s); return `${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };

/* ---------- Στόχοι πελατών ----------
   Ίδια κλειδιά με τη goal_keys() στη βάση και με το index.html.
   Αν προστεθεί στόχος, θέλει αλλαγή και στα τρία. */
const GOAL_LABELS = {
  weight_loss: "Απώλεια βάρους",
  muscle_gain: "Αύξηση μυϊκής μάζας",
  toning: "Γράμμωση / σύσφιξη",
  maintain: "Διατήρηση φόρμας",
  strength: "Αύξηση δύναμης",
  endurance: "Καλύτερη αντοχή",
  flexibility: "Ευλυγισία και κινητικότητα",
  core: "Ισορροπία και σταθερότητα κορμού",
  event_prep: "Προετοιμασία για αγώνα",
  posture: "Καλύτερη στάση σώματος",
  pain_relief: "Λιγότεροι πόνοι στη μέση ή τον αυχένα",
  injury_recovery: "Επιστροφή μετά από τραυματισμό",
  stress: "Λιγότερο άγχος, καλύτερη διάθεση",
  sleep: "Καλύτερος ύπνος",
  energy: "Ενέργεια για την καθημερινότητα",
  routine: "Σταθερή ρουτίνα άσκησης",
  classes: "Ομαδικά μαθήματα και παρέα",
};
const goalLabel = (k) => GOAL_LABELS[k] || k;

/* ---------- Νέες κρατήσεις ----------
   Κάθε λεπτό ρωτάμε τον διακομιστή τι μπήκε από την τελευταία φορά.
   Ό,τι γυρίσει είναι καινούριο: μπαίνει στην καμπάνα και βγάζει
   ειδοποίηση. Μία κλήση, όχι μία ανά ημέρα.

   Η ώρα της τελευταίας ματιάς έρχεται από τον διακομιστή, όχι από τη
   συσκευή. Έτσι δεν χάνεται κράτηση επειδή το ρολόι του κινητού
   πηγαίνει μπροστά. */
const SINCE_KEY = "kinesis_admin_since";
const NEW_KEY = "kinesis_admin_new_bookings";
const SOUND_KEY = "kinesis_admin_sound";
const WATCH_MS = 20000;

/* null = πρώτη φορά σε αυτή τη συσκευή, οπότε δεν ειδοποιούμε για
   κρατήσεις που υπήρχαν ήδη. */
function readSince() {
  try { return localStorage.getItem(SINCE_KEY) || null; } catch (e) { return null; }
}
function writeSince(t) {
  try { localStorage.setItem(SINCE_KEY, t); } catch (e) {}
}

/* Οι κόκκινες βούλες κρατάνε και μετά από ανανέωση της σελίδας. */
function readNew() {
  try {
    const r = JSON.parse(localStorage.getItem(NEW_KEY) || "null");
    if (!r || !Array.isArray(r.items)) return { items: [], unseen: 0 };
    const today = iso(new Date());
    const items = r.items.filter((b) => b && b.date >= today);
    return { items: items, unseen: Math.min(r.unseen || 0, items.length) };
  } catch (e) { return { items: [], unseen: 0 }; }
}
function writeNew(items, unseen) {
  try { localStorage.setItem(NEW_KEY, JSON.stringify({ items: items, unseen: unseen })); } catch (e) {}
}

/* Πόσες καινούριες κρατήσεις είχε η κάθε μέρα την ώρα που την πάτησε
   ο διαχειριστής. Κρατιέται στη συσκευή — αλλιώς μετά από ανανέωση
   της σελίδας οι κόκκινες βούλες ξαναέβγαιναν πάνω στις ημέρες, ενώ
   τις είχε ήδη δει. */
const SEEN_DAYS_KEY = "kinesis_admin_seen_days";

function readSeenDays() {
  try {
    const r = JSON.parse(localStorage.getItem(SEEN_DAYS_KEY) || "{}");
    if (!r || typeof r !== "object") return {};
    const today = iso(new Date());
    const out = {};
    Object.keys(r).forEach((d) => { if (d >= today) out[d] = r[d]; });
    return out;
  } catch (e) { return {}; }
}
function writeSeenDays(m) {
  try { localStorage.setItem(SEEN_DAYS_KEY, JSON.stringify(m)); } catch (e) {}
}

/* Ποιες μέρες έχουν κάτι που δεν το έχει δει ακόμα. Την ίδια απάντηση
   χρησιμοποιούν και οι βούλες στις ημέρες και η βούλα δίπλα στο
   «Πρόγραμμα», ώστε να μη λένε ποτέ διαφορετικά πράγματα. */
function countNewByDate(items) {
  const byDate = new Map();
  (items || []).forEach((b) => {
    if (b.kind === "cancelled") return;
    byDate.set(b.date, (byDate.get(b.date) || 0) + 1);
  });
  return byDate;
}
function hasUnseenDay(items, seen) {
  let found = false;
  countNewByDate(items).forEach((n, d) => { if (n > ((seen || {})[d] || 0)) found = true; });
  return found;
}

/* Ήχος νέας κράτησης. Δεν υπάρχει αρχείο ήχου στο repo — τον
   φτιάχνουμε με Web Audio, δύο σύντομες νότες.

   Κανένας browser δεν παίζει ήχο πριν ο χρήστης αγγίξει τη σελίδα,
   γι' αυτό ξεκλειδώνουμε στο πρώτο πάτημα και ξαναδοκιμάζουμε σε
   κάθε επόμενο: στο κινητό ο ήχος "κοιμάται" όταν κλειδώνει η οθόνη.

   Παίζει και χωρίς άδεια ειδοποιήσεων, όσο η σελίδα είναι ανοιχτή. */
function soundOn() {
  try { return localStorage.getItem(SOUND_KEY) !== "off"; } catch (e) { return true; }
}
function setSoundOn(v) {
  try { localStorage.setItem(SOUND_KEY, v ? "on" : "off"); } catch (e) {}
}

let audioCtx = null;
function wakeAudio() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { /* ignore */ }
}
window.addEventListener("pointerdown", wakeAudio, { passive: true });
window.addEventListener("keydown", wakeAudio);

function chime(force, down) {
  if (!force && !soundOn()) return;
  wakeAudio();
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    const notes = down ? [[740, 0], [520, 0.13]] : [[880, 0], [1320, 0.13]];
    notes.forEach(([freq, at]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0 + at);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.32);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0 + at);
      osc.stop(t0 + at + 0.36);
    });
  } catch (e) { /* ignore */ }
}

async function notify(title, body, tag) {
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  try {
    if ("serviceWorker" in navigator) {
      const reg = await Promise.race([
        navigator.serviceWorker.ready,
        new Promise((res) => setTimeout(() => res(null), 1500)),
      ]);
      if (reg) {
        await reg.showNotification(title, {
          body: body, icon: "./icon-192.png", badge: "./icon-192.png", tag: tag,
          /* Ο service worker είναι ο ίδιος για τις δύο σελίδες. Χωρίς
             αυτό, το πάτημα σε ειδοποίηση της διαχείρισης άνοιγε την
             εφαρμογή πελατών. */
          data: { url: "./admin.html" },
        });
        return;
      }
    }
    new Notification(title, { body: body, icon: "./icon-192.png", tag: tag });
  } catch (e) { /* ignore */ }
}

/* Ό,τι μπήκε μετά το p_since. Επιστρέφει το σφάλμα αντί για σκέτο
   null — αλλιώς μια αποτυχία (π.χ. λείπει η συνάρτηση από τη βάση)
   περνάει σιωπηλά και η διαχείριση δείχνει απλώς "τίποτα νέο". Το
   σημάδι του χρόνου δεν προχωράει σε αποτυχία, ώστε να μη χαθούν οι
   κρατήσεις εκείνης της ματιάς. */
function errText(t) {
  try {
    const j = JSON.parse(t);
    return j.message || j.hint || j.details || String(t);
  } catch (e) { return String(t).slice(0, 160); }
}

async function fetchNew(since) {
  const r = await rpc("admin_new_bookings", { p_since: since });
  if (r.error) return { err: r.error === "AUTH" ? "AUTH" : errText(r.error) };
  const d = r.data || {};
  if (!d.now) return { err: "Η admin_new_bookings δεν επέστρεψε ώρα διακομιστή" };
  /* Το "x-" μπροστά στις ακυρώσεις: η ίδια κράτηση μπορεί να γίνει
     και να ακυρωθεί μέσα στην ίδια ματιά, και θέλουμε να φανούν
     και τα δύο. */
  const pick = (arr, kind) => (arr || []).map((b) => ({
    id: (kind === "cancelled" ? "x-" : "") + b.id,
    kind: kind, date: b.date, time: b.time, name: b.name, phone: b.phone,
  }));
  return {
    now: d.now,
    bookings: pick(d.bookings, "booked").concat(pick(d.cancellations, "cancelled")),
  };
}

function useNewBookings({ enabled, onAuthFail, flash }) {
  const stored = useMemo(readNew, []);
  const [items, setItems] = useState(stored.items);
  const [unseen, setUnseen] = useState(stored.unseen);
  const [pulse, setPulse] = useState(0);
  const [error, setError] = useState(null);
  const toldRef = useRef(false);

  /* Ο διακομιστής στέλνει λίγα δευτερόλεπτα επικάλυψη σε κάθε ματιά,
     για να μη χαθεί κράτηση που γράφτηκε ακριβώς στο όριο. Εδώ
     θυμόμαστε τι έχουμε ήδη δει, ώστε να μη διπλοχτυπήσει. */
  const knownRef = useRef(new Set(stored.items.map((x) => x.id)));

  useEffect(() => { writeNew(items, unseen); }, [items, unseen]);

  useEffect(() => {
    if (!enabled) return;
    let alive = true;

    const scan = async () => {
      const since = readSince();
      const res = await fetchNew(since || new Date().toISOString());
      if (!alive) return;
      if (res.err === "AUTH") { onAuthFail(); return; }
      if (res.err) {
        setError(res.err);
        if (!toldRef.current) {
          toldRef.current = true;
          flash("Ο έλεγχος νέων κρατήσεων απέτυχε");
        }
        return;
      }
      setError(null);
      toldRef.current = false;

      writeSince(res.now);
      if (since === null) return;

      const fresh = res.bookings.filter((b) => !knownRef.current.has(b.id));
      if (fresh.length === 0) return;
      fresh.forEach((b) => knownRef.current.add(b.id));

      setItems((prev) => [...fresh, ...prev].slice(0, 40));
      setUnseen((n) => n + fresh.length);
      setPulse((n) => n + 1);

      const allCancels = fresh.every((b) => b.kind === "cancelled");
      chime(false, allCancels);
      fresh.forEach((b) =>
        notify(b.kind === "cancelled" ? "Ακυρώθηκε κράτηση" : "Έγινε κράτηση",
          `${b.name} · ${fmtDayLong(b.date)}, ${b.time}`, "kinesis-new-" + b.id));
      flash(fresh.length === 1
        ? (fresh[0].kind === "cancelled" ? "Ακυρώθηκε: " : "Έγινε κράτηση: ") + fresh[0].name
        : fresh.length + " νέες ειδοποιήσεις");
    };

    scan();
    const id = setInterval(scan, WATCH_MS);
    const onVisible = () => { if (document.visibilityState === "visible") scan(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      alive = false;
      clearInterval(id);
      document.removeEventListener("visibilitychange", onVisible);
    };
  }, [enabled, onAuthFail, flash]);

  const markSeen = useCallback(() => setUnseen(0), []);
  const dismiss = useCallback((ids) => {
    const drop = new Set(Array.isArray(ids) ? ids : [ids]);
    if (drop.size === 0) return;
    setItems((prev) => prev.filter((x) => !drop.has(x.id)));
  }, []);
  const clear = useCallback(() => { setItems([]); setUnseen(0); }, []);

  return { items: items, unseen: unseen, pulse: pulse, error: error, markSeen: markSeen, dismiss: dismiss, clear: clear };
}

function Button({ children, onClick, variant = "primary", disabled, className = "", size = "md" }) {
  const base = "f-display inline-flex items-center justify-center border-2 border-black font-bold uppercase tracking-wide transition-colors select-none";
  const sizes = { md: "h-12 px-5 text-[15px]", sm: "h-9 px-3 text-[13px]", lg: "h-14 px-6 text-[17px] w-full" };
  const variants = {
    primary: "bg-black text-white hover:bg-neutral-800 disabled:bg-neutral-200 disabled:text-neutral-400 disabled:border-neutral-200",
    outline: "bg-white text-black hover:bg-black hover:text-white disabled:text-neutral-300 disabled:border-neutral-200",
    ghost: "border-transparent text-neutral-500 hover:text-black normal-case tracking-normal font-medium",
  };
  return <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>{children}</button>;
}

function SeatMeter({ taken, cap }) {
  if (cap <= 24) {
    return (
      <div className="flex flex-wrap gap-[3px]">
        {Array.from({ length: cap }).map((_, i) => (
          <div key={i} className={`h-[16px] w-[10px] border border-black ${i < taken ? "bg-black" : "bg-white"}`} />
        ))}
      </div>
    );
  }
  const pct = cap ? Math.min(100, (taken / cap) * 100) : 0;
  return (
    <div className="relative h-[14px] w-full border border-black bg-white">
      <div className="absolute inset-y-0 left-0 bg-black" style={{ width: `${pct}%` }} />
    </div>
  );
}

function Kpi({ label, value, note, onClick }) {
  const inner = (
    <>
      <div className="f-mono text-[30px] leading-none tracking-tight">{value}</div>
      <div className="f-text mt-2 text-[13px] text-neutral-600">{label}</div>
      {note && <div className="f-mono text-[11px] text-neutral-400">{note}</div>}
    </>
  );
  if (!onClick) return <div className="border-2 border-black p-3">{inner}</div>;
  return (
    <button onClick={onClick}
      className="border-2 border-black p-3 text-left hover:bg-neutral-50 active:bg-black active:text-white">
      {inner}
    </button>
  );
}

function Bars({ items, format }) {
  const max = Math.max(1, ...items.map((i) => i.value));
  return (
    <div className="space-y-2.5">
      {items.map((it) => (
        <div key={it.label} className="flex items-center gap-3">
          <div className="f-mono w-12 shrink-0 text-[12px] text-neutral-500">{it.label}</div>
          <div className="h-5 flex-1 border border-black bg-white">
            <div className="h-full bg-black" style={{ width: `${Math.round((it.value / max) * 100)}%` }} />
          </div>
          <div className="f-mono w-10 shrink-0 text-right text-[12px] text-neutral-700">
            {format ? format(it.value) : it.value}
          </div>
        </div>
      ))}
    </div>
  );
}

function Stepper({ value, onChange, min = 0, max = 200, suffix = "", step = 1, format }) {
  return (
    <div className="flex items-center gap-1">
      <button onClick={() => onChange(Math.max(min, value - step))}
        className="f-display h-10 w-10 border-2 border-black text-lg font-bold hover:bg-black hover:text-white">−</button>
      <div className="f-mono w-[84px] text-center text-[16px]">
        {format ? format(value) : `${value}${suffix}`}
      </div>
      <button onClick={() => onChange(Math.min(max, value + step))}
        className="f-display h-10 w-10 border-2 border-black text-lg font-bold hover:bg-black hover:text-white">+</button>
    </div>
  );
}

/* Λεπτά σε κάτι που διαβάζεται: 120 -> "2ω", 90 -> "1ω 30λ".
   Παλιά το όριο ακύρωσης εμφανιζόταν στρογγυλεμένο σε ώρες, οπότε
   τα 90 λεπτά έδειχναν "2ω" και δεν έβγαζε νόημα. */
function fmtMinutes(m) {
  const v = Math.max(0, Number(m) || 0);
  const h = Math.floor(v / 60), r = v % 60;
  if (h && r) return h + "ω " + r + "λ";
  if (h) return h + "ω";
  return r + "λ";
}

function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div className="pointer-events-none fixed inset-x-0 bottom-8 z-50 flex justify-center px-5">
      <div className="f-display border-2 border-black bg-black px-4 py-3 text-[14px] font-bold uppercase tracking-wide text-white">{msg}</div>
    </div>
  );
}

/* ---------- Root ---------- */
const TABS = [
  ["schedule", "Πρόγραμμα"],
  ["hours", "Χωρητικότητα"],
  ["people", "Πελάτες"],
  ["goals", "Στόχοι πελατών"],
  ["stats", "Στατιστικά"],
  ["access", "QR & NFC"],
  ["newsletter", "Ενημερώσεις"],
  ["settings", "Ρυθμίσεις"],
];

function App() {
  const [authed, setAuthed] = useState(hasSession);
  const [checking, setChecking] = useState(hasSession);
  const [tab, setTab] = useState("schedule");
  const [toast, setToast] = useState("");
  const [isDesktop, setIsDesktop] = useState(window.innerWidth >= 900);
  const [theme, setTheme] = useState(readTheme);
  const brand = useGymName();

  const flash = useCallback((m) => { setToast(m); setTimeout(() => setToast(""), 2800); }, []);

  useEffect(() => {
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* αγνόησε */ }
    if (theme !== "auto") return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = () => applyTheme("auto");
    mq.addEventListener("change", onChange);
    return () => mq.removeEventListener("change", onChange);
  }, [theme]);

  useEffect(() => {
    const onResize = () => setIsDesktop(window.innerWidth >= 900);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  // Saved token may be expired — verify it before trusting it.
  useEffect(() => {
    if (!hasSession()) return;
    (async () => {
      const { error } = await rpc("admin_get_settings", {});
      if (error === "AUTH") { signOut(); setAuthed(false); }
      setChecking(false);
    })();
  }, []);

  const onAuthFail = useCallback(() => { signOut(); setAuthed(false); }, []);
  const logout = () => { signOut(); setAuthed(false); };

  const watch = useNewBookings({ enabled: authed && !checking, onAuthFail: onAuthFail, flash: flash });
  const [bellOpen, setBellOpen] = useState(false);
  const [focus, setFocus] = useState(null);
  const [sound, setSound] = useState(soundOn);

  /* Ποιες μέρες έχει ήδη κοιτάξει. Ζει εδώ, όχι μέσα στο Πρόγραμμα,
     ώστε να το ξέρει και η βούλα του μενού — και γράφεται στη συσκευή
     ώστε να μη χαθεί με την ανανέωση της σελίδας. */
  const [seenDays, setSeenDays] = useState(readSeenDays);
  useEffect(() => { writeSeenDays(seenDays); }, [seenDays]);
  const markDaySeen = useCallback((date, count) => {
    setSeenDays((prev) => (prev[date] === count ? prev : { ...prev, [date]: count }));
  }, []);
  const somethingNew = hasUnseenDay(watch.items, seenDays);

  /* Το πάτημα είναι και η χειρονομία που ξεκλειδώνει τον ήχο στον
     browser, οπότε το δοκιμαστικό κουδούνισμα ακούγεται πάντα. */
  const toggleSound = useCallback(() => {
    const next = !soundOn();
    setSoundOn(next);
    setSound(next);
    if (next) chime(true);
  }, []);

  /* Οι ακυρώσεις δεν οδηγούν πουθενά — δεν υπάρχει κράτηση να
     ανοίξεις. Φεύγουν μόλις κλείσεις την καμπάνα, αφού τις είδες. */
  const closeBell = useCallback(() => {
    setBellOpen(false);
    const gone = watch.items.filter((b) => b.kind === "cancelled").map((b) => b.id);
    if (gone.length) watch.dismiss(gone);
  }, [watch]);

  const toggleBell = () => {
    if (bellOpen) { closeBell(); return; }
    watch.markSeen();
    setBellOpen(true);
  };

  /* «Καθάρισμα» στην καμπάνα: φεύγουν και οι μετρήσεις των ημερών,
     αλλιώς θα κρατούσαν παλιούς αριθμούς για πάντα. */
  const clearAll = useCallback(() => {
    watch.clear();
    setSeenDays({});
  }, [watch]);

  /* Πάτημα σε ειδοποίηση: πάει στο Πρόγραμμα, στη μέρα της κράτησης. */
  const openItem = (b) => {
    if (b.kind === "cancelled") { watch.dismiss(b.id); return; }
    setTab("schedule");
    setFocus({ date: b.date, time: b.time, n: Date.now() });
    setBellOpen(false);
  };

  if (checking) {
    return <div style={FONT} className="gym-root flex min-h-screen items-center justify-center text-[15px] text-neutral-400">Έλεγχος σύνδεσης…</div>;
  }
  if (!authed) {
    return <div style={FONT} className="gym-root min-h-screen bg-white text-black"><Login onDone={() => { setAuthed(true); setChecking(false); }} /></div>;
  }

  const props = { flash, onAuthFail };
  const bellPanel = bellOpen ? (
    <NotificationsPanel items={watch.items} error={watch.error} isDesktop={isDesktop} onOpenItem={openItem}
      onDismiss={watch.dismiss} onClear={clearAll} onClose={closeBell} />
  ) : null;

  const content = (
    <React.Fragment>
      {tab === "schedule" && (
        <Schedule {...props} refreshKey={watch.pulse} newItems={watch.items}
          focus={focus} onSeen={watch.dismiss}
          seenDays={seenDays} onDaySeen={markDaySeen} />
      )}
      {tab === "hours" && <Hours {...props} />}
      {tab === "people" && <People {...props} />}
      {tab === "goals" && <Goals {...props} />}
      {tab === "stats" && <Stats {...props} />}
      {tab === "access" && <Access {...props} />}
      {tab === "newsletter" && <Newsletter {...props} />}
      {tab === "settings" && <Settings {...props} watchError={watch.error} theme={theme} setTheme={setTheme} />}
    </React.Fragment>
  );

  if (!isDesktop) {
    return (
      <div style={FONT} className="gym-root min-h-screen bg-white text-black">
        {/* Η κεφαλίδα και οι επιλογές μένουν καρφωμένες στην κορυφή
            όσο κυλάει το περιεχόμενο από κάτω. */}
        <div className="sticky top-0 z-40 bg-white">
          <header className="flex items-center justify-between border-b-2 border-black px-5 pb-4 pt-6">
            <div>
              <div className="f-display text-[12px] font-bold uppercase tracking-[0.18em] text-neutral-400">{brand}</div>
              <div className="f-display mt-1 text-[19px] font-extrabold uppercase">Διαχείριση</div>
            </div>
            <div className="flex items-center gap-2">
              <SoundSwitch on={sound} onToggle={toggleSound} />
              <Bell count={watch.unseen} active={bellOpen} onClick={toggleBell} />
              <Button variant="ghost" size="sm" onClick={logout}>Έξοδος</Button>
            </div>
          </header>

          <div className="relative border-b-2 border-black bg-white px-5 py-3">
            <select value={tab} onChange={(e) => setTab(e.target.value)}
              className="f-display h-12 w-full appearance-none border-2 border-black bg-white px-4 text-[14px] font-bold uppercase tracking-wide outline-none">
              {TABS.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
            </select>
            {somethingNew && tab !== "schedule" && (
              <Dot className="pointer-events-none absolute right-9 top-1/2 -translate-y-1/2" />
            )}
          </div>
        </div>

        <main className="pb-16">{content}</main>
        {bellPanel}
        <Toast msg={toast} />
      </div>
    );
  }

  return (
    <div style={FONT} className="gym-root min-h-screen bg-white text-black">
      <div className="mx-auto flex min-h-screen max-w-[1180px]">
        <main className="min-w-0 flex-1 pb-16">{content}</main>

        <aside className="flex w-[230px] shrink-0 flex-col border-l-2 border-black px-5 py-7">
          <div className="f-display text-[12px] font-bold uppercase tracking-[0.18em] text-neutral-400">{brand}</div>
          <div className="f-display mt-1 text-[21px] font-extrabold uppercase tracking-tight">Διαχείριση</div>
          <div className="mt-4 flex items-center gap-2">
            <SoundSwitch on={sound} onToggle={toggleSound} />
            <Bell count={watch.unseen} active={bellOpen} onClick={toggleBell} />
          </div>
          <nav className="mt-8 space-y-1.5">
            {TABS.map(([k, label]) => (
              <button key={k} onClick={() => setTab(k)}
                className={`f-display flex w-full items-center justify-between border-2 px-3.5 py-2.5 text-left text-[13px] font-bold uppercase tracking-wide ${
                  tab === k ? "border-black bg-black text-white" : "border-transparent text-neutral-600 hover:border-neutral-300"}`}>
                {label}
                {k === "schedule" && tab !== "schedule" && somethingNew && <Dot />}
              </button>
            ))}
          </nav>
          <div className="mt-auto pt-8">
            <Button variant="ghost" size="sm" onClick={logout}>Έξοδος</Button>
          </div>
        </aside>
      </div>
      {bellPanel}
      <Toast msg={toast} />
    </div>
  );
}

function Login({ onDone }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const brand = useGymName();

  const go = async () => {
    if (!email.trim() || !password) { setErr("Συμπλήρωσε email και κωδικό"); return; }
    setBusy(true);
    const r = await signIn(email.trim(), password);
    setBusy(false);
    if (!r.ok) { setErr(r.error); return; }
    onDone();
  };

  return (
    <div className="mx-auto flex min-h-screen max-w-sm flex-col justify-center px-6">
      <div className="f-display text-[12px] font-bold uppercase tracking-[0.18em] text-neutral-400">{brand}</div>
      <h1 className="f-display mt-2 text-[34px] font-extrabold uppercase leading-none tracking-tight">Διαχείριση</h1>
      <div className="mt-8 space-y-2">
        <input value={email} onChange={(e) => { setEmail(e.target.value); setErr(""); }}
          type="email" placeholder="Email" autoComplete="username"
          className="f-text h-12 w-full border-2 border-black px-4 text-[15px] outline-none" />
        <input value={password} onChange={(e) => { setPassword(e.target.value); setErr(""); }}
          type="password" placeholder="Κωδικός" autoComplete="current-password"
          onKeyDown={(e) => { if (e.key === "Enter") go(); }}
          className="f-text h-12 w-full border-2 border-black px-4 text-[15px] outline-none" />
      </div>
      <Button className="mt-3 w-full" disabled={busy} onClick={go}>{busy ? "Σύνδεση…" : "Σύνδεση"}</Button>
      {err && <div className="f-text mt-3 text-[13px] text-neutral-600">{err}</div>}
    </div>
  );
}

/* ---------- Schedule ---------- */
function Schedule({ flash, onAuthFail, refreshKey, newItems, focus, onSeen, seenDays, onDaySeen }) {
  const todayISO = iso(new Date());
  const [date, setDate] = useState(todayISO);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [open, setOpen] = useState(null);
  const [detail, setDetail] = useState(null);

  /* Ποιες μέρες, ώρες και κρατήσεις είναι καινούριες — για τις
     κόκκινες βούλες. Η μέρα κρατάει αριθμό, όχι ναι/όχι: αν πατήσεις
     τη μέρα και έρθει μετά κι άλλη κράτηση, η βούλα ξαναβγαίνει. */
  const fresh = useMemo(() => {
    const ids = new Set(), byDate = new Map(), byKey = new Set();
    (newItems || []).forEach((b) => {
      if (b.kind === "cancelled") return;
      ids.add(b.id);
      byDate.set(b.date, (byDate.get(b.date) || 0) + 1);
      byKey.add(b.date + " " + b.time);
    });
    return { ids: ids, byDate: byDate, byKey: byKey };
  }, [newItems]);

  /* Πόσες καινούριες είχε η κάθε μέρα την ώρα που την πάτησες. Ο
     μετρητής έρχεται από το κέλυφος και γράφεται στη συσκευή, ώστε η
     βούλα να μην ξαναβγαίνει μετά από ανανέωση της σελίδας. */
  const seen = seenDays || {};
  const dayHasDot = (dd0) => (fresh.byDate.get(dd0) || 0) > (seen[dd0] || 0);
  const markDay = (dd0) => { if (onDaySeen) onDaySeen(dd0, fresh.byDate.get(dd0) || 0); };
  const pickDay = (dd0) => { setDate(dd0); markDay(dd0); };

  /* Η μέρα που είναι ήδη ανοιχτή μετράει ως ιδωμένη: αν έρθει
     καινούρια κράτηση όσο την κοιτάς, η βούλα δεν έχει νόημα. Ισχύει
     και για την πρώτη φόρτωση, που ανοίγει στο σήμερα χωρίς πάτημα. */
  useEffect(() => { markDay(date); }, [date, fresh]);

  /* Πάτημα σε ειδοποίηση: άνοιγμα της σωστής μέρας και ώρας. */
  useEffect(() => {
    if (!focus || !focus.date) return;
    setDate(focus.date);
    setOpen(focus.time || null);
  }, [focus]);

  /* Μία μέρα πίσω, για να βλέπει τι έγινε χθες. Μπροστά όσες μέρες
     ανοίγει το πρόγραμμα στον πελάτη — ό,τι λένε οι ρυθμίσεις. */
  const days = useMemo(() => {
    const base = new Date(); base.setHours(0, 0, 0, 0);
    return Array.from({ length: MAX_DAYS_AHEAD + 2 }, (_, i) => iso(addDays(base, i - 1)));
  }, []);

  const load = useCallback(async () => {
    setLoading(true);
    const { data: d, error } = await rpc("admin_day", { p_date: date });
    setLoading(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { flash("Δεν φόρτωσε το πρόγραμμα"); return; }
    setData(d);
  }, [date, flash, onAuthFail, refreshKey]);

  useEffect(() => { load(); }, [load]);

  const setStatus = async (bookingId, status) => {
    const { data: d, error } = await rpc("admin_set_status", { p_booking_id: bookingId, p_status: status });
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !d?.ok) { flash("Κάτι πήγε στραβά"); return; }
    load();
  };

  const slots = data?.slots || [];
  const allPeople = slots.flatMap((s) =>
    (s.people || []).map((p) => ({ ...p, time: s.slot_time })));
  const total = allPeople.length;
  const checkins = allPeople.filter((p) => p.status === "checked_in").length;
  const totalCap = slots.reduce((sum, s) => sum + s.capacity, 0);
  const fill = totalCap ? Math.round((total / totalCap) * 100) : 0;
  const cancelledPeople = data?.cancelled_people || [];

  /* Στη λίστα εμφανίζονται μόνο οι ώρες που έχουν τουλάχιστον μία
     κράτηση. Τα σύνολα πιο πάνω υπολογίζονται από όλες τις ώρες. */
  const bookedSlots = slots.filter((s) => (s.people || []).length > 0);

  const openDetail = (key) => setDetail(detail === key ? null : key);

  /* Η βούλα σβήνει όταν φύγεις από την ώρα που μόλις κοίταξες. */
  const clearSlot = (time) => {
    if (!time || !onSeen) return;
    const slot = slots.find((x) => x.slot_time === time);
    const ids = ((slot && slot.people) || [])
      .map((p) => p.booking_id).filter((id) => fresh.ids.has(id));
    if (ids.length) onSeen(ids);
  };

  const toggleSlot = (time) => {
    const wasOpen = open;
    setOpen(wasOpen === time ? null : time);
    if (wasOpen) clearSlot(wasOpen);
  };

  const detailData = () => {
    if (detail === "bookings") {
      return { title: "Όλες οι κρατήσεις", rows: allPeople };
    }
    if (detail === "checkins") {
      return { title: "Έκαναν check-in", rows: allPeople.filter((p) => p.status === "checked_in") };
    }
    if (detail === "cancelled") {
      return { title: "Ακύρωσαν", rows: cancelledPeople };
    }
    if (detail === "fill") {
      return {
        title: "Πληρότητα ανά ώρα",
        hours: slots.map((s) => ({
          time: s.slot_time,
          taken: (s.people || []).length,
          capacity: s.capacity,
        })),
      };
    }
    return null;
  };
  const d = detailData();

  return (
    <div>
      <div className="flex gap-2 overflow-x-auto px-5 pb-2 pt-6 sm:px-6">
        {days.map((dd0) => {
          const dd = parseISO(dd0), on = dd0 === date, isToday = dd0 === todayISO;
          return (
            <button key={dd0} onClick={() => pickDay(dd0)}
              className={`relative flex h-[62px] w-[56px] shrink-0 flex-col items-center justify-center border-2 ${
                on ? "border-black bg-black text-white" : "border-neutral-300 bg-white text-neutral-700 hover:border-black"}`}>
              <span className="f-text text-[10px] uppercase text-neutral-400">{DAYS[dd.getDay()]}</span>
              <span className="f-mono mt-1 text-[16px] leading-none">{dd.getDate()}</span>
              {isToday && <span className={`absolute bottom-1.5 h-[3px] w-[3px] rounded-full ${on ? "bg-white" : "bg-black"}`} />}
              {dayHasDot(dd0) && <Dot className="absolute right-[3px] top-[3px]" />}
            </button>
          );
        })}
      </div>

      <div className="flex items-center justify-between gap-3 px-5 pt-4 sm:px-6">
        <h2 className="f-display text-[24px] font-extrabold uppercase tracking-tight">{fmtDayLong(date)}</h2>
        {date !== todayISO && <Button variant="ghost" size="sm" onClick={() => setDate(todayISO)}>Σήμερα</Button>}
      </div>

      <div className="mt-5 grid grid-cols-2 gap-3 px-5 sm:grid-cols-4 sm:gap-4 sm:px-6">
        <Kpi label="Κρατήσεις" value={total} onClick={() => openDetail("bookings")} />
        <Kpi label="Check-ins" value={checkins} onClick={() => openDetail("checkins")} />
        <Kpi label="Ακυρώσεις" value={data?.cancelled ?? 0} onClick={() => openDetail("cancelled")} />
        <Kpi label="Πληρότητα" value={`${fill}%`} note={`${total}/${totalCap}`} onClick={() => openDetail("fill")} />
      </div>

      {d && (
        <div className="mx-5 mt-4 border-2 border-black sm:mx-6">
          <div className="flex items-center justify-between border-b-2 border-black px-4 py-3">
            <span className="f-display text-[14px] font-bold uppercase tracking-wide">{d.title}</span>
            <button onClick={() => setDetail(null)} className="f-display text-[18px] leading-none text-neutral-400">×</button>
          </div>

          {d.hours ? (
            <div className="divide-y divide-neutral-200">
              {d.hours.map((h) => (
                <div key={h.time} className="flex items-center justify-between px-4 py-2.5">
                  <span className="f-mono text-[15px]">{h.time}</span>
                  <span className="f-mono text-[13px] text-neutral-600">{h.taken}/{h.capacity}</span>
                </div>
              ))}
            </div>
          ) : d.rows.length === 0 ? (
            <div className="f-text px-4 py-6 text-center text-[14px] text-neutral-400">Κανένας.</div>
          ) : (
            <div className="divide-y divide-neutral-200">
              {d.rows.map((p, i) => (
                <div key={i} className="flex flex-wrap items-center justify-between gap-2 px-4 py-3">
                  <div className="min-w-0">
                    <div className="f-text text-[15px]">{p.name}</div>
                    <div className="f-mono text-[12px] text-neutral-500">{p.phone}</div>
                  </div>
                  <span className="f-mono shrink-0 text-[13px] text-neutral-600">{p.time}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <h3 className="f-display mt-9 px-5 text-[14px] sm:px-6 font-bold uppercase tracking-wide text-neutral-500">Κρατήσεις ανά ώρα</h3>

      {loading ? (
        <div className="f-text px-5 py-10 text-[14px] text-neutral-400 sm:px-6">Φόρτωση…</div>
      ) : bookedSlots.length === 0 ? (
        <div className="f-text mx-5 mt-3 border-2 border-dashed border-neutral-300 py-12 text-center text-[14px] text-neutral-500 sm:mx-6">
          Καμία κράτηση αυτή την ημέρα.
        </div>
      ) : (
        <div className="mt-3 divide-y divide-neutral-300 border-y-2 border-black">
          {bookedSlots.map((s) => {
            const people = s.people || [];
            const present = people.filter((p) => p.status === "checked_in").length;
            const expanded = open === s.slot_time;
            return (
              <div key={s.slot_time}>
                <button onClick={() => toggleSlot(s.slot_time)}
                  className="w-full px-5 py-4 text-left hover:bg-neutral-50 sm:px-6">
                  <div className="flex items-center justify-between gap-4">
                    <span className="flex items-center gap-2">
                      <span className="f-mono text-[20px] leading-none tracking-tight">{s.slot_time}</span>
                      {fresh.byKey.has(date + " " + s.slot_time) && <Dot />}
                    </span>
                    <div className="flex items-center gap-4">
                      <span className="f-mono text-[13px] text-neutral-600">{people.length}/{s.capacity}</span>
                      <span className="f-text text-[13px] text-neutral-500">{present} παρόντες</span>
                      <span className="f-display text-neutral-400">{expanded ? "−" : "+"}</span>
                    </div>
                  </div>
                  <div className="mt-3"><SeatMeter taken={people.length} cap={s.capacity} /></div>
                </button>

                {expanded && (
                  <div className="border-t border-neutral-300 bg-neutral-50 px-5 pb-4 sm:px-6">
                    {people.length === 0 ? (
                      <div className="f-text py-4 text-[13px] text-neutral-400">Καμία κράτηση.</div>
                    ) : (
                      <div className="divide-y divide-neutral-200">
                        {people.map((p) => (
                          <div key={p.booking_id} className="flex items-center justify-between gap-3 py-3">
                            <div className="min-w-0">
                              <div className="flex items-center gap-2">
                                {fresh.ids.has(p.booking_id) && <Dot />}
                                <span className="f-text truncate text-[15px]">{p.name}</span>
                              </div>
                              <div className="f-mono text-[12px] text-neutral-500">{p.phone}</div>
                            </div>
                            <div className="flex shrink-0 gap-2">
                              <Button size="sm" variant={p.status === "checked_in" ? "outline" : "primary"}
                                onClick={() => setStatus(p.booking_id, p.status === "checked_in" ? "booked" : "checked_in")}>
                                {p.status === "checked_in" ? "Αναίρεση" : "Check-in"}
                              </Button>
                              <Button size="sm" variant="ghost" onClick={() => setStatus(p.booking_id, "cancelled")}>Ακύρωση</Button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                    {(s.waiting || []).length > 0 && (
                      <div className="f-text mt-3 border-t border-neutral-300 pt-3 text-[13px] text-neutral-500">
                        Λίστα αναμονής: {s.waiting.join(", ")}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
      <div className="h-10" />
    </div>
  );
}

/* ---------- Hours ---------- */
function Hours({ flash, onAuthFail }) {
  const [scope, setScope] = useState("date");
  const [date, setDate] = useState(iso(new Date()));
  const [weekday, setWeekday] = useState(new Date().getDay());
  const [slots, setSlots] = useState([]);
  const [loading, setLoading] = useState(true);

  /* Ίδιο παράθυρο με το Πρόγραμμα: όσες μέρες μπροστά ανοίγουν οι
     κρατήσεις. Πίσω δεν έχει νόημα — δεν αλλάζεις θέσεις σε μέρα
     που πέρασε. */
  const days = useMemo(() => {
    const base = new Date(); base.setHours(0, 0, 0, 0);
    return Array.from({ length: MAX_DAYS_AHEAD + 1 }, (_, i) => iso(addDays(base, i)));
  }, []);

  // For weekday scope we preview using the next matching date.
  const previewDate = useMemo(() => {
    if (scope === "date") return date;
    const base = new Date(); base.setHours(0, 0, 0, 0);
    for (let i = 0; i < 7; i++) {
      const d = addDays(base, i);
      if (d.getDay() === weekday) return iso(d);
    }
    return iso(base);
  }, [scope, date, weekday]);

  /* Στο "Κάθε εβδομάδα" ζητάμε τον ίδιο τον εβδομαδιαίο κανόνα, όχι
     την ενεργή τιμή της ημέρας. Αλλιώς, αν υπήρχε ρύθμιση για
     συγκεκριμένη ημερομηνία, αποθήκευες και δεν άλλαζε τίποτα στην
     οθόνη — φαινόταν σαν να μην έπιασε. */
  const load = useCallback(async () => {
    setLoading(true);
    const { data, error } = await rpc("admin_hours", {
      p_date: previewDate,
      p_scope: scope,
      p_weekday: scope === "weekday" ? weekday : null,
    });
    setLoading(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { flash("Ώρες: " + String(error).slice(0, 120)); return; }
    setSlots(data || []);
  }, [previewDate, scope, weekday, flash, onAuthFail]);

  useEffect(() => { load(); }, [load]);

  const save = async (time, capacity) => {
    const { data, error } = await rpc("admin_set_capacity", {
      p_scope: scope,
      p_date: scope === "date" ? date : null,
      p_weekday: scope === "weekday" ? weekday : null,
      p_time: time,
      p_capacity: capacity,
    });
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data?.ok) { flash("Δεν αποθηκεύτηκε"); return; }
    flash("Αποθηκεύτηκε");
    load();
  };

  return (
    <div className="px-5 sm:px-6">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Χωρητικότητα ανά ώρα</h2>
      <p className="f-text mt-1 text-[13px] text-neutral-500">
        Όρισε πόσα άτομα χωράει κάθε ώρα. Οι αλλαγές ισχύουν αμέσως.
      </p>

      <div className="mt-5 flex border-2 border-black">
        <button onClick={() => setScope("date")}
          className={`f-display flex-1 border-r-2 border-black py-3 text-[13px] font-bold uppercase ${scope === "date" ? "bg-black text-white" : "bg-white"}`}>
          Συγκεκριμένη ημέρα
        </button>
        <button onClick={() => setScope("weekday")}
          className={`f-display flex-1 py-3 text-[13px] font-bold uppercase ${scope === "weekday" ? "bg-black text-white" : "bg-white"}`}>
          Κάθε εβδομάδα
        </button>
      </div>

      {scope === "date" ? (
        <div className="mt-4 flex gap-2 overflow-x-auto pb-2">
          {days.map((d) => {
            const dd = parseISO(d), on = d === date;
            return (
              <button key={d} onClick={() => setDate(d)}
                className={`flex h-[56px] w-[50px] shrink-0 flex-col items-center justify-center border-2 ${
                  on ? "border-black bg-black text-white" : "border-neutral-300 hover:border-black"}`}>
                <span className="f-text text-[10px] uppercase text-neutral-400">{DAYS[dd.getDay()]}</span>
                <span className="f-mono mt-1 text-[15px] leading-none">{dd.getDate()}</span>
              </button>
            );
          })}
        </div>
      ) : (
        <div className="mt-4 flex flex-wrap gap-2">
          {DAYS.map((label, i) => (
            <button key={i} onClick={() => setWeekday(i)}
              className={`f-display border-2 px-4 py-2.5 text-[13px] font-bold uppercase ${
                weekday === i ? "border-black bg-black text-white" : "border-neutral-300 hover:border-black"}`}>
              {label}
            </button>
          ))}
        </div>
      )}

      {loading ? (
        <div className="f-text py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : (
        <div className="mt-6 divide-y divide-neutral-200 border-y-2 border-black">
          {slots.map((s) => (
            <HourRow key={s.slot_time} slot={s} scope={scope} onSave={save} />
          ))}
        </div>
      )}
      <div className="h-10" />
    </div>
  );
}

function HourRow({ slot, scope, onSave }) {
  const [val, setVal] = useState(slot.capacity);
  useEffect(() => { setVal(slot.capacity); }, [slot.capacity, slot.slot_time]);
  const dirty = val !== slot.capacity;
  const closed = slot.capacity === 0;

  return (
    <div className={`flex flex-wrap items-center justify-between gap-3 py-3 ${closed ? "opacity-60" : ""}`}>
      <div>
        <span className="f-mono block text-[17px] leading-none">{slot.slot_time}</span>
        <span className="f-text text-[12px] text-neutral-400">
          {closed ? "Κλειστή — δεν φαίνεται στους πελάτες" : `${slot.taken} κρατήσεις`}
        </span>
        {slot.shadowed && (
          <span className="f-text mt-0.5 block text-[12px] text-neutral-500">
            Την ημέρα της προεπισκόπησης ισχύει ξεχωριστή ρύθμιση, όχι αυτή.
          </span>
        )}
      </div>
      <div className="flex items-center gap-3">
        <Stepper value={val} min={scope === "weekday" ? 0 : slot.taken} max={80} onChange={setVal} />
        <Button size="sm" disabled={!dirty} onClick={() => onSave(slot.slot_time, val)}>Αποθήκευση</Button>
      </div>
    </div>
  );
}

/* ---------- People ---------- */
function People({ flash, onAuthFail }) {
  const [q, setQ] = useState("");
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [sel, setSel] = useState(null);
  const [history, setHistory] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [pinOpen, setPinOpen] = useState(false);
  const [pinValue, setPinValue] = useState("");
  const [pinBusy, setPinBusy] = useState(false);
  const [newPin, setNewPin] = useState("");
  const [editOpen, setEditOpen] = useState(false);
  const [form, setForm] = useState({ first_name: "", last_name: "", phone: "", email: "" });
  const [saving, setSaving] = useState(false);

  const load = useCallback(async () => {
    setLoading(true);
    const { data, error } = await rpc("admin_clients", { p_search: q });
    setLoading(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { flash("Δεν φόρτωσαν οι πελάτες"); return; }
    setRows(data || []);
  }, [q, flash, onAuthFail]);

  useEffect(() => { const t = setTimeout(load, 250); return () => clearTimeout(t); }, [load]);

  const openClient = async (row) => {
    setSel(row); setHistory(null); setConfirmDelete(false);
    setPinOpen(false); setPinValue(""); setNewPin("");

        <Kpi label="Δεν ήρθαν" value={t.noshows ?? 0} />
        <Kpi label="Ακυρώσεις" value={t.cancels ?? 0} />
      </div>

      <h3 className="f-display mt-10 text-[14px] font-bold uppercase tracking-wide text-neutral-500">Κρατήσεις ανά ημέρα</h3>

      <div className="mt-4"><Bars items={perHour} /></div>

      <h3 className="f-display mt-10 text-[14px] font-bold uppercase tracking-wide text-neutral-500">Ώρες με τη μεγαλύτερη ζήτηση</h3>
      <div className="mt-3 divide-y divide-neutral-300 border-y-2 border-black">
        {top.map((x) => (
          <div key={x.label} className="flex items-center justify-between py-3 text-[15px]">
            <span className="f-mono">{x.label}</span>

          </div>
        ))}
      </div>
      <div className="h-10" />
    </div>
  );
}

/* ---------- QR (self-contained encoder) ---------- */
const EXP = new Array(512), LOG = new Array(256);
(() => { let x = 1; for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; } for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255]; })();
const gmul = (a, b) => (a === 0 || b === 0 ? 0 : EXP[LOG[a] + LOG[b]]);
function rsGen(n) { let g = [1]; for (let i = 0; i < n; i++) { const next = new Array(g.length + 1).fill(0); for (let j = 0; j < g.length; j++) { next[j] ^= g[j]; next[j + 1] ^= gmul(g[j], EXP[i]); } g = next; } return g; }
function rsEncode(data, ecLen) { const g = rsGen(ecLen); const res = new Array(ecLen).fill(0); for (const d of data) { const f = d ^ res[0]; res.shift(); res.push(0); for (let i = 0; i < ecLen; i++) res[i] ^= gmul(g[i + 1], f); } return res; }
const QR_CAP = { 1: [19, 7], 2: [34, 10], 3: [55, 15], 4: [80, 20], 5: [108, 26] };
const QR_MASKS = [(i,j)=>(i+j)%2===0,(i)=>i%2===0,(i,j)=>j%3===0,(i,j)=>(i+j)%3===0,(i,j)=>(Math.floor(i/2)+Math.floor(j/3))%2===0,(i,j)=>((i*j)%2)+((i*j)%3)===0,(i,j)=>(((i*j)%2)+((i*j)%3))%2===0,(i,j)=>(((i+j)%2)+((i*j)%3))%2===0];
function qrReserved(size, version) { const r = Array.from({ length: size }, () => new Array(size).fill(false)); const block = (row, col, h, w) => { for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) { const y = row + i, x = col + j; if (y >= 0 && y < size && x >= 0 && x < size) r[y][x] = true; } }; block(0,0,9,9); block(0,size-8,9,8); block(size-8,0,8,9); for (let i = 0; i < size; i++) { r[6][i] = true; r[i][6] = true; } if (version >= 2) block(size-9,size-9,5,5); return r; }
function qrBase(size, version) { const m = Array.from({ length: size }, () => new Array(size).fill(0)); const finder = (row, col) => { for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++) { const y = row+i, x = col+j; if (y<0||y>=size||x<0||x>=size) continue; const edge = (i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6)); const core = i>=2&&i<=4&&j>=2&&j<=4; m[y][x] = edge||core ? 1 : 0; } }; finder(0,0); finder(0,size-7); finder(size-7,0); for (let i = 8; i < size-8; i++) { const v = i%2===0?1:0; m[6][i]=v; m[i][6]=v; } if (version>=2) { const c=size-7; for (let i=-2;i<=2;i++) for (let j=-2;j<=2;j++) m[c+i][c+j]=Math.max(Math.abs(i),Math.abs(j))===1?0:1; } m[size-8][8]=1; return m; }
function qrDataPositions(size, res) { const pos=[]; let up=true; for (let right=size-1; right>=1; right-=2) { const col=right<=6?right-1:right; for (let n=0;n<size;n++) { const row=up?size-1-n:n; for (const c of [col,col-1]) if (!res[row][c]) pos.push([row,c]); } up=!up; } return pos; }
function qrFormat(m, size, mask) { const fmt=(0b01<<3)|mask; let rem=fmt<<10; for (let i=14;i>=10;i--) if ((rem>>i)&1) rem^=0x537<<(i-10); const bits=((fmt<<10)|(rem&0x3ff))^0x5412; const bit=(i)=>(bits>>(14-i))&1; for (let i=0;i<=5;i++) m[8][i]=bit(i); m[8][7]=bit(6); m[8][8]=bit(7); m[7][8]=bit(8); for (let i=9;i<=14;i++) m[14-i][8]=bit(i); for (let i=0;i<=6;i++) m[size-1-i][8]=bit(i); for (let i=7;i<=14;i++) m[8][size-15+i]=bit(i); m[size-8][8]=1; }
function qrPenalty(m, size) { let p=0; for (let dir=0;dir<2;dir++) for (let a=0;a<size;a++) { let run=1, prev=-1; for (let b=0;b<size;b++) { const v=dir===0?m[a][b]:m[b][a]; if (v===prev) run++; else { if (run>=5) p+=run-2; run=1; prev=v; } } if (run>=5) p+=run-2; } for (let i=0;i<size-1;i++) for (let j=0;j<size-1;j++) { const v=m[i][j]; if (v===m[i][j+1]&&v===m[i+1][j]&&v===m[i+1][j+1]) p+=3; } let dark=0; for (let i=0;i<size;i++) for (let j=0;j<size;j++) dark+=m[i][j]; p+=10*Math.floor(Math.abs((dark*100)/(size*size)-50)/5); return p; }
function qrEncode(text) {
  const bytes = Array.from(new TextEncoder().encode(text));
  let version = null;
  for (let v = 1; v <= 5; v++) if (bytes.length + 2 <= QR_CAP[v][0]) { version = v; break; }
  if (!version) return null;
  const size = 17 + 4 * version;
  const [dataLen, ecLen] = QR_CAP[version];
  const bitArr = [];
  const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bitArr.push((val >> i) & 1); };
  push(0b0100, 4); push(bytes.length, 8);
  for (const b of bytes) push(b, 8);
  for (let i = 0; i < 4 && bitArr.length < dataLen * 8; i++) bitArr.push(0);
  while (bitArr.length % 8 !== 0) bitArr.push(0);
  const data = [];
  for (let i = 0; i < bitArr.length; i += 8) { let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bitArr[i + j]; data.push(v); }
  const pads = [0xec, 0x11]; let k = 0;
  while (data.length < dataLen) data.push(pads[k++ % 2]);
  const cws = data.concat(rsEncode(data, ecLen));
  const res = qrReserved(size, version);
  const pos = qrDataPositions(size, res);
  const bits = [];
  for (const cw of cws) for (let i = 7; i >= 0; i--) bits.push((cw >> i) & 1);
  let best = null;
  for (let mask = 0; mask < 8; mask++) {
    const m = qrBase(size, version);
    pos.forEach(([r, c], idx) => { const b = idx < bits.length ? bits[idx] : 0; m[r][c] = QR_MASKS[mask](r, c) ? b ^ 1 : b; });
    qrFormat(m, size, mask);
    const score = qrPenalty(m, size);
    if (!best || score < best.score) best = { score, m };
  }
  return best.m;
}

function QRCode({ text, size = 190 }) {
  const modules = useMemo(() => qrEncode(text), [text]);
  if (!modules) return <div className="f-text text-sm text-neutral-500">Ο σύνδεσμος είναι πολύ μεγάλος για QR.</div>;
  const n = modules.length, q = 4, total = n + 2 * q;
  let d = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (modules[y][x]) d += `M${x + q} ${y + q}h1v1h-1z`;
  return (
    <svg viewBox={`0 0 ${total} ${total}`} width={size} height={size} shapeRendering="crispEdges" className="block">
      <rect width={total} height={total} fill="#FFFFFF" />
      <path d={d} fill="#000000" />
    </svg>
  );
}

/* SVG για CAD / 3D εκτύπωση.
   Τρεις διαφορές από το QR της οθόνης:
   - Τα γειτονικά τετράγωνα ενώνονται σε μεγαλύτερα ορθογώνια, ώστε να
     μη φορτώνει το Fusion με χιλιάδες γραμμές.
   - Οι συντεταγμένες βγαίνουν σε px στα 96dpi, όσα χρειάζονται για να
     πέσει το σχέδιο ακριβώς στα mm που ζητάμε. Το Fusion αγνοεί τις
     μονάδες του SVG και μετράει πάντα με 96dpi, οπότε έτσι μπαίνει
     σωστό χωρίς να το ξανακλιμακώνεις.
   - Δεν μπαίνει άσπρο φόντο, μόνο τα μαύρα τετράγωνα και το εξωτερικό
     περίγραμμα της πλάκας. */
function qrSvgForCad(text, mm) {
  const modules = qrEncode(text);
  if (!modules) return null;
  const n = modules.length, q = 4, total = n + 2 * q;

  /* Πρώτα οριζόντιες σειρές από συνεχόμενα μαύρα, μετά ένωση προς τα κάτω
     όταν η σειρά από πάνω πιάνει ακριβώς τις ίδιες στήλες. */
  const rects = [];
  const open = new Map();
  for (let y = 0; y < n; y++) {
    let x = 0;
    while (x < n) {
      if (!modules[y][x]) { x++; continue; }
      let x2 = x;
      while (x2 + 1 < n && modules[y][x2 + 1]) x2++;
      const key = x + ":" + x2;
      const prev = open.get(key);
      if (prev && prev.y + prev.h === y) prev.h++;
      else { const r = { x, y, w: x2 - x + 1, h: 1 }; rects.push(r); open.set(key, r); }
      x = x2 + 1;
    }
  }

  const px = (mm / total) * (96 / 25.4);
  const f = (v) => +(v * px).toFixed(4);
  let d = "";
  for (const r of rects) {
    const x1 = f(r.x + q), y1 = f(r.y + q), x2 = f(r.x + q + r.w), y2 = f(r.y + q + r.h);
    d += `M${x1} ${y1}H${x2}V${y2}H${x1}Z`;
  }
  const side = f(total);
  const label = String(text).replace(/[<>&]/g, "").replace(/-+/g, "-");
  return `<?xml version="1.0" encoding="UTF-8"?>
<!-- ${label} | ${mm} mm x ${mm} mm | 1 module = ${(mm / total).toFixed(3)} mm -->
<svg xmlns="http://www.w3.org/2000/svg" width="${mm}mm" height="${mm}mm" viewBox="0 0 ${side} ${side}">
  <path d="${d}" fill="#000000"/>
  <rect x="0" y="0" width="${side}" height="${side}" fill="none" stroke="#000000" stroke-width="0.2"/>
</svg>
`;
}

function downloadFile(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* Η διεύθυνση της εφαρμογής πελατών είναι αυτή εδώ η σελίδα, με
   index.html στη θέση του admin.html. Τη γεμίζουμε μόνοι μας αντί να
   περιμένουμε να τη γράψει κάποιος — έμενε κενή και τα QR έβγαιναν
   με άδειο σύνδεσμο. */
function guessAppUrl() {
  try {
    const u = new URL(window.location.href);
    u.hash = ""; u.search = "";
    u.pathname = u.pathname.replace(/[^/]*$/, "index.html");
    return u.href;
  } catch (e) { return ""; }
}

function Access({ flash, onAuthFail }) {
  const [url, setUrl] = useState("");
  const [loading, setLoading] = useState(true);
  const [guessed, setGuessed] = useState(false);
  const [mm, setMm] = useState("40");

  useEffect(() => {
    (async () => {
      const { data, error } = await rpc("admin_get_settings", {});
      setLoading(false);
      if (error === "AUTH") { onAuthFail(); return; }
      if (error || !data) return;
      const saved = (data.site_url || "").trim();
      if (saved) { setUrl(saved); return; }
      setUrl(guessAppUrl());
      setGuessed(true);
    })();
  }, [onAuthFail]);

  const save = async () => {
    const clean = url.trim();
    if (!clean) { flash("Γράψε πρώτα τη διεύθυνση"); return; }
    const { data, error } = await rpc("admin_update_settings", { p_patch: { site_url: clean } });
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data?.ok) { flash("Δεν αποθηκεύτηκε"); return; }
    setUrl(clean);
    setGuessed(false);
    flash("Αποθηκεύτηκε");
  };

  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); flash("Αντιγράφηκε"); }
    catch (e) { flash("Η αντιγραφή δεν είναι διαθέσιμη"); }
  };

  const saveSvg = (text, name) => {
    const size = Math.min(300, Math.max(10, Number(mm) || 40));
    const svg = qrSvgForCad(text, size);
    if (!svg) { flash("Ο σύνδεσμος είναι πολύ μεγάλος για QR"); return; }
    downloadFile(name, svg, "image/svg+xml");
  };

  if (loading) return <div className="f-text px-5 py-10 text-[14px] text-neutral-400 sm:px-6">Φόρτωση…</div>;
  const checkinUrl = url ? url + (url.includes("?") ? "&" : "?") + "checkin=1" : "";

  return (
    <div className="px-5 sm:px-6">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">QR & NFC στην είσοδο</h2>
      <p className="f-text mt-1 max-w-[52ch] text-[13px] leading-relaxed text-neutral-500">
        Τύπωσε το QR ή γράψε τον σύνδεσμο σε NFC tag. Ο πελάτης το σκανάρει ή ακουμπάει το κινητό
        και ανοίγει η εφαρμογή. Δεν χρειάζεται εγκατάσταση.
      </p>

      <div className="mt-6 max-w-xl">
        <label className="f-text text-[13px] text-neutral-500">Διεύθυνση εφαρμογής πελατών</label>
        <div className="mt-2 flex gap-2">
          <input value={url} onChange={(e) => { setUrl(e.target.value); setGuessed(false); }}
            placeholder="https://…/index.html"
            className="f-mono h-12 flex-1 border-2 border-black px-4 text-[14px] outline-none" />
          <Button onClick={save}>Αποθήκευση</Button>
        </div>
        {guessed && (
          <p className="f-text mt-2 text-[12px] leading-relaxed text-neutral-500">
            Συμπληρώθηκε από τη διεύθυνση αυτής της σελίδας. Δες αν είναι σωστή
            και πάτα Αποθήκευση.
          </p>
        )}
      </div>

      {url ? (
        <>
        <div className="mt-8 grid max-w-3xl gap-6 sm:grid-cols-2">
          <div className="border-2 border-black p-5">
            <div className="f-display text-[14px] font-bold uppercase tracking-wide">Άνοιγμα εφαρμογής</div>
            <div className="f-mono mt-1 break-all text-[12px] text-neutral-500">{url}</div>
            <div className="mt-4 flex justify-center border-2 border-black p-3"><QRCode text={url} size={170} /></div>
            <div className="mt-4 grid grid-cols-2 gap-2">
              <Button variant="outline" size="sm" onClick={() => copy(url)}>Αντιγραφή</Button>
              <Button variant="outline" size="sm" onClick={() => saveSvg(url, "qr-app.svg")}>SVG</Button>
            </div>
          </div>
          <div className="border-2 border-black p-5">
            <div className="f-display text-[14px] font-bold uppercase tracking-wide">Check-in στην είσοδο</div>
            <div className="f-mono mt-1 break-all text-[12px] text-neutral-500">{checkinUrl}</div>
            <div className="mt-4 flex justify-center border-2 border-black p-3"><QRCode text={checkinUrl} size={170} /></div>
            <div className="mt-4 grid grid-cols-2 gap-2">
              <Button variant="outline" size="sm" onClick={() => copy(checkinUrl)}>Αντιγραφή</Button>
              <Button variant="outline" size="sm" onClick={() => saveSvg(checkinUrl, "qr-checkin.svg")}>SVG</Button>
            </div>
          </div>
        </div>

        <div className="mt-6 max-w-3xl border-2 border-black p-5">
          <div className="f-display text-[14px] font-bold uppercase tracking-wide">SVG για 3D εκτύπωση</div>
          <div className="mt-3 flex items-center gap-3">
            <label className="f-text text-[13px] text-neutral-500">Πλευρά πλάκας</label>
            <input value={mm} onChange={(e) => setMm(e.target.value)} inputMode="decimal"
              className="f-mono h-9 w-20 border-2 border-black px-2 text-[13px] outline-none" />
            <span className="f-text text-[13px] text-neutral-500">mm</span>
          </div>
          <p className="f-text mt-3 max-w-[52ch] text-[13px] leading-relaxed text-neutral-500">
            Το SVG βγαίνει στο μέγεθος που γράφεις εδώ, οπότε στο Fusion μπαίνει με
            Insert SVG και δεν θέλει ξανά κλιμάκωση. Μέσα έχει τα μαύρα τετράγωνα και
            το περίγραμμα της πλάκας — στο Extrude διάλεξε τα τετράγωνα και ξεδιάλεξε
            τη γύρω περιοχή.
          </p>
        </div>
        </>
      ) : (
        <p className="f-text mt-8 text-[14px] text-neutral-500">
          Συμπλήρωσε τη διεύθυνση πιο πάνω και πάτα Αποθήκευση για να δημιουργηθούν τα QR.
        </p>
      )}

      <div className="mt-9 max-w-xl border-t-2 border-black pt-6">
        <h3 className="f-display text-[14px] font-bold uppercase tracking-wide">NFC tag</h3>
        <ol className="f-text mt-3 space-y-2 text-[13px] leading-relaxed text-neutral-600">
          <li>1. Πάρε NTAG213 ή NTAG215 sticker.</li>
          <li>2. Γράψε πάνω του NDEF record τύπου URL με τον σύνδεσμο check-in.</li>
          <li>3. Κόλλησέ το στην είσοδο, δίπλα στο τυπωμένο QR.</li>
        </ol>
      </div>
      <div className="h-10" />
    </div>
  );
}

/* Άδεια ειδοποιήσεων για αυτή τη συσκευή. Οι ειδοποιήσεις έρχονται
   όσο η σελίδα διαχείρισης είναι ανοιχτή. */
/* ---------- Καθάρισμα ιστορικού ----------
   Οι περασμένες κρατήσεις και οι ακυρώσεις μένουν στη βάση για πάντα.
   Δεν είναι βάρος στα πρώτα χρόνια — μερικές δεκάδες kB — αλλά κάποια
   στιγμή θέλει σκούπα. Εδώ φαίνεται πόσο πιάνουν και σβήνονται όσα
   είναι παλιότερα από το διάστημα που θα διαλέξεις. */
function CleanupPanel({ flash, onAuthFail }) {
  const [info, setInfo] = useState(null);
  const [months, setMonths] = useState(12);
  const [confirm, setConfirm] = useState(false);
  const [busy, setBusy] = useState(false);
  const [open, setOpen] = useState(false);

  const load = useCallback(async () => {
    const { data, error } = await rpc("admin_storage", {});
    if (error === "AUTH") { onAuthFail(); return; }
    if (error) { setInfo(false); return; }
    setInfo(data);
  }, [onAuthFail]);

  /* Τα στοιχεία τα ζητάμε μόνο όταν ανοίξει το πάνελ. */
  useEffect(() => { if (open && info === null) load(); }, [open, info, load]);

  const purge = async () => {
    setBusy(true);
    const { data, error } = await rpc("admin_purge_history", { p_months: months });
    setBusy(false);
    setConfirm(false);
    if (error === "AUTH") { onAuthFail(); return; }
    if (error || !data?.ok) { flash(data?.error || "Δεν έγινε το καθάρισμα"); return; }
    const n = (data.bookings || 0) + (data.cancel_log || 0) + (data.notifications || 0) + (data.waitlist || 0);
    flash(n === 0 ? "Δεν υπήρχε τίποτα παλιό να σβηστεί" : "Σβήστηκαν " + n + " εγγραφές");
    load();
  };

  const mb = (b) => (!b ? "0" : (b / 1048576).toFixed(1));
  const fmtDate = (s) => {
    if (!s) return "—";
    const d = parseISO(String(s).slice(0, 10));
    return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  };

  const CHOICES = [
    [12, "Κράτα τον τελευταίο χρόνο"],
    [6, "Κράτα τους τελευταίους 6 μήνες"],
    [3, "Κράτα τους τελευταίους 3 μήνες"],
    [0, "Σβήσε όλα όσα έχουν περάσει"],
  ];
  const chosen = (CHOICES.find((c) => c[0] === months) || CHOICES[0])[1];

  return (
    <div className="mt-7 border-2 border-black p-4">
      <button onClick={() => { setOpen(!open); setConfirm(false); }}
        className="flex w-full items-center justify-between gap-3 text-left">
        <span className="f-display text-[14px] font-bold uppercase tracking-wide">Ιστορικό και χώρος</span>
        <span className={`f-display shrink-0 text-[13px] leading-none transition-transform ${open ? "rotate-180" : ""}`}>▾</span>
      </button>

      {!open ? null : info === null ? (
        <p className="f-text mt-2 text-[13px] text-neutral-400">Φόρτωση…</p>
      ) : info === false ? (
        <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
          Δεν φόρτωσαν τα στοιχεία του ιστορικού.
        </p>
      ) : (
        <>
          <p className="f-text mt-2 max-w-[56ch] text-[13px] leading-relaxed text-neutral-600">
            Κάθε κράτηση και κάθε ακύρωση μένει στη βάση. Χρειάζονται για τα στατιστικά και για
            το ιστορικό του κάθε πελάτη, γι' αυτό δεν σβήνονται μόνες τους.
          </p>

          <div className="mt-4 divide-y divide-neutral-200 border-y-2 border-black">
            <div className="flex items-center justify-between gap-3 py-2.5">
              <span className="f-text text-[14px]">Κρατήσεις</span>
              <span className="f-mono text-[14px]">
                {info.bookings_total} <span className="text-neutral-400">· {info.bookings_past} περασμένες</span>
              </span>
            </div>
            <div className="flex items-center justify-between gap-3 py-2.5">
              <span className="f-text text-[14px]">Ακυρώσεις</span>
              <span className="f-mono text-[14px]">{info.cancel_log}</span>
            </div>
            <div className="flex items-center justify-between gap-3 py-2.5">
              <span className="f-text text-[14px]">Ειδοποιήσεις</span>
              <span className="f-mono text-[14px]">{info.notifications}</span>
            </div>
            <div className="flex items-center justify-between gap-3 py-2.5">
              <span className="f-text text-[14px]">Παλιότερη εγγραφή</span>
              <span className="f-mono text-[14px]">{fmtDate(info.bookings_oldest)}</span>
            </div>
            <div className="flex items-center justify-between gap-3 py-2.5">
              <span className="f-text text-[14px]">Χώρος στη βάση</span>
              <span className="f-mono text-[14px]">{mb(info.db_bytes)} MB</span>
            </div>
          </div>

          <div className="f-display mt-5 text-[12px] font-bold uppercase tracking-wide text-neutral-500">
            Καθάρισμα
          </div>
          <div className="mt-2 space-y-1.5">
            {CHOICES.map(([m, label]) => (
              <button key={m} onClick={() => { setMonths(m); setConfirm(false); }}
                className={`f-text flex w-full items-center gap-3 border-2 px-3 py-2.5 text-left text-[14px] ${
                  months === m ? "border-black bg-black text-white" : "border-neutral-300 hover:border-black"}`}>
                <span className={`h-3 w-3 shrink-0 rounded-full border-2 ${
                  months === m ? "border-white bg-white" : "border-neutral-400"}`} />
                {label}
              </button>
            ))}
          </div>

          {!confirm ? (
            <Button variant="outline" className="mt-4" onClick={() => setConfirm(true)}>
              Καθάρισμα ιστορικού
            </Button>
          ) : (
            <div className="mt-4 border-2 border-red-600 bg-red-50 p-3">
              <div className="f-display text-[12px] font-bold uppercase tracking-wide text-red-700">
                Σίγουρα;
              </div>
              <div className="f-text mt-1 max-w-[52ch] text-[13px] leading-relaxed text-red-800">
                {chosen}. Ό,τι είναι παλιότερο σβήνεται οριστικά — κρατήσεις, ακυρώσεις και
                ειδοποιήσεις. Τα στατιστικά και τα ιστορικά των πελατών θα δείχνουν λιγότερα.
                Οι σημερινές και οι μελλοντικές κρατήσεις δεν πειράζονται ποτέ.
              </div>
              <div className="mt-3 flex flex-wrap gap-2">
                <Button size="sm" disabled={busy} onClick={purge}>
                  {busy ? "…" : "Ναι, σβήσ' τα"}
                </Button>
                <Button variant="ghost" size="sm" disabled={busy} onClick={() => setConfirm(false)}>
                  Άκυρο
                </Button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function NotifyPanel({ flash, watchError }) {
  const supported = typeof Notification !== "undefined";
  const [perm, setPerm] = useState(supported ? Notification.permission : "unsupported");
  const [busy, setBusy] = useState(false);

  const ask = async () => {
    setBusy(true);
    try {
      const p = await Notification.requestPermission();
      setPerm(p);
      flash(p === "granted" ? "Οι ειδοποιήσεις ενεργοποιήθηκαν" : "Δεν δόθηκε άδεια");
    } catch (e) { flash("Κάτι πήγε στραβά"); }
    setBusy(false);
  };

  const test = () => {
    chime(true);
    notify("Νέα κράτηση", "Δοκιμαστική ειδοποίηση. Αν τη βλέπεις, όλα δουλεύουν.", "kinesis-admin-test");
  };

  return (
    <div className="mt-7 border-2 border-black p-4">
      <div className="f-display text-[14px] font-bold uppercase tracking-wide">Ειδοποίηση κρατήσεων &amp; ακυρώσεων</div>

      {perm === "unsupported" ? (
        <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
          Αυτός ο browser δεν υποστηρίζει ειδοποιήσεις.
        </p>
      ) : perm === "denied" ? (
        <p className="f-text mt-2 max-w-[56ch] text-[13px] leading-relaxed text-neutral-600">
          Οι ειδοποιήσεις είναι μπλοκαρισμένες. Άνοιξέ τες από τις ρυθμίσεις του browser για αυτή τη
          σελίδα και ξαναφόρτωσε.
        </p>
      ) : (
        <>
          <p className="f-text mt-2 max-w-[56ch] text-[13px] leading-relaxed text-neutral-600">
            Έρχονται όσο η σελίδα είναι ανοιχτή, ακόμα κι αν δουλεύεις σε άλλη καρτέλα.
          </p>
          <div className="mt-4 flex flex-wrap items-center gap-2">
            <Button variant="outline" size="sm" onClick={test}>Δοκιμαστική ειδοποίηση</Button>
            {perm !== "granted" && (
              <Button size="sm" disabled={busy} onClick={ask}>
                {busy ? "…" : "Ενεργοποίηση"}
              </Button>
            )}
          </div>
        </>
      )}

      {watchError && (
        <div className="mt-4 border-2 border-red-600 bg-red-50 p-3">
          <div className="f-display text-[12px] font-bold uppercase tracking-wide text-red-700">
            Ο έλεγχος νέων κρατήσεων απέτυχε
          </div>
          <div className="f-text mt-1 break-words text-[12px] leading-relaxed text-red-800">{watchError}</div>
          <div className="f-text mt-2 text-[12px] leading-relaxed text-neutral-600">
            Όσο βγάζει αυτό, καμία νέα κράτηση δεν φτάνει στην καμπάνα.
          </div>
        </div>
      )}

    </div>
  );
}
