<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ============================================================

   The anon/publishable key is DESIGNED to be public; it's safe
   to ship inside this file. Never put the service_role key here.
   ============================================================ */
const SUPABASE_URL = "https://qkjceupbxdujgytikxug.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFramNldXBieGR1amd5dGlreHVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDI0NTUsImV4cCI6MjEwNDExODQ1NX0.cSsylfCvbqlvYgoeryf08jEVzvTjZGXli4dl7ZE7_Pc";

/* Calls a database function. Talks straight to the REST endpoint, so
   there's no external client library to break. Returns the same
   { data, error } shape the rest of this file expects. */
async function rpc(fnName, args) {
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fnName, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(args || {}),
    });
    const text = await res.text();
    if (!res.ok) return { data: null, error: text || res.statusText };
    return { data: text ? JSON.parse(text) : null, error: null };
  } catch (e) {
    return { data: null, error: String(e) };
  }
}
const sb = { rpc: (fnName, args) => rpc(fnName, args) };

const GYM_NAME = "Kinesis";
const MAX_DAYS_AHEAD = 14; // must match settings.max_days_ahead in the database
const SESSION_KEY = "kinesis_session";

/* Public half of the push signing key. Safe to ship — it only lets
   the browser verify that pushes come from our server. */
const VAPID_PUBLIC_KEY = "BGK4sPNp--K8eEhGhTyO-t4hrAAEPcIyVAJh1OjpF4rUGoE-bPWAtwyrSsV5IH8Ikunifj7Ki-PhFPd0n5B1kMQ";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = window.atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

function bufToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return window.btoa(s);
}

/* On iPhone, push only works once the app has been added to the Home
   Screen and opened from there — not from a normal Safari tab. */
const isStandalone = () =>
  window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent);
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window;

/* ============================================================
   Dates & small helpers
   ============================================================ */
const DAYS = ["Κυρ", "Δευ", "Τρί", "Τετ", "Πέμ", "Παρ", "Σάβ"];
const DAYS_LONG = ["Κυριακή", "Δευτέρα", "Τρίτη", "Τετάρτη", "Πέμπτη", "Παρασκευή", "Σάββατο"];
const MONTHS = ["Ιαν", "Φεβ", "Μαρ", "Απρ", "Μαΐ", "Ιουν", "Ιουλ", "Αυγ", "Σεπ", "Οκτ", "Νοε", "Δεκ"];
const pad2 = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDay = (s) => { const d = parseISO(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtDayLong = (s) => { const d = parseISO(s); return `${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };

/* ============================================================
   Theme — same scoreboard/stopwatch identity as the rest of the app
   ============================================================ */
const FONT = { fontFamily: "'Big Shoulders Text', system-ui, sans-serif" };

function FlipNum({ value, className = "" }) {
  return <span key={String(value)} className={`flip ${className}`}>{value}</span>;
}

function ScoreboardClock() {
  const [t, setT] = useState(new Date());
  useEffect(() => { const id = setInterval(() => setT(new Date()), 1000); return () => clearInterval(id); }, []);
  const hh = pad2(t.getHours()), mm = pad2(t.getMinutes()), ss = pad2(t.getSeconds());
  return (
    <div className="inline-flex items-baseline gap-[2px] border-2 border-black bg-black px-4 py-2 text-white">
      <FlipNum value={`${hh}:${mm}`} className="f-mono text-[34px] leading-none tracking-tight" />
      <span className="f-mono text-[16px] leading-none text-neutral-500">:{ss}</span>
    </div>
  );
}

function Button({ children, onClick, variant = "primary", disabled, className = "", size = "md" }) {
  const base = "f-display inline-flex items-center justify-center border-2 border-black font-bold uppercase tracking-wide transition-colors select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-2";
  const sizes = { md: "h-12 px-5 text-[15px]", sm: "h-9 px-3 text-[13px]", lg: "h-14 px-6 text-[17px] w-full" };
  const variants = {
    primary: "bg-black text-white active:bg-white active:text-black disabled:bg-neutral-200 disabled:text-neutral-400 disabled:border-neutral-200",
    outline: "bg-white text-black active:bg-black active:text-white disabled:text-neutral-300 disabled:border-neutral-200",
    ghost: "border-transparent text-neutral-500 active:text-black normal-case tracking-normal font-medium",
  };
  return (
    <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
      {children}
    </button>
  );
}

function SeatMeter({ taken, cap, size = "md" }) {
  const dim = size === "sm" ? "w-[8px] h-[13px]" : "w-[11px] h-[18px]";
  if (cap <= 24) {
    return (
      <div className="flex flex-wrap gap-[3px]">
        {Array.from({ length: cap }).map((_, i) => (
          <div key={i} className={`${dim} border border-black ${i < taken ? "bg-black" : "bg-white"}`} />
        ))}
      </div>
    );
  }
  const pct = cap ? Math.min(100, (taken / cap) * 100) : 0;
  return (
    <div className="relative h-[14px] w-full border border-black bg-white">
      <div className="absolute inset-y-0 left-0 bg-black transition-[width] duration-300" style={{ width: `${pct}%` }} />
    </div>
  );
}

function StatRow({ items }) {
  return (
    <div className="flex divide-x divide-neutral-300">
      {items.map((it, i) => (
        <div key={i} className="px-2.5 first:pl-0">
          <span className="f-mono text-neutral-800">{it.value}</span>
          <span className="f-text ml-1 text-neutral-500">{it.label}</span>
        </div>
      ))}
    </div>
  );
}

function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div className="pointer-events-none fixed inset-x-0 bottom-24 z-50 flex justify-center px-5">
      <div className="f-display max-w-sm border-2 border-black bg-black px-4 py-3 text-center text-[14px] font-bold uppercase tracking-wide text-white">{msg}</div>
    </div>
  );
}

function Empty({ title }) {
  return (
    <div className="border-2 border-dashed border-neutral-300 py-14 text-center">
      <div className="f-text text-[15px] text-neutral-500">{title}</div>
    </div>
  );
}

/* ============================================================
   Root
   ============================================================ */
function App() {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);
  const [toast, setToast] = useState("");
  const flash = useCallback((m) => { setToast(m); setTimeout(() => setToast(""), 2800); }, []);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (raw) setSession(JSON.parse(raw));
    } catch (e) { /* ignore */ }
    setReady(true);
  }, []);

  const login = (s) => {
    setSession(s);
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ }
  };
  const logout = () => {
    setSession(null);
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
  };

  if (!ready) {
    return <div style={FONT} className="gym-root flex min-h-screen items-center justify-center bg-white text-[15px] text-neutral-400">Φόρτωση…</div>;
  }

  return (
    <div style={FONT} className="gym-root min-h-screen bg-white text-black">
      {!session ? <SignIn onLogin={login} flash={flash} /> : <ClientApp session={session} onLogout={logout} flash={flash} />}
      <Toast msg={toast} />
    </div>
  );
}

/* ============================================================
   Sign in
   ============================================================ */
function SignIn({ onLogin, flash }) {
  const [mode, setMode] = useState(null);
  const [firstName, setFirstName] = useState("");
  const [lastName, setLastName] = useState("");
  const [phone, setPhone] = useState("");
  const [email, setEmail] = useState("");
  const [marketing, setMarketing] = useState(false);
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const resetFields = () => {
    setFirstName(""); setLastName(""); setPhone("");
    setEmail(""); setMarketing(false); setPin(""); setErr("");
  };
  const digits = (v, max) => v.replace(/\D/g, "").slice(0, max);

  const signInClient = async () => {
    const cleanPhone = digits(phone, 10);
    if (cleanPhone.length < 10) { setErr("Γράψε το κινητό σου (10 ψηφία)"); return; }
    if (!/^\d{4}$/.test(pin)) { setErr("Ο κωδικός έχει 4 ψηφία"); return; }
    setBusy(true);
    const { data, error } = await sb.rpc("sign_in_client", { p_phone: cleanPhone, p_pin: pin });
    setBusy(false);
    if (error || !data?.ok) { setErr(data?.error || "Κάτι πήγε στραβά, δοκίμασε ξανά"); return; }
    onLogin({ clientId: data.client_id, firstName: data.first_name, lastName: data.last_name });
  };

  const createClient = async () => {
    const fn = firstName.trim(), ln = lastName.trim();
    const cleanPhone = digits(phone, 10);
    const cleanEmail = email.trim();
    if (!fn) { setErr("Γράψε το όνομά σου"); return; }
    if (!ln) { setErr("Γράψε το επώνυμό σου"); return; }
    if (cleanPhone.length < 10) { setErr("Το κινητό θέλει 10 ψηφία"); return; }
    if (cleanEmail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(cleanEmail)) {
      setErr("Το email δεν φαίνεται σωστό"); return;
    }
    if (marketing && !cleanEmail) { setErr("Για ενημερώσεις χρειάζεται email"); return; }
    if (!/^\d{4}$/.test(pin)) { setErr("Ο κωδικός έχει 4 ψηφία"); return; }
    setBusy(true);
    const { data, error } = await sb.rpc("sign_up_client", {
      p_first_name: fn, p_last_name: ln, p_phone: cleanPhone, p_pin: pin,
      p_email: cleanEmail || null, p_marketing: marketing,
    });
    setBusy(false);
    if (error || !data?.ok) { setErr(data?.error || "Κάτι πήγε στραβά, δοκίμασε ξανά"); return; }
    onLogin({ clientId: data.client_id, firstName: fn, lastName: ln });
  };

  return (
    <div className="mx-auto flex min-h-[100svh] max-w-md flex-col justify-between px-6 py-10">
      <div>
        <div className="f-display text-[13px] font-bold uppercase tracking-[0.18em] text-neutral-400">{GYM_NAME}</div>
        <div className="mt-5"><ScoreboardClock /></div>
        <h1 className="f-display mt-6 text-[38px] font-extrabold uppercase leading-[0.95] tracking-tight">
          Κράτησε την ώρα σου<br />σε δέκα δευτερόλεπτα
        </h1>
      </div>

      <div className="mt-8">
        {!mode && (
          <div className="space-y-3">
            <Button size="lg" onClick={() => { resetFields(); setMode("in"); }}>Σύνδεση πελάτη</Button>
            <Button size="lg" variant="outline" onClick={() => { resetFields(); setMode("new"); }}>Νέος πελάτης</Button>
          </div>
        )}

        {mode === "in" && (
          <div>
            <div className="f-text mb-3 text-[13px] text-neutral-500">Κινητό και προσωπικός κωδικός</div>
            <div className="space-y-2">
              <input value={phone} onChange={(e) => { setPhone(digits(e.target.value, 10)); setErr(""); }}
                inputMode="numeric" placeholder="Κινητό (π.χ. 6971234567)"
                className="f-mono h-12 w-full border-2 border-black px-4 text-[16px] outline-none" />
              <input value={pin} onChange={(e) => { setPin(digits(e.target.value, 4)); setErr(""); }}
                inputMode="numeric" placeholder="Κωδικός (4 ψηφία)" type="password"
                className="f-mono h-12 w-full border-2 border-black px-4 text-[15px] tracking-[0.3em] outline-none" />
            </div>
            <Button className="mt-3 w-full" disabled={busy} onClick={signInClient}>{busy ? "Σύνδεση…" : "Σύνδεση"}</Button>
            {err && <div className="f-text mt-2 text-[13px] text-neutral-500">{err}</div>}
            <Button variant="ghost" className="mt-2" onClick={() => { setMode(null); setErr(""); }}>Πίσω</Button>
          </div>
        )}

        {mode === "new" && (
          <div>
            <div className="f-text mb-3 text-[13px] text-neutral-500">Δημιουργία λογαριασμού</div>
            <div className="space-y-2">
              <input value={firstName} onChange={(e) => { setFirstName(e.target.value); setErr(""); }}
                placeholder="Όνομα" className="f-text h-12 w-full border-2 border-black px-4 text-[16px] outline-none" />
              <input value={lastName} onChange={(e) => { setLastName(e.target.value); setErr(""); }}
                placeholder="Επώνυμο" className="f-text h-12 w-full border-2 border-black px-4 text-[16px] outline-none" />
              <input value={phone} onChange={(e) => { setPhone(digits(e.target.value, 10)); setErr(""); }}
                inputMode="numeric" placeholder="Κινητό" className="f-mono h-12 w-full border-2 border-black px-4 text-[16px] outline-none" />
              <input value={email} onChange={(e) => { setEmail(e.target.value); setErr(""); }}
                type="email" inputMode="email" autoCapitalize="none" placeholder="Email (προαιρετικό)"
                className="f-text h-12 w-full border-2 border-black px-4 text-[16px] outline-none" />
              <input value={pin} onChange={(e) => { setPin(digits(e.target.value, 4)); setErr(""); }}
                inputMode="numeric" placeholder="Κωδικός (4 ψηφία)" type="text"
                className="f-mono h-12 w-full border-2 border-black px-4 text-[15px] tracking-[0.3em] outline-none" />
            </div>

            <button onClick={() => { setMarketing(!marketing); setErr(""); }}
              className="mt-3 flex w-full items-start gap-3 border-2 border-black p-3 text-left">
              <span className={`mt-[1px] flex h-5 w-5 shrink-0 items-center justify-center border-2 border-black ${marketing ? "bg-black" : "bg-white"}`}>
                {marketing && <span className="f-display text-[13px] font-bold leading-none text-white">✓</span>}
              </span>
              <span className="f-text text-[13px] leading-snug text-neutral-700">
                Θέλω να λαμβάνω ενημερώσεις στο email για ομαδικά προγράμματα και προσφορές.
              </span>
            </button>
            <Button className="mt-3 w-full" disabled={busy} onClick={createClient}>{busy ? "Δημιουργία…" : "Δημιουργία"}</Button>
            {err && <div className="f-text mt-2 text-[13px] text-neutral-500">{err}</div>}
            <Button variant="ghost" className="mt-2" onClick={() => { setMode(null); setErr(""); }}>Πίσω</Button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   Client app
   ============================================================ */
function ClientApp({ session, onLogout, flash }) {
  const [tab, setTab] = useState("book");
  const [notifs, setNotifs] = useState([]);

  useEffect(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get("checkin") === "1") setTab("checkin");
    } catch (e) { /* ignore */ }
  }, []);

  useEffect(() => {
    (async () => {
      const { data, error } = await sb.rpc("my_notifications", { p_client_id: session.clientId });
      if (!error && data) setNotifs(data);
    })();
  }, [session.clientId, tab]);

  return (
    <div className="mx-auto max-w-md pb-28">
      <header className="sticky top-0 z-40 flex items-center justify-between border-b-2 border-black bg-white px-5 pb-4 pt-6">
        <div>
          <div className="f-display text-[12px] font-bold uppercase tracking-[0.18em] text-neutral-400">{GYM_NAME}</div>
          <div className="f-text mt-1 text-[17px]">{session.firstName} {session.lastName}</div>
        </div>
        <Button variant="ghost" size="sm" onClick={onLogout}>Έξοδος</Button>
      </header>

      {notifs.length > 0 && tab === "book" && (
        <div className="mx-5 mt-5 border-2 border-black">
          {notifs.map((n) => (
            <div key={n.id} className="f-text border-b border-neutral-200 px-4 py-3 text-[13px] leading-snug text-neutral-700 last:border-b-0">
              {n.body}
            </div>
          ))}
        </div>
      )}

      {tab === "book" && <BookTab session={session} flash={flash} />}
      {tab === "mine" && <MyBookings session={session} flash={flash} />}
      {tab === "checkin" && <CheckinTab session={session} flash={flash} />}

      <nav className="fixed inset-x-0 bottom-0 z-40 border-t-2 border-black bg-white"
        style={{ paddingBottom: "env(safe-area-inset-bottom)" }}>
        <div className="mx-auto flex max-w-md">
          {[["book", "Πρόγραμμα"], ["mine", "Κρατήσεις"]].map(([k, label]) => (
            <button key={k} onClick={() => setTab(k)}
              className={`f-display flex-1 border-l-2 border-black py-4 text-[13px] font-bold uppercase tracking-wide first:border-l-0 ${
                tab === k ? "bg-black text-white" : "bg-white text-neutral-500"}`}>
              {label}
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

function BookTab({ session, flash }) {
  const [date, setDate] = useState(iso(new Date()));
  const [slots, setSlots] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busySlot, setBusySlot] = useState(null);

  const days = useMemo(() => {
    const base = new Date(); base.setHours(0, 0, 0, 0);
    return Array.from({ length: MAX_DAYS_AHEAD + 1 }, (_, i) => iso(addDays(base, i)));
  }, []);

  const load = useCallback(async () => {
    setLoading(true);
    const { data, error } = await sb.rpc("day_availability", { p_date: date });
    setLoading(false);
    if (error) { flash("Δεν φορτώθηκε το πρόγραμμα"); return; }
    setSlots(data || []);
  }, [date, flash]);

  useEffect(() => { load(); }, [load]);

  const book = async (time) => {
    setBusySlot(time);
    const { data, error } = await sb.rpc("create_booking", { p_client_id: session.clientId, p_date: date, p_time: time });
    setBusySlot(null);
    if (error || !data?.ok) { flash(data?.error || "Κάτι πήγε στραβά"); return; }
    flash(`Κράτηση ${fmtDay(date)}, ${time}`);
    load();
  };

  const waitlist = async (time) => {
    setBusySlot(time);
    const { data, error } = await sb.rpc("join_waitlist", { p_client_id: session.clientId, p_date: date, p_time: time });
    setBusySlot(null);
    if (error || !data?.ok) { flash(data?.error || "Κάτι πήγε στραβά"); return; }
    flash("Μπήκες στη λίστα αναμονής");
  };

  return (
    <div>
      <div className="mt-5 flex gap-2 overflow-x-auto px-5 pb-1">
        {days.map((d) => {
          const dd = parseISO(d), on = d === date;
          return (
            <button key={d} onClick={() => setDate(d)}
              className={`flex h-[66px] w-[58px] shrink-0 flex-col items-center justify-center border-2 text-center ${
                on ? "border-black bg-black text-white" : "border-neutral-300 bg-white text-neutral-700"}`}>
              <span className="f-text text-[10px] uppercase text-neutral-400">{DAYS[dd.getDay()]}</span>
              <span className="f-mono mt-1 text-[18px] leading-none">{dd.getDate()}</span>
            </button>
          );
        })}
      </div>

      <div className="px-5 pt-6">
        <h2 className="f-display text-[24px] font-extrabold uppercase tracking-tight">{fmtDayLong(date)}</h2>
        <p className="f-text mt-1 text-[13px] text-neutral-500">Διαθέσιμες ώρες και θέσεις που μένουν</p>
      </div>

      {loading ? (
        <div className="f-text px-5 py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : (slots || []).length === 0 ? (
        <div className="px-5 py-16 text-center">
          <div className="f-display text-[34px] font-extrabold uppercase leading-none tracking-tight">
            Ξεκουράσου 🖤
          </div>
          <p className="f-text mt-3 text-[14px] text-neutral-500">
            Δεν υπάρχουν ώρες αυτή την ημέρα.
          </p>
        </div>
      ) : (
        <div className="mt-5 divide-y divide-neutral-300 border-y-2 border-black">
          {(slots || []).map((s) => {
            const full = s.taken >= s.capacity;
            const isBusy = busySlot === s.slot_time;
            return (
              <div key={s.slot_time} className="px-5 py-4">
                <div className="flex items-center justify-between gap-4">
                  <div className="min-w-0">
                    <FlipNum value={s.slot_time} className="f-mono block text-[28px] leading-none tracking-tight" />
                    <div className="mt-2">
                      <StatRow items={[
                        { value: full ? "0" : s.capacity - s.taken, label: "ελεύθερες" },
                        { value: `${s.taken}/${s.capacity}`, label: "" },
                      ]} />
                    </div>
                  </div>
                  <div className="shrink-0">
                    {full ? (
                      <Button variant="outline" size="sm" disabled={isBusy} onClick={() => waitlist(s.slot_time)}>Αναμονή</Button>
                    ) : (
                      <Button size="sm" disabled={isBusy} onClick={() => book(s.slot_time)}>Κράτηση</Button>
                    )}
                  </div>
                </div>
                <div className="mt-3.5"><SeatMeter taken={s.taken} cap={s.capacity} /></div>
              </div>
            );
          })}
        </div>
      )}

      <div className="h-6" />
    </div>
  );
}

function MyBookings({ session, flash }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busyId, setBusyId] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    const { data: d, error } = await sb.rpc("my_bookings", { p_client_id: session.clientId });
    setLoading(false);
    if (error) { flash("Δεν φορτώθηκαν οι κρατήσεις"); return; }
    setData(d);
  }, [session.clientId, flash]);

  useEffect(() => { load(); }, [load]);

  const cancel = async (bookingId) => {
    setBusyId(bookingId);
    const { data: d, error } = await sb.rpc("cancel_booking", { p_client_id: session.clientId, p_booking_id: bookingId });
    setBusyId(null);
    if (error || !d?.ok) { flash(d?.error || "Κάτι πήγε στραβά"); return; }
    flash("Η κράτηση ακυρώθηκε");
    load();
  };

  const label = { checked_in: "Παρών", booked: "Κρατημένο" };
  const bookings = data?.bookings || [];
  const waits = data?.waitlist || [];

  return (
    <div className="px-5">
      <h2 className="f-display pt-7 text-[24px] font-extrabold uppercase tracking-tight">Οι κρατήσεις μου</h2>

      {loading ? (
        <div className="f-text py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : bookings.length === 0 && waits.length === 0 ? (
        <Empty title="Δεν έχεις ενεργή κράτηση." />
      ) : (
        <div className="mt-5 divide-y divide-neutral-300 border-y-2 border-black">
          {bookings.map((b) => (
            <div key={b.id} className="flex items-center justify-between gap-4 py-4">
              <div>
                <span className="f-mono block text-[20px] leading-none tracking-tight">{b.time}</span>
                <div className="f-text mt-1 text-[13px] text-neutral-500">{fmtDay(b.date)} · {label[b.status] || b.status}</div>
              </div>
              {b.status === "booked" && (
                <Button variant="outline" size="sm" disabled={busyId === b.id} onClick={() => cancel(b.id)}>Ακύρωση</Button>
              )}
            </div>
          ))}
          {waits.map((w) => (
            <div key={w.id} className="flex items-center justify-between gap-4 py-4">
              <div>
                <span className="f-mono block text-[20px] leading-none tracking-tight text-neutral-400">{w.time}</span>
                <div className="f-text mt-1 text-[13px] text-neutral-500">{fmtDay(w.date)} · Λίστα αναμονής</div>
              </div>
              <span className="f-text text-[13px] text-neutral-400">Σε αναμονή</span>
            </div>
          ))}
        </div>
      )}

      <PushPanel session={session} flash={flash} />

      <div className="h-10" />
    </div>
  );
}

/* Εγγραφή αυτής της συσκευής στις push ειδοποιήσεις. */
function PushPanel({ session, flash }) {
  const [mode, setMode] = useState("checking"); // checking | unsupported | needs-install | off | on
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    (async () => {
      if (isIOS() && !isStandalone()) { setMode("needs-install"); return; }
      if (!pushSupported()) { setMode("unsupported"); return; }
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        setMode(sub ? "on" : "off");
      } catch (e) {
        setMode("off");
      }
    })();
  }, []);

  const enable = async () => {
    setBusy(true);
    try {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { flash("Δεν δόθηκε άδεια"); setBusy(false); return; }

      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
      const json = sub.toJSON();

      const { data, error } = await sb.rpc("save_push_subscription", {
        p_client_id: session.clientId,
        p_endpoint: sub.endpoint,
        p_p256dh: json.keys.p256dh,
        p_auth: json.keys.auth,
      });
      if (error || !data?.ok) { flash("Δεν αποθηκεύτηκε"); setBusy(false); return; }

      setMode("on");
      flash("Οι ειδοποιήσεις ενεργοποιήθηκαν");
    } catch (e) {
      flash("Κάτι πήγε στραβά");
    }
    setBusy(false);
  };

  const disable = async () => {
    setBusy(true);
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await sb.rpc("delete_push_subscription", { p_endpoint: sub.endpoint });
        await sub.unsubscribe();
      }
      setMode("off");
      flash("Οι ειδοποιήσεις απενεργοποιήθηκαν");
    } catch (e) {
      flash("Κάτι πήγε στραβά");
    }
    setBusy(false);
  };

  const test = async () => {
    setBusy(true);
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification("Kinesis", {
        body: "Δοκιμαστική ειδοποίηση. Αν τη βλέπεις, όλα δουλεύουν.",
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        tag: "kinesis-test",
      });
    } catch (e) {
      flash("Δεν εμφανίστηκε");
    }
    setBusy(false);
  };

  if (mode === "checking" || mode === "unsupported") return null;

  return (
    <div className="mt-10 border-2 border-black p-4">
      <div className="f-display text-[14px] font-bold uppercase tracking-wide">Ειδοποιήσεις</div>

      {mode === "needs-install" && (
        <>
          <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
            Στο iPhone οι ειδοποιήσεις δουλεύουν μόνο αν προσθέσεις πρώτα την εφαρμογή
            στην αρχική οθόνη και την ανοίξεις από εκεί:
          </p>
          <ol className="f-text mt-2 space-y-1 text-[13px] leading-relaxed text-neutral-600">
            <li>1. Πάτα το κουμπί κοινοποίησης του Safari (τετράγωνο με βέλος).</li>
            <li>2. Διάλεξε «Προσθήκη στην οθόνη Home».</li>
            <li>3. Άνοιξε την εφαρμογή από το νέο εικονίδιο.</li>
          </ol>
        </>
      )}

      {mode === "off" && (
        <>
          <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
            Ενημέρωση όταν ελευθερώνεται θέση από τη λίστα αναμονής, όταν ακυρώνεται
            κράτησή σου, και υπενθύμιση πριν την προπόνηση.
          </p>
          <Button className="mt-4 w-full" disabled={busy} onClick={enable}>
            {busy ? "…" : "Ενεργοποίηση ειδοποιήσεων"}
          </Button>
        </>
      )}

      {mode === "on" && (
        <>
          <p className="f-text mt-2 text-[13px] text-neutral-600">
            Ενεργές σε αυτή τη συσκευή.
          </p>
          <Button variant="outline" className="mt-4 w-full" disabled={busy} onClick={test}>
            Δοκιμαστική ειδοποίηση
          </Button>
          <Button variant="ghost" className="mt-2 w-full" disabled={busy} onClick={disable}>
            {busy ? "…" : "Απενεργοποίηση"}
          </Button>
        </>
      )}
    </div>
  );
}

function CheckinTab({ session, flash }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const today = iso(new Date());

  const load = useCallback(async () => {
    setLoading(true);
    const { data: d, error } = await sb.rpc("my_bookings", { p_client_id: session.clientId });
    setLoading(false);
    if (error) { flash("Κάτι πήγε στραβά"); return; }
    setData(d);
  }, [session.clientId, flash]);

  useEffect(() => { load(); }, [load]);

  const todays = (data?.bookings || []).filter((b) => b.date === today);
  const next = todays.find((b) => b.status === "booked");
  const done = todays.find((b) => b.status === "checked_in");

  const doCheckin = async (bookingId) => {
    setBusy(true);
    const { data: d, error } = await sb.rpc("check_in", { p_client_id: session.clientId, p_booking_id: bookingId });
    setBusy(false);
    if (error || !d?.ok) { flash(d?.error || "Κάτι πήγε στραβά"); return; }
    flash("Καλή προπόνηση");
    load();
  };

  return (
    <div className="px-5">
      <h2 className="f-display pt-7 text-[24px] font-extrabold uppercase tracking-tight">Check-in</h2>
      <p className="f-text mt-1 text-[13px] leading-relaxed text-neutral-500">
        Σκάναρε το QR στην είσοδο ή ακούμπησε το κινητό στο NFC tag. Ανοίγει αυτή η οθόνη.
      </p>

      <div className="mt-8 border-2 border-black p-6 text-center">
        {loading ? (
          <div className="f-text py-6 text-[15px] text-neutral-400">Φόρτωση…</div>
        ) : done ? (
          <>
            <div className="f-text text-[15px] text-neutral-500">Έγινε check-in</div>
            <FlipNum value={done.time} className="f-mono mt-2 block text-[44px] leading-none tracking-tight" />
            <div className="f-text mt-3 text-[13px] text-neutral-500">Καλή προπόνηση, {session.firstName}.</div>
          </>
        ) : next ? (
          <>
            <div className="f-text text-[15px] text-neutral-500">Η κράτησή σου σήμερα</div>
            <FlipNum value={next.time} className="f-mono mt-2 block text-[44px] leading-none tracking-tight" />
            <div className="mt-5">
              <Button size="lg" disabled={busy} onClick={() => doCheckin(next.id)}>{busy ? "…" : "Check-in τώρα"}</Button>
            </div>
          </>
        ) : (
          <div className="f-text py-6 text-[15px] text-neutral-500">Δεν έχεις κράτηση για σήμερα.</div>
        )}
      </div>
      <div className="h-10" />
    </div>
  );
}
