<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<style>
  /* Χωρίς ζουμ με διπλό πάτημα. */
  * { touch-action: manipulation; }
  /* Το Safari μεγαλώνει μόνο του τα γράμματα σε οριζόντια θέση. */
  html { -webkit-text-size-adjust: 100%; }

  /* Η σελίδα δεν κυλάει ποτέ. Κυλάνε μόνο όσα κομμάτια το ζητούν
     ρητά. Το position:fixed σταματάει και το "ελαστικό" τράβηγμα
     του iPhone πάνω/κάτω. */
  html, body {
    height: 100%;
    overflow: hidden;
    position: fixed;
    width: 100%;
    overscroll-behavior: none;
  }
  /* Τα εσωτερικά κυλιόμενα κομμάτια δεν παρασύρουν τη σελίδα. */
  .overflow-y-auto, .overflow-x-auto {
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
</style>
<meta name="theme-color" content="#000000" />

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Space+Mono:wght@400;700&display=swap');
html, body { margin: 0; background: #fff; }
/* Χωρίς ύψος εδώ, τα «h-full» από κάτω δεν έχουν σε τι να πατήσουν
   και η μπάρα με τα κουμπιά ακολουθεί το περιεχόμενο αντί για την
   οθόνη. */
#root { height: 100%; }
.gym-root { font-family: 'Big Shoulders Text', system-ui, sans-serif; }
.f-display { font-family: 'Big Shoulders Display', system-ui, sans-serif; letter-spacing: 0.005em; }
.f-mono { font-family: 'Space Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
@keyframes flipnum {
  0% { transform: rotateX(0deg); opacity: 1; }
  45% { transform: rotateX(-90deg); opacity: 0.25; }
  55% { transform: rotateX(90deg); opacity: 0.25; }
  100% { transform: rotateX(0deg); opacity: 1; }
}
.flip { display: inline-block; animation: flipnum 420ms cubic-bezier(.2,.7,.3,1); transform-origin: 50% 60%; }

/* ── Σκούρο θέμα ──────────────────────────────────────────
   Αντιστρέφει τα βασικά χρώματα. Το άσπρο γίνεται το χρώμα
   δράσης (κουμπιά), το μαύρο γίνεται το φόντο. */
[data-theme="dark"] { background: #0C0C0C; }
[data-theme="dark"] body { background: #0C0C0C; }
[data-theme="dark"] .bg-white { background-color: #0C0C0C !important; }
[data-theme="dark"] .text-black { color: #F2F2F2 !important; }
[data-theme="dark"] .bg-black { background-color: #F2F2F2 !important; }
[data-theme="dark"] .text-white { color: #0C0C0C !important; }
[data-theme="dark"] .border-black { border-color: #3A3A3A !important; }
[data-theme="dark"] .border-neutral-200,
[data-theme="dark"] .border-neutral-300 { border-color: #2E2E2E !important; }
[data-theme="dark"] .divide-neutral-200 > * + *,
[data-theme="dark"] .divide-neutral-300 > * + * { border-color: #232323 !important; }
[data-theme="dark"] .bg-neutral-50,
[data-theme="dark"] .bg-neutral-100 { background-color: #161616 !important; }
[data-theme="dark"] .bg-neutral-200 { background-color: #2A2A2A !important; }
[data-theme="dark"] .text-neutral-700 { color: #D6D6D6 !important; }
[data-theme="dark"] .text-neutral-600 { color: #B4B4B4 !important; }
[data-theme="dark"] .text-neutral-500 { color: #8A8A8A !important; }
[data-theme="dark"] .text-neutral-400 { color: #6E6E6E !important; }
[data-theme="dark"] .text-neutral-300 { color: #5A5A5A !important; }
[data-theme="dark"] input { background-color: #0C0C0C; color: #F2F2F2; }
[data-theme="dark"] input::placeholder { color: #6E6E6E; }
[data-theme="dark"] .border-dashed { border-color: #3A3A3A !important; }

/* Τα κουμπιά με περίγραμμα χάνονταν στο σκούρο. Τους δίνουμε γκρι
   γέμισμα ώστε να διαβάζονται ως κουμπιά. */
[data-theme="dark"] button.border.bg-white { background-color: #1E1E1E !important; border-color: #4A4A4A !important; }
[data-theme="dark"] button.border.bg-white:active { background-color: #F2F2F2 !important; }

<div id="root"><div id="boot-status" style="font-family:system-ui,sans-serif;padding:24px;color:#666;font-size:14px;">Φόρτωση…</div></div>


<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ============================================================
   Supabase — fill these in from Project Settings → API
   The anon/publishable key is DESIGNED to be public; it's safe
   to ship inside this file. Never put the service_role key here.
   ============================================================ */
const SUPABASE_URL = "https://qkjceupbxdujgytikxug.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFramNldXBieGR1amd5dGlreHVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDI0NTUsImV4cCI6MjEwNDExODQ1NX0.cSsylfCvbqlvYgoeryf08jEVzvTjZGXli4dl7ZE7_Pc";

/* Calls a database function. Talks straight to the REST endpoint, so
   there's no external client library to break. Returns the same
   { data, error } shape the rest of this file expects. */
async function rpc(fnName, args) {
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fnName, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(args || {}),
    });
    const text = await res.text();
    if (!res.ok) return { data: null, error: text || res.statusText };
    return { data: text ? JSON.parse(text) : null, error: null };
  } catch (e) {
    return { data: null, error: String(e) };
  }
}
const sb = { rpc: (fnName, args) => rpc(fnName, args) };

/* Το όνομα και το πόσο μπροστά ανοίγει το πρόγραμμα τα ορίζει ο
   διαχειριστής. Τα φέρνουμε πριν το πρώτο render (δες loadAppSettings
   στο τέλος του αρχείου) — οι τιμές εδώ είναι μόνο εφεδρεία αν δεν
   απαντήσει ο διακομιστής. */
let GYM_NAME = "Γυμναστήριο";
let MAX_DAYS_AHEAD = 14;
const SESSION_KEY = "kinesis_session";
const THEME_KEY = "kinesis_theme";

/* Εμφάνιση: "auto" ακολουθεί τη ρύθμιση του κινητού. */
function applyTheme(choice) {
  let dark = choice === "dark";
  if (choice === "auto") {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0C0C0C" : "#FFFFFF");
}

function readTheme() {
  try { return localStorage.getItem(THEME_KEY) || "light"; } catch (e) { return "light"; }
}

/* Πριν το πρώτο render, για να μη φέγγει άσπρο όσο φορτώνει. */
applyTheme(readTheme());

/* Public half of the push signing key. Safe to ship — it only lets
   the browser verify that pushes come from our server. */
const VAPID_PUBLIC_KEY = "BGK4sPNp--K8eEhGhTyO-t4hrAAEPcIyVAJh1OjpF4rUGoE-bPWAtwyrSsV5IH8Ikunifj7Ki-PhFPd0n5B1kMQ";

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = window.atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

const bufToBase64Url = (buf) =>
  bufToBase64(buf).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

/* Έγινε αυτή η εγγραφή με το κλειδί που χρησιμοποιεί σήμερα ο
   διακομιστής; Αν όχι, δεν μπορεί να της σταλεί τίποτα ποτέ. */
function matchesVapid(sub) {
  try {
    const key = sub.options && sub.options.applicationServerKey;
    if (!key) return true;   // ο browser δεν το δίνει — μην πειράξεις τίποτα
    return bufToBase64Url(key) === VAPID_PUBLIC_KEY;
  } catch (e) { return true; }
}

function bufToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return window.btoa(s);
}

/* On iPhone, push only works once the app has been added to the Home
   Screen and opened from there — not from a normal Safari tab. */
const isStandalone = () =>
  window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent);
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window;

/* Έχει ρωτηθεί ήδη αυτή η συσκευή αν θέλει ειδοποιήσεις; Ρωτάμε μία
   φορά μετά την εγγραφή. Αν πει όχι, δεν ξαναενοχλούμε — μένει το
   κουμπί στις ρυθμίσεις. */
const PUSH_ASKED_KEY = "kinesis_push_asked";
function pushAsked() {
  try { return localStorage.getItem(PUSH_ASKED_KEY) === "1"; } catch (e) { return true; }
}
function markPushAsked() {
  try { localStorage.setItem(PUSH_ASKED_KEY, "1"); } catch (e) { /* ignore */ }
}

/* Εγγραφή της συσκευής στις push. Την καλούν και το ποπ απ μετά την
   εγγραφή και το κουμπί στις ρυθμίσεις — μία υλοποίηση, όχι δύο. */
async function subscribePush(clientId) {
  try {
    if (!pushSupported()) return { ok: false, error: "unsupported" };
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return { ok: false, error: "denied" };

    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const json = sub.toJSON();

    const { data, error } = await sb.rpc("save_push_subscription", {
      p_client_id: clientId,
      p_endpoint: sub.endpoint,
      p_p256dh: json.keys.p256dh,
      p_auth: json.keys.auth,
    });
    if (error || !data?.ok) return { ok: false, error: "save" };
    return { ok: true };
  } catch (e) {
    return { ok: false, error: "failed" };
  }
}

/* Ξεγράψιμο της συσκευής. Το χρειαζόμαστε και όταν διαγραφεί ο
   λογαριασμός, για να μη μείνει ζωντανή συνδρομή σε κινητό που δεν
   έχει πια λογαριασμό. */
async function unsubscribePush() {
  try {
    if (!pushSupported()) return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) return;
    try { await sb.rpc("delete_push_subscription", { p_endpoint: sub.endpoint }); } catch (e) { /* ignore */ }
    try { await sub.unsubscribe(); } catch (e) { /* ignore */ }
  } catch (e) { /* ignore */ }
}

/* ============================================================
   Dates & small helpers
   ============================================================ */
const DAYS = ["Κυρ", "Δευ", "Τρί", "Τετ", "Πέμ", "Παρ", "Σάβ"];
const DAYS_LONG = ["Κυριακή", "Δευτέρα", "Τρίτη", "Τετάρτη", "Πέμπτη", "Παρασκευή", "Σάββατο"];
const MONTHS = ["Ιαν", "Φεβ", "Μαρ", "Απρ", "Μαΐ", "Ιουν", "Ιουλ", "Αυγ", "Σεπ", "Οκτ", "Νοε", "Δεκ"];
const pad2 = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDay = (s) => { const d = parseISO(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtDayLong = (s) => { const d = parseISO(s); return `${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const slotDate = (date, time) => {
  const [y, m, d] = String(date).split("-").map(Number);
  const [hh, mm] = String(time).split(":").map(Number);
  return new Date(y, m - 1, d, hh || 0, mm || 0);
};

/* ============================================================
   Ακύρωση από τη διαχείριση
   Κρατάμε στη συσκευή ποιες κρατήσεις ξέραμε. Αν κάποια χαθεί
   χωρίς να την ακυρώσει ο ίδιος ο πελάτης, την ακύρωσε το
   γυμναστήριο — και το λέμε με ειδοποίηση.
   ============================================================ */
const KNOWN_KEY = "kinesis_known_bookings";

/* Ποιες ειδοποιήσεις έσβησε ο πελάτης. Ο διακομιστής συνεχίζει να
   τις στέλνει — τις κρύβουμε στη συσκευή. */
const HIDDEN_KEY = "kinesis_hidden_notifs";

function readHidden() {
  try { return JSON.parse(localStorage.getItem(HIDDEN_KEY) || "[]"); } catch (e) { return []; }
}
function writeHidden(list) {
  try { localStorage.setItem(HIDDEN_KEY, JSON.stringify(list)); } catch (e) { /* ignore */ }
}

function readKnown() {
  try { return JSON.parse(localStorage.getItem(KNOWN_KEY) || "[]"); } catch (e) { return []; }
}
function writeKnown(list) {
  try { localStorage.setItem(KNOWN_KEY, JSON.stringify(list)); } catch (e) { /* ignore */ }
}
/* Ο πελάτης ακύρωσε μόνος του — δεν θέλει προειδοποίηση. */
function forgetBooking(id) {
  writeKnown(readKnown().filter((b) => b.id !== id));
}
/* Συγκρίνει τη λίστα του διακομιστή με ό,τι ξέραμε. Μια κράτηση
   μετράει ως ακυρωμένη είτε αν γύρισε με status "cancelled", είτε
   αν εξαφανίστηκε ενώ η ώρα της δεν έχει περάσει ακόμα. */
function findCancelled(bookings) {
  const list = bookings || [];
  const active = list.filter((b) => b.status !== "cancelled");
  const live = new Set(active.map((b) => b.id));
  const explicit = new Set(list.filter((b) => b.status === "cancelled").map((b) => b.id));
  const now = new Date();
  const gone = readKnown().filter((b) =>
    !live.has(b.id) && (explicit.has(b.id) || slotDate(b.date, b.time) > now));
  writeKnown(active.map((b) => ({ id: b.id, date: b.date, time: b.time })));
  return gone;
}

/* Κάθε σημείο της εφαρμογής που φέρνει κρατήσεις περνάει από εδώ.
   Έτσι μια νέα κράτηση καταγράφεται αμέσως μόλις γίνει, και δεν
   χάνεται η ακύρωση αν ο διαχειριστής προλάβει πριν τον επόμενο
   αυτόματο έλεγχο. */
const ALERTED = new Set();
const PENDING = [];
let cancelListener = null;

function reportBookings(bookings) {
  const gone = findCancelled(bookings).filter((b) => !ALERTED.has(b.id));
  if (gone.length === 0) return;
  gone.forEach((b) => ALERTED.add(b.id));
  if (cancelListener) cancelListener(gone);
  else PENDING.push(...gone);
  /* Την ειδοποίηση συστήματος τη στέλνει ο διακομιστής με push. Από
     εδώ τη βγάζουμε μόνο σε συσκευές που δεν είναι γραμμένες —
     υπολογιστής, ή πελάτης που δεν έδωσε άδεια. Αλλιώς θα ερχόταν
     δεύτερη φορά μόλις ανοίξει την εφαρμογή. */
  hasPushSubscription().then((pushOn) => {
    if (pushOn) return;
    for (const g of gone) {
      localNotify("⚠️ Το ραντεβού σου ακυρώθηκε !⚠️",
        `${fmtDayLong(g.date)}, ${g.time}`, "kinesis-cancel-" + g.id);
    }
  });
}

/* Είναι αυτή η συσκευή γραμμένη στις push ειδοποιήσεις; */
async function hasPushSubscription() {
  try {
    if (!pushSupported()) return false;
    const reg = await navigator.serviceWorker.ready;
    return !!(await reg.pushManager.getSubscription());
  } catch (e) { return false; }
}

/* ---------- Ακυρώσεις από τον πίνακα του διακομιστή ----------
   Ο έλεγχος από πάνω συγκρίνει με ό,τι θυμόταν η συσκευή, οπότε
   χάνει την ακύρωση αν η εφαρμογή δεν είχε προλάβει να δει ποτέ την
   κράτηση — για παράδειγμα μετά από νέα σύνδεση ή καθάρισμα του
   browser. Οι ειδοποιήσεις του διακομιστή δεν έχουν αυτό το κενό. */
const ALERTED_KEY = "kinesis_alerted_notifs";

function readAlerted() {
  try { return JSON.parse(localStorage.getItem(ALERTED_KEY) || "[]"); } catch (e) { return []; }
}
function writeAlerted(list) {
  try { localStorage.setItem(ALERTED_KEY, JSON.stringify(list.slice(-100))); } catch (e) { /* ignore */ }
}
function resetAlerted() {
  try { localStorage.removeItem(ALERTED_KEY); } catch (e) { /* ignore */ }
}

function reportNotifications(list) {
  const items = (list || []).filter((n) => n && n.kind === "cancelled");
  let raw = null;
  try { raw = localStorage.getItem(ALERTED_KEY); } catch (e) { /* ignore */ }

  /* Πρώτη φορά σε αυτή τη συσκευή: καταγράφουμε ό,τι υπάρχει ήδη
     χωρίς να χτυπήσουμε, αλλιώς θα έσκαγαν μαζεμένες όλες οι παλιές. */
  if (raw === null) { writeAlerted(items.map((n) => n.id)); return; }

  const seen = readAlerted();
  const fresh = items.filter((n) => !seen.includes(n.id));
  if (fresh.length === 0) return;
  writeAlerted([...seen, ...fresh.map((n) => n.id)]);

  /* Ίδιος κανόνας: αν η συσκευή παίρνει push, την έχει ήδη λάβει. */
  hasPushSubscription().then((pushOn) => {
    if (pushOn) return;
    for (const n of fresh) {
      localNotify("⚠️ Το ραντεβού σου ακυρώθηκε !⚠️", n.body || "", "kinesis-cancel-" + n.id);
    }
  });
}

/* Ειδοποίηση συστήματος, αν ο πελάτης έχει δώσει άδεια. */
async function localNotify(title, body, tag) {
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification(title, {
      body: body,
      icon: "./icon-192.png",
      badge: "./icon-192.png",
      tag: tag || "kinesis-cancel",
    });
  } catch (e) { /* ignore */ }
}

/* ============================================================
   Theme — same scoreboard/stopwatch identity as the rest of the app
   ============================================================ */
const FONT = { fontFamily: "'Big Shoulders Text', system-ui, sans-serif" };

function FlipNum({ value, className = "" }) {
  return <span key={String(value)} className={`flip ${className}`}>{value}</span>;
}

function ScoreboardClock() {
  const [t, setT] = useState(new Date());
  useEffect(() => { const id = setInterval(() => setT(new Date()), 1000); return () => clearInterval(id); }, []);
  const hh = pad2(t.getHours()), mm = pad2(t.getMinutes()), ss = pad2(t.getSeconds());
  return (
    <div className="inline-flex items-baseline gap-[2px] border border-black bg-black px-4 py-2 text-white">
      <FlipNum value={`${hh}:${mm}`} className="f-mono text-[34px] leading-none tracking-tight" />
      <span className="f-mono text-[16px] leading-none text-neutral-500">:{ss}</span>
    </div>
  );
}

function Button({ children, onClick, variant = "primary", disabled, className = "", size = "md" }) {
  const base = "f-display inline-flex items-center justify-center border border-black font-bold uppercase tracking-wide transition-colors select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-2";
  const sizes = { md: "h-12 px-5 text-[15px]", sm: "h-9 px-3 text-[13px]", lg: "h-14 px-6 text-[17px] w-full" };
  const variants = {
    primary: "bg-black text-white active:bg-white active:text-black disabled:bg-neutral-200 disabled:text-neutral-400 disabled:border-neutral-200",
    outline: "bg-white text-black active:bg-black active:text-white disabled:text-neutral-300 disabled:border-neutral-200",
    ghost: "border-transparent text-neutral-500 active:text-black normal-case tracking-normal font-medium",
  };
  return (
    <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
      {children}
    </button>
  );
}

function SeatMeter({ taken, cap, size = "md" }) {
  const dim = size === "sm" ? "w-[8px] h-[13px]" : "w-[11px] h-[18px]";
  if (cap <= 24) {
    return (
      <div className="flex flex-wrap gap-[3px]">
        {Array.from({ length: cap }).map((_, i) => (
          <div key={i} className={`${dim} border border-black ${i < taken ? "bg-black" : "bg-white"}`} />
        ))}
      </div>
    );
  }
  const pct = cap ? Math.min(100, (taken / cap) * 100) : 0;
  return (
    <div className="relative h-[14px] w-full border border-black bg-white">
      <div className="absolute inset-y-0 left-0 bg-black transition-[width] duration-300" style={{ width: `${pct}%` }} />
    </div>
  );
}

/* ============================================================
   Root
   ============================================================ */
function App() {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);
  const [toast, setToast] = useState("");
  const [theme, setTheme] = useState(readTheme);
  const [justSignedUp, setJustSignedUp] = useState(false);
  const [gone, setGone] = useState(false);
  const flash = useCallback((m) => { setToast(m); setTimeout(() => setToast(""), 2800); }, []);

  useEffect(() => {
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* ignore */ }
    if (theme !== "auto") return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = () => applyTheme("auto");
    mq.addEventListener("change", onChange);
    return () => mq.removeEventListener("change", onChange);
  }, [theme]);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (raw) setSession(JSON.parse(raw));
    } catch (e) { /* ignore */ }
    setReady(true);
  }, []);

  /* Οι θυμημένες κρατήσεις ανήκουν σε έναν λογαριασμό. Σε αλλαγή
     λογαριασμού καθαρίζουν, αλλιώς ο επόμενος πελάτης θα έβλεπε
     ακυρώσεις που δεν είναι δικές του. */
  const login = (s, justSignedUp) => {
    writeKnown([]); ALERTED.clear(); resetAlerted();
    setJustSignedUp(!!justSignedUp);
    setSession(s);
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ }
  };
  const logout = () => {
    writeKnown([]); ALERTED.clear(); resetAlerted();
    setJustSignedUp(false);
    setSession(null);
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
  };

  /* Ο λογαριασμός δεν υπάρχει πια στη βάση — τον έσβησε η διαχείριση.
     Βγαίνει έξω, καθαρίζουν όλα τα ίχνη του από τη συσκευή, και για να
     ξαναμπεί πρέπει να κάνει καινούρια εγγραφή. */
  const accountGone = useCallback(() => {
    unsubscribePush();
    writeKnown([]); ALERTED.clear(); resetAlerted(); writeHidden([]);
    try {
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(PUSH_ASKED_KEY);
    } catch (e) { /* ignore */ }
    setJustSignedUp(false);
    setSession(null);
    setGone(true);
  }, []);

  if (!ready) {
    return <div style={FONT} className="gym-root flex h-full items-center justify-center bg-white text-[15px] text-neutral-400">Φόρτωση…</div>;
  }

  return (
    <div style={FONT} className="gym-root h-full overflow-hidden bg-white text-black">
      {gone
        ? <AccountGone onDone={() => setGone(false)} />
        : !session
          ? <SignIn onLogin={login} flash={flash} />
          : <ClientApp session={session} onLogout={logout} onAccountGone={accountGone}
              justSignedUp={justSignedUp} clearSignedUp={() => setJustSignedUp(false)}
              flash={flash} theme={theme} setTheme={setTheme} />}
      <Toast msg={toast} />
    </div>
  );
}

function PushPrompt({ session, onClose, flash }) {
  const [busy, setBusy] = useState(false);
  const needsInstall = isIOS() && !isStandalone();

  const yes = async () => {
    setBusy(true);
    const r = await subscribePush(session.clientId);
    setBusy(false);
    markPushAsked();
    if (r.ok) flash("Οι ειδοποιήσεις ενεργοποιήθηκαν");
    else if (r.error === "denied") flash("Δεν δόθηκε άδεια — μπορείς να το κάνεις αργότερα");
    else flash("Κάτι πήγε στραβά, δοκίμασε από τις ρυθμίσεις");
    onClose();
  };

  const no = () => { markPushAsked(); onClose(); };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto bg-black/50 px-4 py-6"
      onClick={no}>

            <ol className="f-text mt-2 space-y-1 text-[13px] leading-relaxed text-neutral-600">
              <li>1. Πάτα το κουμπί κοινοποίησης του Safari (τετράγωνο με βέλος).</li>
              <li>2. Διάλεξε «Προσθήκη στην οθόνη Home».</li>
              <li>3. Άνοιξε την εφαρμογή από το νέο εικονίδιο.</li>
            </ol>
            <Button className="mt-5 w-full" onClick={no}>Κατάλαβα</Button>
          </>
        ) : (
          <>
            <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
              Θα σε ειδοποιούμε όταν ελευθερώνεται θέση από τη λίστα αναμονής, όταν
              ακυρώνεται κράτησή σου, και λίγο πριν την προπόνηση. Μπορείς να το

        )}

  );

/* ============================================================
   Sign in
   ============================================================ */
function SignIn({ onLogin, flash }) {
  const [mode, setMode] = useState(null);
  const [firstName, setFirstName] = useState("");
  const [lastName, setLastName] = useState("");
  const [phone, setPhone] = useState("");
  const [email, setEmail] = useState("");
  const [marketing, setMarketing] = useState(false);
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [forgot, setForgot] = useState(false);

  const resetFields = () => {
    setFirstName(""); setLastName(""); setPhone("");
    setEmail(""); setMarketing(false); setPin(""); setErr("");
    setForgot(false);
  };
  const digits = (v, max) => v.replace(/\D/g, "").slice(0, max);

  const signInClient = async () => {
    const cleanPhone = digits(phone, 10);
    if (cleanPhone.length < 10) { setErr("Γράψε το κινητό σου (10 ψηφία)"); return; }
    if (!/^\d{4}$/.test(pin)) { setErr("Ο κωδικός έχει 4 ψηφία"); return; }
    setBusy(true);
    const { data, error } = await sb.rpc("sign_in_client", { p_phone: cleanPhone, p_pin: pin });
    setBusy(false);
    if (error || !data?.ok) { setErr(data?.error || "Κάτι πήγε στραβά, δοκίμασε ξανά"); return; }
    onLogin({ clientId: data.client_id, firstName: data.first_name, lastName: data.last_name });
  };

  const createClient = async () => {
    const fn = firstName.trim(), ln = lastName.trim();
    const cleanPhone = digits(phone, 10);
    const cleanEmail = email.trim();
    if (!fn) { setErr("Γράψε το όνομά σου"); return; }
    if (!ln) { setErr("Γράψε το επώνυμό σου"); return; }
    if (cleanPhone.length < 10) { setErr("Το κινητό θέλει 10 ψηφία"); return; }
    if (cleanEmail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(cleanEmail)) {
      setErr("Το email δεν φαίνεται σωστό"); return;
    }
    if (marketing && !cleanEmail) { setErr("Για ενημερώσεις χρειάζεται email"); return; }
    if (!/^\d{4}$/.test(pin)) { setErr("Ο κωδικός έχει 4 ψηφία"); return; }
    setBusy(true);
    const { data, error } = await sb.rpc("sign_up_client", {
      p_first_name: fn, p_last_name: ln, p_phone: cleanPhone, p_pin: pin,
      p_email: cleanEmail || null, p_marketing: marketing,
    });
    setBusy(false);
    if (error || !data?.ok) { setErr(data?.error || "Κάτι πήγε στραβά, δοκίμασε ξανά"); return; }
    /* Καινούρια συσκευή, καινούριος λογαριασμός: ξαναρωτάμε για
       ειδοποιήσεις ακόμα κι αν είχε ξαναρωτηθεί από άλλον πελάτη. */
    try { localStorage.removeItem(PUSH_ASKED_KEY); } catch (e) { /* ignore */ }
    onLogin({ clientId: data.client_id, firstName: fn, lastName: ln }, true);
  };

  return (
    <div className="mx-auto flex h-full max-w-md flex-col justify-between overflow-hidden px-6 pb-20"
      style={{ paddingTop: "calc(env(safe-area-inset-top) + 24px)" }}>
      <div>
        <div className="f-display text-[13px] font-bold uppercase tracking-[0.18em] text-neutral-400">{GYM_NAME}</div>
        <div className="mt-5"><ScoreboardClock /></div>
        <h1 className="f-display mt-6 text-[38px] font-extrabold uppercase leading-[0.95] tracking-tight">
          Κράτησε την ώρα σου<br />σε δέκα δευτερόλεπτα
        </h1>
      </div>

      <div className="mt-8">
        {!mode && (
          <div className="space-y-3">
            <Button size="lg" onClick={() => { resetFields(); setMode("in"); }}>Σύνδεση πελάτη</Button>
            <Button size="lg" variant="outline" onClick={() => { resetFields(); setMode("new"); }}>Νέος πελάτης</Button>
          </div>
        )}

        {mode === "in" && (
          <div>
            <div className="f-text mb-3 text-[13px] text-neutral-500">Κινητό και προσωπικός κωδικός</div>
            <div className="space-y-2">
              <input value={phone} onChange={(e) => { setPhone(digits(e.target.value, 10)); setErr(""); }}
                inputMode="numeric" placeholder="Κινητό (π.χ. 6971234567)"
                className="f-mono h-12 w-full border border-black px-4 text-[16px] outline-none" />
              <input value={pin} onChange={(e) => { setPin(digits(e.target.value, 4)); setErr(""); }}
                inputMode="numeric" placeholder="Κωδικός (4 ψηφία)" type="password"
                className="f-mono h-12 w-full border border-black px-4 text-[15px] tracking-[0.3em] outline-none" />
            </div>
            <Button className="mt-3 w-full" disabled={busy} onClick={signInClient}>{busy ? "Σύνδεση…" : "Σύνδεση"}</Button>
            {err && <div className="f-text mt-2 text-[13px] text-neutral-500">{err}</div>}

            <button onClick={() => setForgot(!forgot)}
              className="f-text mt-3 text-[13px] text-neutral-500 underline underline-offset-4">
              Ξέχασα τον κωδικό μου
            </button>
            {forgot && (
              <div className="f-text mt-2 border border-black p-3 text-[13px] leading-relaxed text-neutral-700">
                Για την ασφάλειά σου ο κωδικός δεν στέλνεται. Πέρνα από τη γραμματεία
                ή τηλεφώνησε στο γυμναστήριο και θα σου δώσουν καινούριο.
              </div>
            )}

            <Button variant="ghost" className="mt-2" onClick={() => { setMode(null); setErr(""); setForgot(false); }}>Πίσω</Button>
          </div>
        )}

        {mode === "new" && (
          <div>
            <div className="f-text mb-3 text-[13px] text-neutral-500">Δημιουργία λογαριασμού</div>
            <div className="space-y-2">
              <input value={firstName} onChange={(e) => { setFirstName(e.target.value); setErr(""); }}
                placeholder="Όνομα" className="f-text h-12 w-full border border-black px-4 text-[16px] outline-none" />
              <input value={lastName} onChange={(e) => { setLastName(e.target.value); setErr(""); }}
                placeholder="Επώνυμο" className="f-text h-12 w-full border border-black px-4 text-[16px] outline-none" />
              <input value={phone} onChange={(e) => { setPhone(digits(e.target.value, 10)); setErr(""); }}
                inputMode="numeric" placeholder="Κινητό" className="f-mono h-12 w-full border border-black px-4 text-[16px] outline-none" />
              <input value={email} onChange={(e) => { setEmail(e.target.value); setErr(""); }}
                type="email" inputMode="email" autoCapitalize="none" placeholder="Email (προαιρετικό)"
                className="f-text h-12 w-full border border-black px-4 text-[16px] outline-none" />
              <input value={pin} onChange={(e) => { setPin(digits(e.target.value, 4)); setErr(""); }}
                inputMode="numeric" placeholder="Κωδικός (4 ψηφία)" type="text"
                className="f-mono h-12 w-full border border-black px-4 text-[15px] tracking-[0.3em] outline-none" />
            </div>

            <button onClick={() => { setMarketing(!marketing); setErr(""); }}
              className="mt-3 flex w-full items-start gap-3 border border-black p-3 text-left">
              <span className={`mt-[1px] flex h-5 w-5 shrink-0 items-center justify-center border border-black ${marketing ? "bg-black" : "bg-white"}`}>
                {marketing && <span className="f-display text-[13px] font-bold leading-none text-white">✓</span>}
              </span>
              <span className="f-text text-[13px] leading-snug text-neutral-700">
                Θέλω να λαμβάνω ενημερώσεις στο email για ομαδικά προγράμματα και προσφορές.
              </span>
            </button>
            <Button className="mt-3 w-full" disabled={busy} onClick={createClient}>{busy ? "Δημιουργία…" : "Δημιουργία"}</Button>
            {err && <div className="f-text mt-2 text-[13px] text-neutral-500">{err}</div>}
            <Button variant="ghost" className="mt-2" onClick={() => { setMode(null); setErr(""); }}>Πίσω</Button>
          </div>
        )}
      </div>
    </div>
  );
}

function ClientApp({ session, onLogout, onAccountGone, justSignedUp, clearSignedUp, flash, theme, setTheme }) {
  const [tab, setTab] = useState("book");
  const [askPush, setAskPush] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [notifs, setNotifs] = useState([]);
  const [cancelled, setCancelled] = useState([]);
  const [hidden, setHidden] = useState(readHidden);

  /* Ό,τι έσβησε ο πελάτης μένει σβηστό. Κρατάμε μόνο τα id που
     στέλνει ακόμα ο διακομιστής, για να μη φουσκώνει η λίστα. */
  const hideNotif = (id) => {
    setHidden((prev) => {
      const next = prev.includes(id) ? prev : [...prev, id];
      writeHidden(next);
      return next;
    });
  };
  const clearNotifs = () => {
    const next = notifs.map((n) => n.id);
    writeHidden(next);
    setHidden(next);
  };
  const visibleNotifs = notifs.filter((n) => !hidden.includes(n.id));

  useEffect(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get("checkin") === "1") setTab("checkin");
    } catch (e) { /* ignore */ }
  }, []);

  /* Όποιο κομμάτι της εφαρμογής κι αν εντοπίσει την ακύρωση, η
     μπάρα ανεβαίνει από εδώ. */
  useEffect(() => {
    cancelListener = (gone) => setCancelled((prev) => [...gone, ...prev]);
    if (PENDING.length) { setCancelled((prev) => [...PENDING.splice(0), ...prev]); }
    return () => { cancelListener = null; };
  }, []);

  const refresh = useCallback(async () => {
    /* Πρώτα: υπάρχει ακόμα ο λογαριασμός; Αν τον έσβησε η διαχείριση,
       βγαίνει έξω αμέσως και δεν φορτώνουμε τίποτα άλλο. */
    const who = await sb.rpc("client_status", { p_client_id: session.clientId });
    if (!who.error && who.data && who.data.exists === false) { onAccountGone(); return; }

    const [n, mine] = await Promise.all([
      sb.rpc("my_notifications", { p_client_id: session.clientId }),
      sb.rpc("my_bookings", { p_client_id: session.clientId }),
    ]);
    if (!n.error && n.data) { setNotifs(n.data); reportNotifications(n.data); }
    if (!mine.error && mine.data) reportBookings(mine.data.bookings || []);
  }, [session.clientId, onAccountGone]);

  /* Έλεγχος με το άνοιγμα, σε κάθε αλλαγή καρτέλας, κάθε μισό
     λεπτό, και κάθε φορά που ο πελάτης επιστρέφει στην εφαρμογή. */
  useEffect(() => { refresh(); }, [refresh, tab]);

  useEffect(() => {
    const id = setInterval(refresh, 30000);
    const onVisible = () => { if (document.visibilityState === "visible") refresh(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", refresh);
    return () => {
      clearInterval(id);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", refresh);
    };
  }, [refresh]);

  /* Το ποπ απ των ειδοποιήσεων. Βγαίνει μόλις μετά την εγγραφή, και
     μία μόνο φορά ανά συσκευή — αν η συσκευή είναι ήδη γραμμένη ή αν
     έχει ήδη απαντήσει, δεν εμφανίζεται καθόλου. */
  useEffect(() => {
    let alive = true;
    (async () => {
      if (pushAsked()) return;
      if (!pushSupported() && !(isIOS() && !isStandalone())) return;
      if (await hasPushSubscription()) { markPushAsked(); return; }
      if (!alive) return;
      /* Μικρή καθυστέρηση μετά την εγγραφή, για να προλάβει να δει
         πρώτα ότι μπήκε. */
      setTimeout(() => { if (alive) setAskPush(true); }, justSignedUp ? 900 : 2500);
    })();
    return () => { alive = false; };
  }, [justSignedUp]);

  useEffect(() => {
    if (notifs.length === 0) return;
    const live = new Set(notifs.map((x) => x.id));
    setHidden((prev) => {
      const next = prev.filter((id) => live.has(id));
      if (next.length === prev.length) return prev;
      writeHidden(next);
      return next;
    });
  }, [notifs]);

  return (
    <div className="mx-auto flex h-full max-w-md flex-col overflow-hidden">
      <header className="shrink-0 flex items-center justify-between border-b border-black bg-white px-5 pb-4"
        style={{ paddingTop: "calc(env(safe-area-inset-top) + 16px)" }}>
        <div>
          <div className="f-display text-[12px] font-bold uppercase tracking-[0.18em] text-neutral-400">{GYM_NAME}</div>
          <div className="f-text mt-1 text-[17px]">{session.firstName} {session.lastName}</div>
        </div>
        <button onClick={() => setSettingsOpen(!settingsOpen)} aria-label="Ρυθμίσεις"
          className={`flex h-11 w-11 shrink-0 items-center justify-center border border-black ${
            settingsOpen ? "bg-black text-white" : "bg-white text-black"}`}>
          <GearIcon />
        </button>
      </header>

      {cancelled.length > 0 && !notifs.some((n) => n.kind === "cancelled") && (
        <div className="mx-5 mt-4 shrink-0 border border-black bg-black text-white">
          {cancelled.map((c) => (
            <div key={c.id} className="flex items-start justify-between gap-3 border-b border-neutral-700 px-4 py-3 last:border-b-0">
              <div className="min-w-0">
                <div className="f-display text-[15px] font-bold uppercase leading-tight">
                  ⚠️ Το ραντεβού σου ακυρώθηκε !⚠️
                </div>
                <div className="f-text mt-1 text-[13px] opacity-70">{fmtDayLong(c.date)} · {c.time}</div>
              </div>
              <button aria-label="Κλείσιμο"
                onClick={() => setCancelled((prev) => prev.filter((x) => x.id !== c.id))}
                className="f-display shrink-0 text-[20px] leading-none opacity-70">×</button>
            </div>
          ))}
        </div>
      )}

      {visibleNotifs.length > 0 && !settingsOpen && (
        <div className="mx-5 mt-4 shrink-0 border border-black bg-black text-white">
          {visibleNotifs.map((n) => (
            <div key={n.id} className="flex items-start justify-between gap-3 border-b border-neutral-700 px-4 py-3 last:border-b-0">
              <div className="f-text min-w-0 text-[13px] leading-snug">{n.body}</div>
              <button aria-label="Διαγραφή" onClick={() => hideNotif(n.id)}
                className="f-display shrink-0 text-[20px] leading-none opacity-70">×</button>
            </div>
          ))}
          {visibleNotifs.length > 1 && (
            <button onClick={clearNotifs}
              className="f-display w-full border-t border-neutral-700 px-4 py-2.5 text-[12px] font-bold uppercase tracking-wide opacity-70">
              Διαγραφή όλων
            </button>
          )}
        </div>
      )}

      <main className="min-h-0 flex-1">
        {settingsOpen ? (
          <SettingsTab session={session} flash={flash} theme={theme} setTheme={setTheme} onLogout={onLogout} />
        ) : (
          <React.Fragment>
            {tab === "book" && <BookTab session={session} flash={flash} />}
            {tab === "mine" && <MyBookings session={session} flash={flash} />}
            {tab === "checkin" && <CheckinTab session={session} flash={flash} />}
          </React.Fragment>
        )}
      </main>

      <nav className="shrink-0 border-t border-black bg-white" style={{ borderTopWidth: "0.5px" }}>
        <div className="flex">
          {[["book", "Πρόγραμμα"], ["mine", "Κρατήσεις"]].map(([k, label], i) => (
            <button key={k} onClick={() => { setTab(k); setSettingsOpen(false); }}
              style={{ paddingBottom: "max(10px, env(safe-area-inset-bottom))", borderLeftWidth: i === 0 ? 0 : "0.5px" }}
              className={`f-display flex-1 border-l border-black pt-3 text-[15px] font-bold uppercase tracking-wide first:border-l-0 ${
                tab === k && !settingsOpen ? "bg-black text-white" : "bg-white text-neutral-500"}`}>
              {label}
            </button>
          ))}
        </div>
      </nav>

      {askPush && (
        <PushPrompt session={session} flash={flash}
          onClose={() => { setAskPush(false); if (clearSignedUp) clearSignedUp(); }} />
      )}
    </div>
  );
}

function BookTab({ session, flash }) {
  const [date, setDate] = useState(iso(new Date()));
  const [slots, setSlots] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busySlot, setBusySlot] = useState(null);
  const [mine, setMine] = useState({});
  const [myWaits, setMyWaits] = useState({});

  const days = useMemo(() => {
    const base = new Date(); base.setHours(0, 0, 0, 0);
    return Array.from({ length: MAX_DAYS_AHEAD + 1 }, (_, i) => iso(addDays(base, i)));
  }, []);

  const load = useCallback(async () => {
    setLoading(true);
    const [avail, mine] = await Promise.all([
      sb.rpc("day_availability", { p_date: date }),
      sb.rpc("my_bookings", { p_client_id: session.clientId }),
    ]);
    setLoading(false);
    if (!mine.error && mine.data) reportBookings(mine.data.bookings || []);
    if (avail.error) { flash("Δεν φορτώθηκε το πρόγραμμα"); return; }
    setSlots(avail.data || []);

    // Ποιες ώρες αυτής της ημέρας έχει ήδη κλείσει ο πελάτης.
    const map = {};
    const list = (mine.data && mine.data.bookings) || [];
    for (const b of list) if (b.date === date) map[b.time] = b;
    setMine(map);

    const waits = {};
    const wl = (mine.data && mine.data.waitlist) || [];
    for (const w of wl) if (w.date === date) waits[w.time] = true;
    setMyWaits(waits);
  }, [date, flash, session.clientId]);

  useEffect(() => { load(); }, [load]);

  const book = async (time) => {
    setBusySlot(time);
    const { data, error } = await sb.rpc("create_booking", { p_client_id: session.clientId, p_date: date, p_time: time });
    setBusySlot(null);
    if (error || !data?.ok) { flash(data?.error || "Κάτι πήγε στραβά"); return; }
    flash(`Κράτηση ${fmtDay(date)}, ${time}`);
    load();
  };

  const cancel = async (bookingId, time) => {
    setBusySlot(time);
    const { data, error } = await sb.rpc("cancel_booking", {
      p_client_id: session.clientId, p_booking_id: bookingId,
    });
    setBusySlot(null);
    if (error || !data?.ok) { flash(data?.error || "Κάτι πήγε στραβά"); return; }
    forgetBooking(bookingId);
    flash("Η κράτηση ακυρώθηκε");
    load();
  };

  const waitlist = async (time) => {
    setBusySlot(time);
    const { data, error } = await sb.rpc("join_waitlist", { p_client_id: session.clientId, p_date: date, p_time: time });
    setBusySlot(null);
    if (error || !data?.ok) { flash(data?.error || "Κάτι πήγε στραβά"); return; }
    flash("Μπήκες στη λίστα αναμονής");
  };

  return (
    <div className="flex h-full flex-col">
      <div className="shrink-0 mt-4 flex gap-2 overflow-x-auto px-5 pb-1">
        {days.map((d) => {
          const dd = parseISO(d), on = d === date;
          return (
            <button key={d} onClick={() => setDate(d)}
              className={`flex h-[66px] w-[58px] shrink-0 flex-col items-center justify-center border text-center ${
                on ? "border-black bg-black text-white" : "border-neutral-300 bg-white text-neutral-700"}`}>
              <span className="f-text text-[10px] uppercase text-neutral-400">{DAYS[dd.getDay()]}</span>
              <span className="f-mono mt-1 text-[18px] leading-none">{dd.getDate()}</span>
            </button>
          );
        })}
      </div>

      <div className="shrink-0 border-b border-black px-5 pt-4 pb-3">
        <h2 className="f-display text-[24px] font-extrabold uppercase tracking-tight">{fmtDayLong(date)}</h2>
        <p className="f-text mt-1 text-[13px] text-neutral-500">Διαθέσιμες ώρες και θέσεις που μένουν</p>
      </div>

      <div className="min-h-0 flex-1 overflow-y-auto">
      {loading ? (
        <div className="f-text px-5 py-10 text-[14px] text-neutral-400">Φόρτωση…</div>
      ) : (slots || []).length === 0 ? (
        <div className="px-5 py-16 text-center">
          <div className="f-display text-[34px] font-extrabold uppercase leading-none tracking-tight">
            Ξεκουράσου 🖤
          </div>
          <p className="f-text mt-3 text-[14px] text-neutral-500">
            Δεν υπάρχουν ώρες αυτή την ημέρα.
          </p>
        </div>
      ) : (
        <div className="divide-y divide-neutral-300 border-b border-black">
          {(slots || []).map((s) => {
            const full = s.taken >= s.capacity;
            const isBusy = busySlot === s.slot_time;
            return (
              <div key={s.slot_time} className="px-5 py-4">
                <div className="flex items-center justify-between gap-4">
                  <div className="min-w-0">
                    <FlipNum value={s.slot_time} className="f-mono block text-[28px] leading-none tracking-tight" />
                    <div className="mt-2">
                      {mine[s.slot_time] ? (
                        <span className="f-display border border-black px-2 py-1 text-[11px] font-bold uppercase tracking-wide">
                          Έχεις κράτηση
                        </span>
                      ) : (
                        <StatRow items={[
                          { value: full ? "0" : s.capacity - s.taken, label: "ελεύθερες" },
                          { value: `${s.taken}/${s.capacity}`, label: "" },
                        ]} />
                      )}
                    </div>
                  </div>
                  <div className="shrink-0">
                    {mine[s.slot_time] ? (
                      <Button variant="outline" size="sm" disabled={isBusy}
                        onClick={() => cancel(mine[s.slot_time].id, s.slot_time)}>
                        Ακύρωση
                      </Button>
                    ) : full ? (
                      <Button variant="outline" size="sm" disabled={isBusy || myWaits[s.slot_time]}
                        onClick={() => waitlist(s.slot_time)}>
                        {myWaits[s.slot_time] ? "Σε αναμονή" : "Αναμονή"}
                      </Button>
                    ) : (
                      <Button size="sm" disabled={isBusy} onClick={() => book(s.slot_time)}>Κράτηση</Button>
                    )}
                  </div>
                </div>
                <div className="mt-3.5"><SeatMeter taken={s.taken} cap={s.capacity} /></div>
              </div>
            );
          })}
        </div>
      )}
      <div className="h-6" />
      </div>
    </div>
  );
}

/* Εγγραφή αυτής της συσκευής στις push ειδοποιήσεις. */
function PushPanel({ session, flash }) {
  const [mode, setMode] = useState("checking"); // checking | unsupported | needs-install | off | on
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    (async () => {
      if (isIOS() && !isStandalone()) { setMode("needs-install"); return; }
      if (!pushSupported()) { setMode("unsupported"); return; }
      try {
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();

        /* Αν η εγγραφή έγινε με άλλο κλειδί VAPID, είναι άχρηστη —
           ο διακομιστής δεν μπορεί να της στείλει τίποτα. Τη σβήνουμε
           ώστε να ξαναγίνει σωστά. */
        if (sub && !matchesVapid(sub)) {
          try { await sb.rpc("delete_push_subscription", { p_endpoint: sub.endpoint }); } catch (e) { /* ignore */ }
          try { await sub.unsubscribe(); } catch (e) { /* ignore */ }
          sub = null;
        }

        /* Η συνδρομή ζει στη συσκευή, αλλά η γραμμή της στη βάση
           μπορεί να έχει σβηστεί — π.χ. όταν ένα παλιό push γύρισε
           404. Τότε το κινητό νομίζει ότι είναι γραμμένο, δείχνει τον
           διακόπτη ανοιχτό, και δεν ξαναγράφεται ποτέ. Την ξαναγράφουμε
           σε κάθε άνοιγμα· η βάση κάνει upsert, δεν διπλογράφεται. */
        if (sub) {
          const json = sub.toJSON();
          sb.rpc("save_push_subscription", {
            p_client_id: session.clientId,
            p_endpoint: sub.endpoint,
            p_p256dh: json.keys.p256dh,
            p_auth: json.keys.auth,
          });
        }

        setMode(sub ? "on" : "off");
      } catch (e) {
        setMode("off");
      }
    })();
  }, [session.clientId]);

  const enable = async () => {
    setBusy(true);
    const r = await subscribePush(session.clientId);
    setBusy(false);
    markPushAsked();
    if (!r.ok) {
      flash(r.error === "denied" ? "Δεν δόθηκε άδεια"
        : r.error === "save" ? "Δεν αποθηκεύτηκε" : "Κάτι πήγε στραβά");
      return;
    }
    setMode("on");
    flash("Οι ειδοποιήσεις ενεργοποιήθηκαν");
  };

  const disable = async () => {
    setBusy(true);
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await sb.rpc("delete_push_subscription", { p_endpoint: sub.endpoint });
        await sub.unsubscribe();
      }
      setMode("off");
      flash("Οι ειδοποιήσεις απενεργοποιήθηκαν");
    } catch (e) {
      flash("Κάτι πήγε στραβά");
    }
    setBusy(false);
  };

  const test = async () => {
    setBusy(true);
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(GYM_NAME, {
        body: "Δοκιμαστική ειδοποίηση. Αν τη βλέπεις, όλα δουλεύουν.",
        icon: "./icon-192.png",
        badge: "./icon-192.png",
        tag: "kinesis-test",
      });
    } catch (e) {
      flash("Δεν εμφανίστηκε");
    }
    setBusy(false);
  };

  if (mode === "checking" || mode === "unsupported") return null;

  return (
    <div className="mt-10 border border-black p-4">
      <div className="f-display text-[14px] font-bold uppercase tracking-wide">Ειδοποιήσεις</div>

      {mode === "needs-install" && (
        <>
          <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
            Στο iPhone οι ειδοποιήσεις δουλεύουν μόνο αν προσθέσεις πρώτα την εφαρμογή
            στην αρχική οθόνη και την ανοίξεις από εκεί:
          </p>
          <ol className="f-text mt-2 space-y-1 text-[13px] leading-relaxed text-neutral-600">
            <li>1. Πάτα το κουμπί κοινοποίησης του Safari (τετράγωνο με βέλος).</li>
            <li>2. Διάλεξε «Προσθήκη στην οθόνη Home».</li>
            <li>3. Άνοιξε την εφαρμογή από το νέο εικονίδιο.</li>
          </ol>
        </>
      )}

      {mode === "off" && (
        <>
          <p className="f-text mt-2 text-[13px] leading-relaxed text-neutral-600">
            Ενημέρωση όταν ελευθερώνεται θέση από τη λίστα αναμονής, όταν ακυρώνεται
            κράτησή σου, και υπενθύμιση πριν την προπόνηση.
          </p>
          <Button className="mt-4 w-full" disabled={busy} onClick={enable}>
            {busy ? "…" : "Ενεργοποίηση ειδοποιήσεων"}
          </Button>
        </>
      )}

      {mode === "on" && (
        <>
          <p className="f-text mt-2 text-[13px] text-neutral-600">
            Ενεργές σε αυτή τη συσκευή.
          </p>
          <Button variant="outline" className="mt-4 w-full" disabled={busy} onClick={test}>
            Δοκιμαστική ειδοποίηση
          </Button>
          <Button variant="ghost" className="mt-2 w-full" disabled={busy} onClick={disable}>
            {busy ? "…" : "Απενεργοποίηση"}
          </Button>
        </>
      )}
    </div>
  );
}

function CheckinTab({ session, flash }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const today = iso(new Date());

  const load = useCallback(async () => {
    setLoading(true);
    const { data: d, error } = await sb.rpc("my_bookings", { p_client_id: session.clientId });
    setLoading(false);
    if (error) { flash("Κάτι πήγε στραβά"); return; }
    setData(d);
    reportBookings((d && d.bookings) || []);
  }, [session.clientId, flash]);

  useEffect(() => { load(); }, [load]);

  const todays = (data?.bookings || []).filter((b) => b.date === today);
  const next = todays.find((b) => b.status === "booked");
  const done = todays.find((b) => b.status === "checked_in");

  const doCheckin = async (bookingId) => {
    setBusy(true);
    const { data: d, error } = await sb.rpc("check_in", { p_client_id: session.clientId, p_booking_id: bookingId });
    setBusy(false);
    if (error || !d?.ok) { flash(d?.error || "Κάτι πήγε στραβά"); return; }
    flash("Καλή προπόνηση");
    load();
  };

  return (
    <div className="h-full overflow-y-auto px-5">
      <h2 className="f-display pt-6 text-[24px] font-extrabold uppercase tracking-tight">Check-in</h2>
      <p className="f-text mt-1 text-[13px] leading-relaxed text-neutral-500">
        Σκάναρε το QR στην είσοδο ή ακούμπησε το κινητό στο NFC tag. Ανοίγει αυτή η οθόνη.
      </p>

      <div className="mt-8 border border-black p-6 text-center">
        {loading ? (
          <div className="f-text py-6 text-[15px] text-neutral-400">Φόρτωση…</div>
        ) : done ? (
          <>
            <div className="f-text text-[15px] text-neutral-500">Έγινε check-in</div>
            <FlipNum value={done.time} className="f-mono mt-2 block text-[44px] leading-none tracking-tight" />
            <div className="f-text mt-3 text-[13px] text-neutral-500">Καλή προπόνηση, {session.firstName}.</div>
          </>
        ) : next ? (
          <>
            <div className="f-text text-[15px] text-neutral-500">Η κράτησή σου σήμερα</div>
            <FlipNum value={next.time} className="f-mono mt-2 block text-[44px] leading-none tracking-tight" />
            <div className="mt-5">
              <Button size="lg" disabled={busy} onClick={() => doCheckin(next.id)}>{busy ? "…" : "Check-in τώρα"}</Button>
            </div>
          </>
        ) : (
          <div className="f-text py-6 text-[15px] text-neutral-500">Δεν έχεις κράτηση για σήμερα.</div>
        )}
      </div>
      <div className="h-10" />
    </div>
  );
}

/* Πιάνει σφάλματα που συμβαίνουν κατά τη σχεδίαση των components,
   τα οποία δεν φαίνονται αλλιώς (εμφανίζονται ως "Script error"). */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { err: null, info: null };
  }
  static getDerivedStateFromError(err) {
    return { err: err };
  }
  componentDidCatch(err, info) {
    this.setState({ err: err, info: info });
  }
  render() {
    if (this.state.err) {
      return (
        <div className="mx-auto flex min-h-full max-w-md flex-col items-center justify-center px-6 text-center">
          <div className="f-display text-[26px] font-extrabold uppercase leading-tight tracking-tight">
            Κάτι πήγε στραβά
          </div>
          <p className="f-text mt-3 text-[14px] leading-relaxed text-neutral-500">
            Δοκίμασε να ανανεώσεις τη σελίδα. Αν συνεχίσει, ενημέρωσε το γυμναστήριο.
          </p>
          <Button className="mt-6" onClick={() => window.location.reload()}>Ανανέωση</Button>
        </div>
      );
    }
    return this.props.children;
  }
}

/* Καταχώρηση του service worker — απαραίτητο για τα push. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => { /* αγνόησε */ });
  });
}

/* ---------- Ρυθμίσεις πριν το πρώτο render ----------
   Το όνομα του γυμναστηρίου φαίνεται στην πρώτη κιόλας οθόνη, οπότε
   το περιμένουμε. Αν ο διακομιστής αργήσει πάνω από 3 δευτερόλεπτα,
   ξεκινάμε με τις εφεδρικές τιμές αντί να μείνει η σελίδα κολλημένη
   στο «Φόρτωση…». */
async function loadAppSettings() {
  const timeout = new Promise((resolve) => setTimeout(() => resolve(null), 3000));
  const call = sb.rpc("app_settings", {}).then((r) => (r.error ? null : r.data)).catch(() => null);
  const data = await Promise.race([call, timeout]);
  if (!data) return;
  if (data.gym_name) GYM_NAME = data.gym_name;
  if (data.max_days_ahead) MAX_DAYS_AHEAD = data.max_days_ahead;
}

/* Το όνομα μπαίνει και στην καρτέλα του browser και στην ετικέτα που
   προτείνει το iPhone στο «Πρόσθεση στην αρχική οθόνη». */
function applyBrandToPage() {
  document.title = GYM_NAME;
  const meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (meta) meta.setAttribute("content", GYM_NAME);
  applyBrandToManifest();
  tellServiceWorker();
}

/* Οι push ειδοποιήσεις τις δείχνει ο service worker, που δεν βλέπει
   τις ρυθμίσεις. Του περνάμε το όνομα σε κάθε άνοιγμα. */
function tellServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.ready
    .then((reg) => { if (reg.active) reg.active.postMessage({ type: "brand", name: GYM_NAME }); })
    .catch(() => { /* αγνόησε */ });
}

/* Το manifest.json είναι στατικό αρχείο, οπότε το ξαναγράφουμε στη
   μνήμη με το σωστό όνομα και το δίνουμε ως blob. Οι διαδρομές των
   εικονιδίων γίνονται απόλυτες, αλλιώς το blob δεν ξέρει πού να τις
   ψάξει. Αν κάτι πάει στραβά, μένει το αρχικό link — χάνεται μόνο το
   όνομα, όχι η εγκατάσταση. */
async function applyBrandToManifest() {
  try {
    const link = document.querySelector('link[rel="manifest"]');
    if (!link) return;
    const res = await fetch(link.href);
    if (!res.ok) return;
    const m = await res.json();
    m.name = GYM_NAME;
    m.short_name = GYM_NAME;
    const abs = (u) => new URL(u, link.href).href;
    if (m.start_url) m.start_url = abs(m.start_url);
    if (m.scope) m.scope = abs(m.scope);
    for (const i of m.icons || []) i.src = abs(i.src);
    for (const sc of m.shortcuts || []) {
      if (sc.url) sc.url = abs(sc.url);
      for (const i of sc.icons || []) i.src = abs(i.src);
    }
    const blob = new Blob([JSON.stringify(m)], { type: "application/manifest+json" });
    link.href = URL.createObjectURL(blob);
  } catch (e) { /* μένει το στατικό manifest */ }
}

loadAppSettings().then(() => {
  applyBrandToPage();
  ReactDOM.createRoot(document.getElementById("root")).render(
    <ErrorBoundary><App /></ErrorBoundary>
  );
});
</script>
